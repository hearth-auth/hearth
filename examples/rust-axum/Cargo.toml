[package]
name = "hearth-axum-example"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hearth-axum-example"
path = "src/main.rs"

[dependencies]
axum = "0.7"
hearth = { path = "../../hearth" }
jsonwebtoken = "9"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
