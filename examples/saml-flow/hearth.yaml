# Hearth configuration for the SAML 2.0 demo.
#
# Runs Hearth with a single realm `demo` that is a SAML service provider
# federated against a local fake IdP (fields under
# `federation.providers.local-idp` with `type: saml`).
#
# The realm's RSA signing key is generated lazily the first time the SP
# metadata is served. The Node driver fetches that metadata at runtime.

server:
  bind_address: "127.0.0.1"
  port: 8420
  default_realm: demo

storage:
  data_dir: "./data/saml-flow"
  fsync: false

observability:
  log_level: info
  log_format: text

onboarding:
  enabled: true
  base_url: "http://localhost:8420"

oidc:
  issuer: "http://localhost:8420"

realms:
  demo:
    federation:
      # WARNING: `auto` is an account-takeover risk — it links an upstream
      # identity to whatever local account already holds that email address with
      # no local re-auth, so an IdP that does not verify email can hand an
      # attacker a victim's existing Hearth account, roles included. Keep
      # `confirm` unless the realm federates to one high-trust, email-verifying
      # IdP.
      link_existing_accounts: confirm
      providers:
        # SP-side: Hearth consumes assertions from this upstream IdP.
        # The driver injects its generated cert into this field at boot
        # (via envsubst in run.sh) because the IdP keypair is generated
        # fresh each run.
        local-idp:
          type: saml
          entity_id: "http://localhost:9190/saml/metadata"
          sso_url: "http://localhost:9190/saml/sso"
          slo_url: "http://localhost:9190/saml/slo"
          idp_certificate_pem: |
            __IDP_CERT_PEM__
          sign_authn_requests: false
          want_assertions_signed: false
          attribute_map:
            email: "NameID"
            display_name: "http://schemas.xmlsoap.org/claims/CommonName"
