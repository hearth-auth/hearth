[project]
name = "hearth-sdk"
version = "1.0.0"
description = "Hearth identity platform Python SDK"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "cryptography>=41",
    "pydantic>=2",
    # Runtime of the generated admin client (hearth.generated.admin).
    "attrs>=22.2",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110",
    "pydantic-settings>=2",
]
django = [
    "django>=4.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fastapi>=0.110",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "django>=4.0",
    # Exact pin: a ruff upgrade changes the rule set and the formatter, so it
    # is a deliberate edit here, not something a fresh CI install picks up.
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearth"]

# Lint + format: `ruff check .` and `ruff format --check .` (CI: sdk-python job).
# The rule set is ruff's default for the pinned version above; target-version
# follows requires-python.
[tool.ruff]
# Python sources only: README code samples are prose, not package code.
# The generated admin client is gen-admin.sh output (formatted by it, never
# edited by hand), so it is not linted.
extend-exclude = ["*.md", "src/hearth/generated"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]
