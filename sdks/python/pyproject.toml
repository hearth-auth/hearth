[project]
name = "hearth-sdk"
version = "1.0.0"
description = "Hearth identity platform Python SDK"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "cryptography>=41",
    "pydantic>=2",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110",
    "pydantic-settings>=2",
]
django = [
    "django>=4.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fastapi>=0.110",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "django>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearth"]
