[package]
name = "hearth-sdk"
version = "0.2.0"
edition = "2021"
description = "Hearth identity platform Rust SDK"
license = "MIT"

[workspace]

[features]
## Enables the Tower middleware ([`middleware::RequirePermissionLayer`]).
## Adds `tower` and `http` as dependencies.
tower-middleware = ["dep:tower", "dep:http"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["serde"] }
thiserror = "2"
tower = { version = "0.4", optional = true }
http = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
