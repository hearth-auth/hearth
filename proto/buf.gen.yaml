version: v2
plugins:
  # Pin the remote plugin version so `buf generate` is deterministic across
  # local and CI. Leaving it unpinned lets buf.build resolve to the latest
  # release, which silently drifts the generated header (e.g. v2.12.1 → v2.13.0)
  # and breaks `make proto-check` on unrelated PRs. Bump this deliberately.
  - remote: buf.build/bufbuild/es:v2.13.0
    out: ../sdks/typescript/src/generated
    opt:
      - target=ts
  - remote: buf.build/protocolbuffers/go
    out: ../sdks/go/generated
    opt:
      - paths=source_relative
  # OpenAPI generation is NOT part of buf generate. It is handled separately
  # by `make openapi` (scripts/merge_openapi.py) which merges the proto-derived
  # Swagger 2.0 JSON with the hand-written supplement. Run `make openapi-check`
  # to verify docs/api/openapi.json is up to date (HEA-972).
