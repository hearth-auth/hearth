# Remote plugin versions MUST stay pinned. An unpinned `remote:` resolves to
# whatever the BSR currently serves, so `make proto-check` starts failing on
# every branch the moment upstream publishes a release — the generated files
# in git were produced by the older plugin and no longer match. That happened
# with protoc-gen-es v2.12.1 -> v2.13.0 and broke CI repo-wide (HEA-1862).
#
# These versions match the `@generated by` stamps committed under
# sdks/typescript/src/generated and sdks/go/generated. To upgrade a plugin,
# bump it here and run `make proto-gen` in the same commit.
version: v2
plugins:
  # Pin the remote plugin version so `buf generate` is deterministic across
  # local and CI. Leaving it unpinned lets buf.build resolve to the latest
  # release, which silently drifts the generated header (e.g. v2.12.1 → v2.13.0)
  # and breaks `make proto-check` on unrelated PRs. Bump this deliberately.
  - remote: buf.build/bufbuild/es:v2.13.0
    out: ../sdks/typescript/src/generated
    opt:
      - target=ts
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../sdks/go/generated
    opt:
      - paths=source_relative
  # The proto-derived Swagger 2.0 document. `make openapi`
  # (scripts/merge_openapi.py) merges it with the hand-written supplement into
  # docs/api/openapi.json, which the SDK admin-client generators consume.
  # Before this plugin was wired in, the Swagger file was edited by hand and
  # drifted from the proto (wrong verbs, 35 missing schemas).
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.27.3
    out: ../docs/api
    opt:
      - allow_merge=true
      - merge_file_name=openapi_proto_derived
      - json_names_for_fields=true
