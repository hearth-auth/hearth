syntax = "proto3";

package hearth.identity.v1;

import "google/api/annotations.proto";

option go_package = "github.com/hearthdb/hearth/sdks/go/generated/identity/v1;identityv1";

// The lifecycle status of a user account.
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DISABLED = 2;
  USER_STATUS_PENDING_VERIFICATION = 3;
}

// The lifecycle status of a realm.
enum RealmStatus {
  REALM_STATUS_UNSPECIFIED = 0;
  REALM_STATUS_ACTIVE = 1;
  REALM_STATUS_SUSPENDED = 2;
}

// A user record within a realm.
message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  UserStatus status = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  string first_name = 7;
  string last_name = 8;
  // Actions the user must complete before full access is granted.
  // Values: "VERIFY_EMAIL", "UPDATE_PASSWORD".
  repeated string required_actions = 9;
}

// An authentication session bound to a user.
message Session {
  string id = 1;
  string user_id = 2;
  int64 created_at = 3;
  int64 expires_at = 4;
  int64 last_refreshed_at = 5;
}

// Per-realm configuration overrides.
message RealmConfig {
  optional int64 session_ttl_micros = 1;
  optional uint32 password_memory_cost = 2;
  optional uint32 password_time_cost = 3;
}

// A realm record.
message Realm {
  string id = 1;
  string name = 2;
  RealmStatus status = 3;
  RealmConfig config = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

// Request to create a new user.
message CreateUserRequest {
  string email = 1;
  string display_name = 2;
  string first_name = 3;
  string last_name = 4;
  map<string, string> attributes = 5;
}

// Request to update an existing user.
message UpdateUserRequest {
  optional string email = 1;
  optional string display_name = 2;
  optional UserStatus status = 3;
  optional string first_name = 4;
  optional string last_name = 5;
  // When non-empty, replaces the user's entire custom attribute map.
  // An empty map is treated as "no change"; use clear_attributes to remove all.
  map<string, string> attributes = 6;
  // When true and attributes is empty, clears all custom attributes.
  bool clear_attributes = 7;
}

// Request to create a new realm.
message CreateRealmRequest {
  string name = 1;
  optional RealmConfig config = 2;
}

// Request to update an existing realm.
message UpdateRealmRequest {
  optional string name = 1;
  optional RealmStatus status = 2;
  optional RealmConfig config = 3;
}

// A cursor-based page of users.
message UserPage {
  repeated User items = 1;
  optional string next_cursor = 2;
}

// A cursor-based page of realms.
message RealmPage {
  repeated Realm items = 1;
  optional string next_cursor = 2;
}

// A single entry in a bulk operation result.
message BulkResultEntry {
  uint32 index = 1;
  bool success = 2;
  // On success: the created/modified resource serialized as JSON.
  optional User user = 3;
  // On failure: error description.
  optional string error = 4;
}

// Result of a bulk operation.
message BulkResult {
  repeated BulkResultEntry results = 1;
}

// ---------------------------------------------------------------------------
// Organizations
// ---------------------------------------------------------------------------

// The lifecycle status of an organization.
enum OrganizationStatus {
  ORGANIZATION_STATUS_UNSPECIFIED = 0;
  ORGANIZATION_STATUS_ACTIVE = 1;
  ORGANIZATION_STATUS_SUSPENDED = 2;
}

// An organization (B2B customer group) within a realm.
message Organization {
  string id = 1;
  string realm_id = 2;
  string slug = 3;
  string display_name = 4;
  OrganizationStatus status = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  optional uint32 member_limit = 8;
  map<string, string> attributes = 9;
}

// Request to create a new organization.
message CreateOrganizationRequest {
  string slug = 1;
  string display_name = 2;
  optional uint32 member_limit = 3;
  map<string, string> attributes = 4;
}

// Request to update an existing organization.
message UpdateOrganizationRequest {
  optional string slug = 1;
  optional string display_name = 2;
  optional OrganizationStatus status = 3;
  optional uint32 member_limit = 4;
  // When non-empty, replaces the organization's entire custom attribute map.
  // An empty map is treated as "no change"; use clear_attributes to remove all.
  map<string, string> attributes = 5;
  // When true and attributes is empty, clears all custom attributes.
  bool clear_attributes = 6;
}

// A cursor-based page of organizations.
message OrganizationPage {
  repeated Organization items = 1;
  optional string next_cursor = 2;
}

// ---------------------------------------------------------------------------
// Request wrappers for admin RPCs
// ---------------------------------------------------------------------------

// Request to fetch a user by id.
message GetUserRequest {
  string id = 1;
}

// Request to delete a user by id.
message DeleteUserRequest {
  string id = 1;
}

// Request to list users with optional pagination.
message ListUsersRequest {
  optional string cursor = 1;
  optional uint32 limit = 2;
}

// Wraps an UpdateUserRequest with the target id.
message UpdateUserCall {
  string id = 1;
  UpdateUserRequest body = 2;
}

// Request to list realms.
message ListRealmsRequest {
  optional string cursor = 1;
  optional uint32 limit = 2;
}

// Request to fetch a realm by id.
message GetRealmRequest {
  string id = 1;
}

// Request to delete a realm by id.
message DeleteRealmRequest {
  string id = 1;
}

// Wraps an UpdateRealmRequest with the target id.
message UpdateRealmCall {
  string id = 1;
  UpdateRealmRequest body = 2;
}

// Request to list organizations.
message ListOrganizationsRequest {
  optional string cursor = 1;
  optional uint32 limit = 2;
}

// Request to fetch an organization by id.
message GetOrganizationRequest {
  string id = 1;
}

// Request to delete an organization by id.
message DeleteOrganizationRequest {
  string id = 1;
}

// Wraps an UpdateOrganizationRequest with the target id.
message UpdateOrganizationCall {
  string id = 1;
  UpdateOrganizationRequest body = 2;
}

// Empty response type for delete RPCs.
message Empty {}

// ---------------------------------------------------------------------------
// Agents (AGENT_AUTH.md Phase A, HEA-1405)
// ---------------------------------------------------------------------------

// Lifecycle status of an agent.
enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_ACTIVE = 1;
  AGENT_STATUS_SUSPENDED = 2;
  AGENT_STATUS_REVOKED = 3;
}

// Discriminates the type of credential stored for an agent.
enum AgentCredentialKind {
  AGENT_CREDENTIAL_KIND_UNSPECIFIED = 0;
  AGENT_CREDENTIAL_KIND_API_KEY = 1;
  AGENT_CREDENTIAL_KIND_ED25519_PUBLIC_KEY = 2;
  AGENT_CREDENTIAL_KIND_MTLS_CERT = 3;
}

// An autonomous agent registered within a realm.
message Agent {
  string id = 1;
  string realm_id = 2;
  // Owner type: "user" or "organization".
  string owner_type = 3;
  // UUID of the owning user or organization.
  string owner_id = 4;
  string display_name = 5;
  string description = 6;
  repeated string capabilities = 7;
  AgentStatus status = 8;
  uint32 max_delegation_depth = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

// A stored agent credential record (no secret material).
message AgentCredential {
  string id = 1;
  string agent_id = 2;
  AgentCredentialKind kind = 3;
  string label = 4;
  int64 created_at = 5;
  optional int64 revoked_at = 6;
}

// A cursor-based page of agents.
message AgentPage {
  repeated Agent items = 1;
  optional string next_cursor = 2;
}

// A cursor-based page of agent credentials.
message AgentCredentialPage {
  repeated AgentCredential items = 1;
}

// Request to list agents in a realm.
message ListAgentsRequest {
  optional string owner_id = 1;
  optional AgentStatus status = 2;
  optional string capability = 3;
  optional string cursor = 4;
  optional uint32 limit = 5;
}

// Request to fetch a single agent.
message GetAgentRequest {
  string id = 1;
}

// Request to create a new agent.
message CreateAgentRequest {
  string display_name = 1;
  optional string description = 2;
  // Owner type: "user" or "organization".
  string owner_type = 3;
  // UUID of the owning user or organization.
  string owner_id = 4;
  repeated string capabilities = 5;
  // Maximum delegation depth (1–10, default 1).
  uint32 max_delegation_depth = 6;
}

// Fields that may be updated on an agent.
message UpdateAgentRequest {
  optional string display_name = 1;
  optional string description = 2;
  repeated string capabilities = 3;
  optional uint32 max_delegation_depth = 4;
}

// Wraps an UpdateAgentRequest with the target id.
message UpdateAgentCall {
  string id = 1;
  UpdateAgentRequest body = 2;
}

// Request to delete an agent.
message DeleteAgentRequest {
  string id = 1;
}

// Request to issue an API key for an agent.
message CreateAgentApiKeyRequest {
  string agent_id = 1;
  string label = 2;
}

// Response from creating an agent API key.
// The `key` field is the raw plaintext key — shown exactly once.
message CreateAgentApiKeyResponse {
  AgentCredential credential = 1;
  // The plaintext API key. Show to the user once and discard.
  string key = 2;
}

// Request to list credentials for an agent.
message ListAgentCredentialsRequest {
  string agent_id = 1;
}

// Request to revoke a single agent credential.
message RevokeAgentCredentialRequest {
  string agent_id = 1;
  string credential_id = 2;
}

// ---------------------------------------------------------------------------
// Admin service — realm context is supplied via the `x-realm-id` request
// metadata, authenticated via the admin interceptor (bearer token + RBAC
// admin permission check). Rate-limited to 100 req/min per admin user,
// shared with the REST admin surface.
// ---------------------------------------------------------------------------

service IdentityAdminService {
  // Users
  rpc ListUsers(ListUsersRequest) returns (UserPage) {
    option (google.api.http) = {get: "/admin/users"};
  }
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/admin/users/{id}"};
  }
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/admin/users"
      body: "*"
    };
  }
  rpc UpdateUser(UpdateUserCall) returns (User) {
    option (google.api.http) = {
      patch: "/admin/users/{id}"
      body: "body"
    };
  }
  rpc DeleteUser(DeleteUserRequest) returns (Empty) {
    option (google.api.http) = {delete: "/admin/users/{id}"};
  }

  // Realms — operate against the system realm (mutations require admin in
  // the system realm). `x-realm-id` metadata is ignored for these RPCs.
  rpc ListRealms(ListRealmsRequest) returns (RealmPage) {
    option (google.api.http) = {get: "/admin/realms"};
  }
  rpc GetRealm(GetRealmRequest) returns (Realm) {
    option (google.api.http) = {get: "/admin/realms/{id}"};
  }
  rpc CreateRealm(CreateRealmRequest) returns (Realm) {
    option (google.api.http) = {
      post: "/admin/realms"
      body: "*"
    };
  }
  rpc UpdateRealm(UpdateRealmCall) returns (Realm) {
    option (google.api.http) = {
      patch: "/admin/realms/{id}"
      body: "body"
    };
  }
  rpc DeleteRealm(DeleteRealmRequest) returns (Empty) {
    option (google.api.http) = {delete: "/admin/realms/{id}"};
  }

  // Organizations — gRPC-only (no REST routes yet; see HEA-969).
  rpc ListOrganizations(ListOrganizationsRequest) returns (OrganizationPage);
  rpc GetOrganization(GetOrganizationRequest) returns (Organization);
  rpc CreateOrganization(CreateOrganizationRequest) returns (Organization);
  rpc UpdateOrganization(UpdateOrganizationCall) returns (Organization);
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (Empty);

  // Agents — Phase A (HEA-1405).
  rpc ListAgents(ListAgentsRequest) returns (AgentPage) {
    option (google.api.http) = {get: "/v1/agents"};
  }
  rpc GetAgent(GetAgentRequest) returns (Agent) {
    option (google.api.http) = {get: "/v1/agents/{id}"};
  }
  rpc CreateAgent(CreateAgentRequest) returns (Agent) {
    option (google.api.http) = {
      post: "/v1/agents"
      body: "*"
    };
  }
  rpc UpdateAgent(UpdateAgentCall) returns (Agent) {
    option (google.api.http) = {
      patch: "/v1/agents/{id}"
      body: "body"
    };
  }
  rpc DeleteAgent(DeleteAgentRequest) returns (Empty) {
    option (google.api.http) = {delete: "/v1/agents/{id}"};
  }
  rpc CreateAgentApiKey(CreateAgentApiKeyRequest) returns (CreateAgentApiKeyResponse) {
    option (google.api.http) = {
      post: "/v1/agents/{agent_id}/credentials/keys"
      body: "*"
    };
  }
  rpc ListAgentCredentials(ListAgentCredentialsRequest) returns (AgentCredentialPage) {
    option (google.api.http) = {get: "/v1/agents/{agent_id}/credentials"};
  }
  rpc RevokeAgentCredential(RevokeAgentCredentialRequest) returns (Empty) {
    option (google.api.http) = {delete: "/v1/agents/{agent_id}/credentials/{credential_id}"};
  }
}
