[advisories]
ignore = []

[licenses]
# cargo-deny 0.14+ uses a pure allowlist model: any license (or no license) not
# in `allow` is implicitly rejected. This is stricter than a dual allow/deny
# approach — no OR-expression loophole (e.g. "MIT OR GPL-3.0" fails because
# GPL-3.0 is not in the allow list, even if MIT is).
#
# Policies this enforces:
#  - Unlicensed packages: rejected (no license string → no allow-list match)
#  - Copyleft families (GPL, AGPL, LGPL, SSPL, BUSL, OSL, EUPL, CDDL, CPL, EPL):
#    rejected (not listed here)
#  - All other non-permissive licenses: rejected by default
#
# PROJECT LICENSE: Hearth is Apache-2.0. AGPL is banned for ALL crates in this
# workspace, including the hearth crate itself. Do NOT add an
# [[licenses.exceptions]] entry allowing AGPL here. See ARCHITECTURE.md §15.1.
allow = [
    "Apache-2.0",
    # Apache-2.0 WITH LLVM-exception: used by 17 Bytecode Alliance / WASI packages
    # (e.g. wasm-encoder, wast, wit-parser). The LLVM exception only adds permissions
    # (allows linking with non-GPL-compatible runtime libraries); it is a strict superset
    # of plain Apache-2.0 for our purposes.
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    # MIT-0: MIT with the attribution clause removed (more permissive than MIT).
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "0BSD",
    # Unlicense: public-domain dedication; used by ~8 packages in the tree.
    "Unlicense",
    # CC0-1.0: public-domain dedication with patent/copyright waiver; used by 1 package.
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]

# r-efi ships as "Apache-2.0 OR LGPL-2.0-or-later". We elect Apache-2.0 here.
# LGPL-2.0-or-later is not in the allow list above, so cargo-deny would normally
# reject the disjunction; this per-crate exception pins r-efi to Apache-2.0 only.
[[licenses.exceptions]]
allow = ["Apache-2.0"]
name = "r-efi"

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
    # wasip3 0.4.0 pins wit-bindgen 0.51.0; wasip2 1.0.x uses 0.57.1.
    # No common version available upstream — skip to suppress the warning.
    { name = "wit-bindgen", version = "=0.51.0" },
]

# ── Dependency policy, enforced (audit 2026-08-28 §4.8#9) ─────────────────────
#
# CLAUDE.md and ARCHITECTURE.md ban a second TLS/crypto stack and the `reqwest`
# HTTP client in production. Neither ban was encoded here, and both were being
# violated: rustls' and tokio-rustls' default features selected the `aws-lc-rs`
# provider on top of `ring`, and `opentelemetry-otlp`'s default `http-proto`
# exporter linked `reqwest` into the published binary. Both are now pinned out
# in Cargo.toml; these entries stop them coming back.

# Crypto backends. `ring` and the RustCrypto crates are the policy stack.
[[bans.deny]]
name = "openssl"
reason = "OpenSSL is not an approved crypto backend; use ring or RustCrypto."
[[bans.deny]]
name = "openssl-sys"
reason = "OpenSSL is not an approved crypto backend; use ring or RustCrypto."
[[bans.deny]]
name = "native-tls"
reason = "Platform TLS is not an approved backend; use rustls with the ring provider."
[[bans.deny]]
name = "hyper-tls"
reason = "Pulls native-tls; use hyper-rustls with the ring provider."
[[bans.deny]]
name = "boring"
reason = "BoringSSL is not an approved crypto backend."
[[bans.deny]]
name = "boring-sys"
reason = "BoringSSL is not an approved crypto backend."

# aws-lc-rs is permitted for exactly one purpose: rcgen's RSA-2048 key
# generation, which `ring` cannot do and which replaces the `rsa` crate
# (unpatched RUSTSEC-2023-0071, Marvin Attack). Any other parent — a TLS
# provider default, say — is the accidental third backend the audit found.
[[bans.deny]]
name = "aws-lc-rs"
wrappers = ["rcgen"]
reason = "Permitted only as rcgen's RSA key-generation backend; never as a TLS provider."

# HTTP clients. `ureq` is the production client. `reqwest` is permitted only as
# a direct dev-dependency of this workspace (the integration-test HTTP client);
# a transitive edge from any other crate puts it in the published binary, which
# is the defect this entry exists to catch. scripts/check-production-deps.sh
# closes the remaining gap by asserting it is absent from `cargo tree -e normal`.
[[bans.deny]]
name = "reqwest"
wrappers = ["hearth"]
reason = "Banned in production (CLAUDE.md); test-only, and only as a direct dev-dependency."
[[bans.deny]]
name = "curl"
reason = "Not an approved HTTP client; use ureq."
[[bans.deny]]
name = "curl-sys"
reason = "Not an approved HTTP client; use ureq."
[[bans.deny]]
name = "isahc"
reason = "Not an approved HTTP client; use ureq."
