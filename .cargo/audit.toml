# cargo-audit project configuration
# Pairs with deny.toml: both tools need independent ignore lists for the same advisories.
# Source of truth for rationale: deny.toml [advisories] section and HEA-271 plan document.

[advisories]
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack timing side-channel in rsa crate.
    # Hearth uses rsa only for key generation and PKCS#8 serialization — no
    # PKCS#1 v1.5 decryption is performed anywhere in the codebase, which is
    # the only affected code path. All RSA signing is delegated to
    # ring::signature::RsaKeyPair (unaffected). No patched version of rsa is
    # available; revisit when rsa 0.10+ lands with tonic/tower ecosystem support
    # (tracked in HEA-116).
    "RUSTSEC-2023-0071",
    # RUSTSEC-2025-0141: bincode 1.x flagged unmaintained.
    # bincode is a transitive dependency of madsim (simulation crate only) —
    # it is NOT present in the production dependency graph. No production code
    # is affected. Track upstream madsim for an eventual bincode 2.x migration.
    "RUSTSEC-2025-0141",
    # RUSTSEC-2026-0235: out-of-bounds reads validating untrusted rkyv archives
    # that contain Rc/Arc. rkyv 0.7.46 is an *optional, unselected* dependency of
    # rust_decimal (rust_decimal <- byte-unit <- openraft); only rust_decimal's
    # "std" feature is enabled, never its "rkyv" feature. `cargo tree -i rkyv
    # --workspace --target all` reports nothing, i.e. rkyv is never compiled into
    # hearth or hearth-simulation — it exists solely as a Cargo.lock resolution
    # entry. Hearth performs no rkyv (de)serialization, so the affected archive
    # validation path is unreachable. No in-semver fix: rust_decimal 1.42.1 (the
    # latest 1.x) still declares rkyv 0.7, and byte-unit 5.x requires
    # rust_decimal 1.x. Revisit when openraft/byte-unit move to rust_decimal 2.x.
    "RUSTSEC-2026-0235",
]
