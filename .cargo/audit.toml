# cargo-audit project configuration
# Pairs with deny.toml: both tools need independent ignore lists for the same advisories.
# Source of truth for rationale: deny.toml [advisories] section and HEA-271 plan document.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa, Marvin Attack) was removed by the GA audit (L1):
    # `rsa` is not in this Cargo.lock at all — RSA key generation moved to
    # rcgen/aws-lc-rs (deny.toml), signing and verification are on `ring` — so
    # the ignore matched nothing and only claimed a decision about a crate the
    # server does not link. The Rust SDK's own lockfile, which does contain rsa,
    # is covered by osv-scanner.toml.
    #
    # RUSTSEC-2026-0235 (rkyv 0.7.46) was removed by the GA audit supply-chain
    # fix: rust_decimal 1.43.0 moved its optional rkyv dependency to 0.8, and
    # with the lock at 1.43.0 rkyv no longer appears in Cargo.lock at all (it
    # was never compiled in — `cargo tree -i rkyv` printed nothing — but
    # cargo-audit and osv-scanner read the lockfile, not the build graph).
]
