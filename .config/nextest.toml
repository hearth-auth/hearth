[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = true

[profile.ci]
retries = 2
fail-fast = false

# `make leak-check` (LeakSanitizer, #445). No retries: a leak that shows in
# one run of three is still a leak. LSan's allocator is slower than glibc's,
# so the property tests and the long storage tests need more than 60 s.
[profile.lsan]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# The backup tests' default 90 s kill (below) is too short under LSan.
[[profile.lsan.overrides]]
filter = 'binary(backup_http) | binary(backup_system_realm) | binary(backup) | (binary(abuse_export_hardening) & test(=backup_endpoint_rate_limits_after_quota))'
slow-timeout = { period = "60s", terminate-after = 5 }

# The snapshot case writes 5,200 Raft entries and must reach quorum within
# its own 10 s per write; under LSan and a full parallel run it missed that.
# It runs alone.
[[profile.lsan.overrides]]
filter = 'binary(cluster_peer_message_size)'
slow-timeout = { period = "60s", terminate-after = 5 }
threads-required = 'num-test-threads'

# Backup and restore tests drive real exports/restores through the engine or
# the server. Every archive wraps its key with Argon2id, which takes seconds in
# a debug build, so these tests take 25-60 s alone and crossed the default
# 60 s kill (30 s x 2) under parallel load: backup_endpoint_rate_limits_after_quota
# (10 exports), backup_http::restoring_audit_history... (26.9 s alone, 60 s
# timeout in a full run), and the backup proptests (40-45 s). The work is the
# point of the tests; they get a 90 s kill (30 s x 3) instead of a raised
# global limit. 2026-09-28.
[[profile.default.overrides]]
filter = 'binary(backup_http) | binary(backup_system_realm) | binary(backup) | (binary(abuse_export_hardening) & test(=backup_endpoint_rate_limits_after_quota))'
slow-timeout = { period = "30s", terminate-after = 3 }

# Real-socket three-node Raft clusters. Each test starts three nodes (Raft
# peers, timers, loopback sockets) and waits up to 20 s for replication to
# converge. Run in parallel with each other and the rest of the suite, 17+
# such clusters starved each other's election and heartbeat timers, and a
# different test timed out "replication did not converge within 20s" on most
# full runs while every one passed alone (2026-09-28). One cluster at a time.
[test-groups]
three-node-cluster = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(cluster_three_node_control_coherence) | binary(cluster_grpc_loopback) | binary(cluster_follower_write_forwarding) | binary(cluster_peer_message_size)'
test-group = 'three-node-cluster'

# The peer message-size tests write several MiB and, for the snapshot case,
# 5,200 Raft entries (openraft snapshots every 5,000) before a lagging
# follower catches up by snapshot. That takes 40-90 s in a debug build, over
# the default 60 s kill; they get 150 s (30 s x 5).
[[profile.default.overrides]]
filter = 'binary(cluster_peer_message_size)'
slow-timeout = { period = "30s", terminate-after = 5 }

# The journey heap gate (#445) sends 36,000 journeys through the router in a
# debug build: about 60 s alone on a 12-core host, about 100 s with five
# copies in parallel. It gets 300 s (60 s x 5) for a 4-core runner that also
# runs the rest of the suite. Its four worker threads stay busy for the whole
# run, so it takes four of nextest's test slots.
[[profile.default.overrides]]
filter = 'binary(journey_heap)'
slow-timeout = { period = "60s", terminate-after = 5 }
threads-required = 4
