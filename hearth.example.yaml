# Hearth example configuration.
#
# Usage:
#   cp hearth.example.yaml hearth.yaml      # auto-detected in CWD
#   ./target/release/hearth serve           # uses hearth.yaml
# or:
#   ./target/release/hearth serve -c /path/to/config.yaml
#
# Every section is optional. Any field you omit falls back to the default
# shown in the comment. An empty file (`{}`) starts Hearth, but several
# defaults are NOT safe for production — see the checklist below.
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │               PRODUCTION READINESS CHECKLIST                        │
# │                                                                     │
# │ These settings have development defaults. Set them before           │
# │ exposing Hearth to real users or external traffic.                  │
# │                                                                     │
# │ [ ] oidc.issuer          — default "https://hearth.local" is       │
# │                            unresolvable; breaks all OIDC clients.   │
# │                            Set to your public HTTPS URL.            │
# │                                                                     │
# │ [ ] server.bind_address  — default "127.0.0.1" is localhost-only.  │
# │                            Set to "0.0.0.0" or your specific IP.   │
# │                                                                     │
# │ [ ] server.tls_cert_path — TLS is required in production.          │
# │     server.tls_key_path    Configure a certificate or terminate     │
# │                            TLS at your load balancer.               │
# │                                                                     │
# │ [ ] email.transport      — default "log" silently discards all     │
# │                            verification and transactional mail.     │
# │                            Configure smtp, sendgrid, postmark, etc. │
# │                                                                     │
# │ [ ] email.from           — required for every real mail transport. │
# │                                                                     │
# │ [ ] token.audience       — defaults to oidc.issuer when omitted.   │
# │                            Override only if your resource server     │
# │                            expects a different audience value.       │
# │                                                                     │
# │ [ ] onboarding.base_url  — required for the setup URL logged at    │
# │                            startup to be an absolute HTTPS URL.     │
# └─────────────────────────────────────────────────────────────────────┘
#
# ── Minimum production config (copy, fill in, then delete this block) ─
#
# server:
#   bind_address: "0.0.0.0"
#   port: 443
#   tls_cert_path: "/etc/hearth/tls/server.crt"
#   tls_key_path:  "/etc/hearth/tls/server.key"
#
# oidc:
#   issuer: "https://auth.example.com"
#
# token:
#   # audience defaults to oidc.issuer — omit unless your resource server
#   # expects a different value (e.g. a separate API gateway URL).
#   # audience: "https://api.example.com"
#
# email:
#   transport: smtp                      # or sendgrid | postmark | mailgun
#   from: "Hearth <noreply@example.com>"
#   smtp:
#     host: "smtp.example.com"
#     port: 587
#     encryption: starttls
#     username: "${SMTP_USERNAME}"
#     password: "${SMTP_PASSWORD}"
#
# onboarding:
#   base_url: "https://auth.example.com"
#
# ──────────────────────────────────────────────────────────────────────
#
# Environment variable substitution is supported anywhere a string value
# appears: use dollar-sign + braces around the variable name (see the README
# "Configuration" section for the exact syntax). A referenced variable that
# is not set is a startup error — there is no silent fallback.

server:
  bind_address: "127.0.0.1"   # default: 127.0.0.1
  port: 8420                  # default: 8420

  # TLS is optional. If you set one of cert/key, you MUST set both.
  # Enabling TLS also spawns an HTTP→HTTPS redirect listener on `port - 1`
  # (or port 80 when `port: 443`). Send SIGHUP to reload cert + key.
  # tls_cert_path: "./tls/server.crt"
  # tls_key_path:  "./tls/server.key"

  # mTLS: require clients to present a certificate signed by this CA.
  # `tls_require_client_cert: true` requires `tls_client_ca_path` to be set.
  # tls_client_ca_path: "./tls/clients-ca.crt"
  # tls_require_client_cert: false

storage:
  data_dir: "./data"                      # WAL + SST files live here
  wal_max_size_bytes: 268435456           # 256 MiB — WAL rotation threshold
  memtable_flush_bytes: 67108864          # 64 MiB  — memtable→SST flush threshold
  hot_tier_capacity: 10000                # entries cached in the hot tier
  fsync: true                             # MUST be true in production; dev mode disables this
  # compaction:                            # optional — all fields have defaults shown below
  #   enabled: true                       # whether background SST compaction runs
  #   interval_secs: 3600                 # seconds between compaction sweeps
  #   min_sst_count: 3                    # compact only when SST count >= this threshold

observability:
  log_level: "info"      # trace | debug | info | warn | error
  log_format: "text"     # text | json

  # Optional: export distributed traces via OpenTelemetry OTLP.
  # When omitted, no traces are exported and there is zero overhead.
  #
  # otlp:
  #   protocol: grpc         # grpc (default, port 4317) | http (port 4318)
  #   endpoint: "http://localhost:4317"   # default shown; override for your collector
  #   service_name: "hearth"             # reported as service.name in every span
  #   headers:                           # optional auth headers for managed collectors
  #     Authorization: "Bearer <token>"

operational:
  request_timeout_secs: 30
  shutdown_timeout_secs: 10
  max_connections: 1024
  queue_depth: 4096

# --- Branding (global) ------------------------------------------------------
# Controls the product name and logo shown across the UI and email templates.
# When omitted, "Hearth" and the built-in Hearth logo are used everywhere.

# branding:
#   product_name: "Acme Corp"     # default: "Hearth" — shown in logo alt text and emails
#
#   # Remote URL — used directly in <img src="..."> for both UI and emails.
#   logo_url: "https://example.com/logo.png"
#
#   # Local file path — read at startup, served via /ui/static/custom-logo
#   # in the web UI; SVGs are inlined directly in emails.
#   # Supported formats: .svg, .png, .jpg/.jpeg
#   # logo_url: "/opt/hearth/branding/logo.svg"
#
#   # Named UI theme. Choices: ember (default dark) | ocean | midnight | forest | cloud | slate
#   # cloud and slate are light themes; the rest are dark themes.
#   # theme: ocean
#
#   # Optional path to a CSS file appended after the named theme. Use this to
#   # override --ht-* CSS variables or add custom rules without forking a theme.
#   # custom_css: /etc/hearth/brand.css

email:
  # Outbound mail transport for verification and transactional mail.
  # Supported: log | mailcatcher | smtp | sendgrid | postmark | mailgun | mailtrap
  #
  # Local development (no Docker required):
  #   transport: mailcatcher  # captures emails in-process; UI at /dev/mail
  #                           # only works with --dev mode; auto-enabled by default
  transport: log                    # default: log (no network I/O)

  # Sender address (From: header). Required for all transports except `log`.
  # from: "Hearth <hearth@example.com>"

  # --- Provider blocks (uncomment the one matching your transport) ----------

  # smtp:
  #   host: "smtp.example.com"
  #   port: 587                     # 25, 465, 587, or 1025 (Mailpit)
  #   encryption: starttls          # none | starttls | tls (default: starttls)
  #   username: "${SMTP_USERNAME}"
  #   password: "${SMTP_PASSWORD}"

  # sendgrid:
  #   api_key: "${SENDGRID_API_KEY}"

  # postmark:
  #   server_token: "${POSTMARK_SERVER_TOKEN}"

  # mailgun:
  #   api_key: "${MAILGUN_API_KEY}"
  #   domain: "mg.example.com"
  #   region: us                    # us | eu (default: us)

  # mailtrap:
  #   api_key: "${MAILTRAP_API_KEY}"

  # --- Branding (applied to all outbound emails) ----------------------------
  # Email-specific overrides. product_name and logo_url come from the
  # global `branding:` section above. Per-realm overrides are stored in
  # RealmConfig.email_branding.

  # branding:
  #   accent_color: "#4F46E5"              # default: "#E85D04"
  #   support_email: "support@example.com"
  #   custom_footer_text: "© 2026 Acme Corp. All rights reserved."

  # --- Custom templates -----------------------------------------------------
  # Directory containing Tera templates that override the compiled defaults.
  # templates_dir: "./templates/email"

# --- SMS (OTP / transactional) ----------------------------------------------
# Outbound SMS for OTP codes and transactional messages.
# Supported: log | twilio | awssns
#
# REQUIRED env var: HEARTH_SMS_OTP_HMAC_KEY
#   Must be set in the environment (not here). Required when transport is not
#   'log' or when running outside --dev mode. Generate with:
#     openssl rand -hex 32

sms:
  transport: log        # default: log (no network I/O)

  # --- Twilio -----------------------------------------------------------------
  # sms:
  #   transport: twilio
  #   twilio:
  #     account_sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  #     auth_token: "${TWILIO_AUTH_TOKEN}"   # load from env via ${VAR}
  #     from: "+15550001111"                 # E.164 or Messaging Service SID

  # --- AWS SNS ----------------------------------------------------------------
  # sms:
  #   transport: awssns
  #   aws_sns:
  #     region: "us-east-1"
  #     access_key_id: "${AWS_ACCESS_KEY_ID}"
  #     secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  #     sender_id: "MyBrand"    # optional, up to 11 alphanumeric chars

# --- OIDC / OAuth 2.0 -------------------------------------------------------
# Controls the OIDC Discovery document and authorization code behaviour.

oidc:
  issuer: "https://auth.example.com"   # REQUIRED — set to your public HTTPS URL
#   authorization_code_ttl: "10m"        # default: 10 minutes
#   enforce_nonces: true                 # default: true (recommended)
#                                        # Set to false ONLY for legacy clients that cannot
#                                        # supply nonces. Disabling this removes replay
#                                        # protection for confidential (server-side) clients
#                                        # and emits a startup warning.

# --- Token issuance ---------------------------------------------------------
# Controls JWT claims and expiration. `token.issuer` defaults to `oidc.issuer`
# when omitted, so you only need to set it here if they differ.

# token:
#   issuer: "https://auth.example.com"   # default: oidc.issuer (or "hearth" if unset)
#   # audience defaults to oidc.issuer when omitted. Set only when your resource
#   # server expects a different audience value than the issuer URL.
#   # audience: "https://api.example.com"
#   access_token_ttl: "15m"             # default: 15 minutes
#   refresh_token_ttl: "7d"             # default: 7 days

# --- Security -----------------------------------------------------------------
# Global security settings: rate limiting, trusted proxies, etc.

# security:
#   rate_limiting:
#     login_per_ip:
#       max_attempts: 10      # default: 10; blocked IPs get a 429 with Retry-After
#       window_seconds: 60    # default: 60; sliding window length in seconds
#     login_per_account:
#       max_failures: 5       # default: 5; consecutive failures before lockout
#       lockout_seconds: 300  # default: 300 (5 min); per-account lockout duration

# --- Metrics auth (A-26) ----------------------------------------------------
# Protect /metrics from unauthenticated scraping. Alternatively, firewall the
# port at the network layer. Comparison is constant-time.
#
# security:
#   bearer_token: "${HEARTH_METRICS_TOKEN}"

# --- Host header allowlist (A-40) -------------------------------------------
# Reject requests with unexpected Host headers (DNS rebinding protection).
# Include the port for non-standard ports: "auth.example.com:8420"
#
# security:
#   allowed_hosts:
#     - "auth.example.com"
#     - "auth.internal.example.com"

# --- DPoP nonce stability (multi-node / rolling restarts) -------------------
# By default a new random key is generated at startup, invalidating outstanding
# DPoP proofs on restart. Set a stable 64-char hex key in multi-node deployments
# so all nodes share the same secret. Zero key is rejected at startup.
#
# security:
#   dpop_nonce_secret: "${HEARTH_DPOP_NONCE_SECRET}"

# --- JWKS / discovery rate limit (A-10) ------------------------------------
# Default: 60 req/s per source IP. Lower in high-threat environments.
#
# security:
#   jwks_rps_limit: 60

# --- HTTP/2 rapid-reset defense (A-39 / CVE-2023-44487) --------------------
# Cap concurrent streams and RST_STREAM budget per connection.
#
# security:
#   http2:
#     max_concurrent_streams: 100   # default: 100
#     max_pending_reset_streams: 10  # default: 10

# --- Request shaper: per-IP and per-realm token buckets (A-2) ---------------
# Global rate limiter applied before per-realm auth logic. Works independently
# of rate_limiting above (which is login-specific). Both are active when set.
#
# security:
#   request_shaper:
#     ip_rps: 100       # default: 100 req/s per source IP
#     realm_rps: 1000   # default: 1000 req/s per realm

# --- IP reputation (P-2) ----------------------------------------------------
# Block or challenge IPs on the Spamhaus DROP/EDROP list, or from flagged ASNs
# via MaxMind. action: "block" | "challenge" (CAPTCHA) | "log" (metrics only).
# Requires a MaxMind MMDB for ASN lookups (download free GeoLite2-ASN.mmdb).
#
# security:
#   ip_reputation:
#     enabled: true
#     action: block
#     maxmind_db_path: "/var/lib/hearth/GeoLite2-ASN.mmdb"  # optional
#     spamhaus:
#       refresh_interval_secs: 86400  # default: 24 hours

# --- gRPC reflection gate (A-43) --------------------------------------------
# Disabled in production by default. Enabling also requires --allow-reflection-in-prod.
#
# security:
#   grpc:
#     reflection_enabled: false

# --- mTLS certificate revocation (A-44) ------------------------------------
# PEM-encoded CRL files checked on every TLS handshake. Reloaded on SIGHUP.
# Only relevant when server.tls_require_client_cert is true.
#
# security:
#   tls:
#     crl_paths:
#       - "/etc/hearth/crl/ca.crl"

# --- Backup restore signing (A-30) -----------------------------------------
# When set, the restore endpoint rejects archives without a valid Ed25519
# detached signature on manifest.json. export_rate_limit caps exports per hour.
#
# security:
#   backup:
#     verify_key: "${HEARTH_BACKUP_VERIFY_KEY}"  # base64url Ed25519 public key
#     export_rate_limit: 10                       # default: 10/hr per admin

# --- Return-to redirect allowlist (A-52) -----------------------------------
# Relative paths (/ui/…) are always accepted. Absolute URLs require a match here.
#
# security:
#   allowed_return_to_origins:
#     - "https://app.example.com"

# --- Argon2 pepper (A-46) ---------------------------------------------------
# Adding a pepper hashes HMAC-SHA256(key=pepper_key, msg=password) before
# Argon2id, so that even a stolen database cannot be brute-forced without the
# pepper secret. Credentials are lazily re-hashed on the next successful login.
#
# Rotation procedure:
#   1. Copy the current `active_version` / `active_hex` to `previous_*`.
#   2. Increment `active_version` and supply a new 32-byte hex key in `active_hex`.
#   3. Deploy — credentials are re-hashed lazily as users log in.
#   4. Once all active users have logged in (check `hearth migrate rotate-pepper`),
#      remove the `previous_*` keys to close the grace window.
#
# security:
#   password:
#     pepper:
#       active_version: 1               # monotonically increasing integer
#       active_hex: "${PEPPER_KEY_HEX}" # 32-byte (64 hex chars) secret
#       # previous_version: 0           # uncomment during rotation grace window
#       # previous_hex: "${OLD_PEPPER_HEX}"

# --- Auth defaults (global) -------------------------------------------------
# These apply to all realms unless overridden per-realm below.

# auth:
#   session_ttl: "24h"              # duration: 30s, 5m, 8h, 1d
#   password_memory_cost: 65536     # Argon2id memory parameter (KiB)
#   password_time_cost: 3           # Argon2id time parameter (iterations)
#   mfa_required: false             # require MFA for all users (global default)
#   passkey_requires_mfa: false     # enforce TOTP even after passkey login (global default)
#   audit_log_retention: "365d"     # how long audit events are retained (default: forever)
#                                   # SOC 2 Type II typically requires 90d; ISO 27001 often 1y
#
# --- Post-deletion email tombstone (A-20) -----------------------------------
# When a user account is deleted, Hearth writes an `email:reserved:{email}`
# record that blocks re-registration of the same email for 90 days (abuse
# prevention — prevents account-cycling to evade blocklists).
#
# This record contains a plaintext email address and therefore counts as
# residual PII.  Operators MUST disclose it in their privacy notice; see
# docs/guides/privacy.md §5 for GDPR/CCPA lawful-basis options.
#
# The tombstone is automatically purged when the owning realm is deleted —
# no email address outlives its realm.  The 90-day TTL applies to user-level
# deletion only (the user is gone, but the realm is still live).
#
# The retention window is not currently configurable; if you need a shorter
# window, open a feature request against HEA-1270.

# --- Realms ----------------------------------------------------------------
# Realms are managed declaratively in this file. On startup, Hearth
# reconciles what's declared here with what's in storage:
#
#   - YAML entry not in storage     → created
#   - YAML entry in storage         → config updated if changed
#   - Storage realm not in YAML    → archived (soft-deleted)
#
# Archived realms appear in the Admin UI with an "Archived" badge and
# can be permanently deleted from there.
#
# If the `realms` key is OMITTED entirely:
#   - No realms in storage → a "default" realm is auto-created
#   - Realms already exist → left untouched (backward compatibility)
#
# Single-realm (most deployments): omit `realms` entirely and let
# Hearth auto-create "default" using the global `auth` settings above.

# --- Single-realm example (just omit the realms key) ---
# (nothing to add — Hearth creates "default" automatically)

# --- Multi-realm example ---
# realms:
#   customer-portal:
#     session_ttl: "12h"                # overrides global auth.session_ttl
#     email:
#       branding:
#         accent_color: "#2563EB"
#     web:
#       theme: cloud                    # light theme for this realm
#       custom_css: /etc/hearth/customer-portal.css   # optional realm CSS
#     auth:
#       mfa_required: true              # require MFA for all users
#       passkey_requires_mfa: false     # enforce TOTP even after passkey login (regulated environments)
#       mfa_methods:                    # allowed MFA methods
#         - totp
#         - webauthn
#       allowed_auth_methods:           # allowed login methods
#         - password
#         - magic_link
#         - passkey
#       password_policy:
#         min_length: 12
#         require_uppercase: true
#         require_number: true
#         require_special: false
#       token:
#         access_token_ttl: "30m"       # per-realm token TTL override
#         refresh_token_ttl: "14d"
#         password_reset_token_ttl: "1h" # default: 30m; use shorter TTLs for high-security realms
#       rate_limit:
#         max_failed_logins: 5
#         lockout_duration: "15m"
#       # Adaptive (risk-based) step-up MFA — see HEA-836.
#       # When enabled, unrecognised device/IP combinations trigger an extra
#       # MFA challenge. The HMAC secret derives device fingerprints and MUST
#       # be supplied from the environment — never commit a plaintext value.
#       # See docs/guides/security-hardening.md#device-fingerprint-hmac-secret
#       # for generation, storage, and rotation procedures.
#       adaptive_mfa:
#         enabled: true
#         recognition_window_days: 30                                       # default: 30
#         fingerprint_hmac_secret: "${HEARTH_REALM_CUSTOMER_PORTAL_FINGERPRINT_HMAC_SECRET}"
#
#   internal-tools:
#     session_ttl: "8h"
#     password_memory_cost: 131072      # stricter for internal use
#     web:
#       theme: midnight                 # violet/purple dark theme
#     organizations:
#       acme-corp:
#         name: "Acme Corporation"
#         description: "Main enterprise customer"
#         config:
#           max_members: 500
#       beta-testers:
#         name: "Beta Testers"
#         description: "Early access program"
#
#     # --- Custom attribute definitions ------------------------------------
#     # Declare the allowed attribute keys for user and organization records
#     # in this realm. When defined, the identity engine enforces:
#     #   • Only keys listed here are accepted (unknown keys → 400)
#     #   • Keys with required: true must be present on record creation
#     #   • Enum keys reject values not in enum_values (→ 400)
#     #
#     # When attribute_definitions is omitted, free-form key-value pairs
#     # are accepted (any ASCII alphanumeric / '.' / '_' / '-' key, up to
#     # 50 keys per record, 64-byte keys, 1024-byte values).
#     #
#     # All values are stored as UTF-8 strings regardless of declared type.
#     # The type field is a UI hint (drives input type in the admin UI) and
#     # a lightweight format validator — it is not enforced on raw string input.
#     #
#     attribute_definitions:
#       users:
#         - key: department          # machine-readable storage key
#           label: Department        # human-readable label in the admin UI
#           type: string             # string | number | boolean | enum
#           required: false
#           description: "User's business department (e.g. Engineering, Sales)"
#
#         - key: employee_id
#           label: Employee ID
#           type: string
#           required: true           # must be present when creating a user
#           description: "HR system employee identifier"
#
#         - key: office_count        # rendered as <input type="number"> in the UI
#           label: Office Count
#           type: number
#           required: false
#
#         - key: is_contractor       # rendered as a checkbox in the admin UI
#           label: Is Contractor
#           type: boolean
#           required: false
#
#         - key: tier                # rendered as <select> with the listed options
#           label: Subscription Tier
#           type: enum
#           required: false
#           enum_values:             # allowed values; other values are rejected
#             - free
#             - pro
#             - enterprise
#
#       organizations:
#         - key: crm_id
#           label: CRM ID
#           type: string
#           required: false
#           description: "Identifier in your CRM system (e.g. Salesforce account ID)"
#
#         - key: contract_tier
#           label: Contract Tier
#           type: enum
#           required: false
#           enum_values:
#             - starter
#             - growth
#             - enterprise
#
#         - key: max_seats           # purely informational; Hearth does not enforce it
#           label: Licensed Seats
#           type: number
#           required: false
#
#     applications:
#       dashboard:
#         name: "Internal Dashboard"
#         redirect_uris:
#           - "https://dashboard.internal.example.com/callback"
#         grant_types:
#           - authorization_code
#           - refresh_token
#       api-service:
#         name: "API Service"
#         confidential: true
#         client_secret: "${INTERNAL_API_SECRET}"
#         grant_types:
#           - client_credentials
#
#     # --- RBAC: permissions, roles, and scope bundles ---------------------
#     # Hearth seeds a baseline set on every realm: permissions
#     # (hearth.admin, realm.{read,write,admin}, org.{read,write,admin,billing},
#     # user.{read,write,impersonate}) and roles (realm.admin, realm.member,
#     # org.member → org.admin → org.owner, with org.* scoped to organizations).
#     # The blocks below ADD to the seed set; declared names that collide with
#     # seed names override the seed metadata for that realm.
#     #
#     # Every permission referenced by a role MUST be declared in the
#     # `permissions:` list (or be a seed permission); this is enforced at
#     # startup. Each permission needs a unique `name` and a `display_name`.
#
#     permissions:
#       - name: billing.read
#         display_name: "Read billing"
#         description: "View invoices, plan, and payment history."
#         category: billing
#       - name: billing.write
#         display_name: "Manage billing"
#         description: "Update payment methods, plan, and tax info."
#         category: billing
#       - name: reports.export
#         display_name: "Export reports"
#         description: "Download CSV / PDF exports of analytics reports."
#         category: analytics
#
#     roles:
#       # Realm-scoped role: granted directly on the realm.
#       - name: support.agent
#         description: "Read-only access for customer support staff."
#         scope_kind: realm           # realm | organization | any (default: realm)
#         permissions:
#           - user.read
#           - org.read
#           - reports.export
#
#       # Organization-scoped role: assignable to a user within a single org.
#       - name: org.billing_admin
#         description: "Manages billing for one organization."
#         scope_kind: organization
#         permissions:
#           - billing.read
#           - billing.write
#         parents:
#           - org.admin               # inherits org.write + org.admin (seed role)
#
#     # Scope bundles map an OAuth scope string to a set of permissions.
#     # Bundle names use ':' separators (no '.'). The seed scope map already
#     # provides `openid`, `profile`, `email`, `admin`, and `org`.
#     scopes:
#       - name: billing:manage
#         display_name: "Billing management"
#         description: "Read and write billing data."
#         permissions:
#           - billing.read
#           - billing.write
#
#     # YAML-declared groups — created at startup, updated if drifted.
#     groups:
#       - name: Engineering
#         slug: engineering
#         description: "All members of the engineering department."
#       - name: Platform Team
#         slug: platform
#         description: "Platform infrastructure engineers."

# ── Config Migration / Data Inheritance ──────────────────────────────────────
#
# Hearth tracks a secrets-stripped snapshot of this file in the WAL after each
# successful startup. On the next boot it diffs the new config against that
# snapshot and automatically performs any required data operations — no manual
# admin steps, no CLI flags, no downtime.
#
# ── Soft-delete model ────────────────────────────────────────────────────────
#
# Removing a realm slug from this file does NOT hard-delete it. Hearth sets its
# status to `Archived` and preserves all data. Re-adding the same slug later
# restores the realm exactly as it was (slug is the permanent identity).
#
# To permanently discard an archived realm's data, add `archive_drop: true`
# to its YAML entry before removing it, OR use "Delete permanently" in the
# Admin UI after it is archived.
#
# ── Cross-realm user migration ───────────────────────────────────────────────
#
# Declare `migrate_from` on the *destination* realm to move users on next boot:
#
# realms:
#   new-portal:                      # destination realm
#     migrate_from: legacy-portal    # source slug — move semantics
#     migrate:
#       users: true                  # move users (default: true)
#       orgs: true                   # move organizations (default: true)
#       applications: false          # skip OAuth clients (default: true)
#       on_conflict: skip            # "error" (default) | "skip"
#                                    # error = abort startup; skip = keep existing
#
# After a successful migration the source realm is automatically archived.
# Migration is idempotent — a crash mid-run resumes from the last completed
# user on the next boot.
#
# To copy users without archiving the source realm, use `copy_from` instead:
#
# realms:
#   new-portal:
#     copy_from: legacy-portal       # copy semantics — source stays Active
#     migrate:
#       users: true
#       orgs: false
#       on_conflict: skip
#
# ── Signing key rotation ─────────────────────────────────────────────────────
#
# Setting `rotate_signing_key: true` on a realm triggers a new Ed25519 key to
# be generated at next startup. The old key is kept in JWKS during a grace
# period so existing tokens remain valid. The flag is automatically cleared
# from the stored config snapshot once rotation completes.
#
# realms:
#   production:
#     rotate_signing_key: true       # auto-cleared after rotation
#
# ── Host-key (master key) rotation ──────────────────────────────────────────
#
# Hearth uses envelope encryption: HEARTH_MASTER_KEY encrypts per-realm KEKs,
# which in turn encrypt per-file DEKs. To rotate the master key:
#
#   1. Set HEARTH_MASTER_KEY to the *new* key.
#   2. Set HEARTH_PREVIOUS_MASTER_KEY to the *old* key.
#   3. Start Hearth — it re-encrypts all realm KEKs under the new key and
#      then clears HEARTH_PREVIOUS_MASTER_KEY from its memory.
#   4. Remove HEARTH_PREVIOUS_MASTER_KEY from the environment after the boot
#      succeeds (it is no longer needed).
#
# ── Argon2id cost changes ────────────────────────────────────────────────────
#
# Changing `password_memory_cost` or `password_time_cost` (globally or per-
# realm) takes effect lazily: credentials are rehashed at the new cost on each
# user's next successful login. No bulk migration, no downtime.
#
# ── Orphaned realms ──────────────────────────────────────────────────────────
#
# If a realm is archived while it still contains users and no `migrate_from`
# destination is configured, Hearth emits a structured warning at startup and
# continues. The orphaned realm is surfaced in the Admin UI with a recovery
# banner so an operator can migrate or drop it explicitly.
#
# ── Full example (commented out) ─────────────────────────────────────────────
#
# realms:
#   # Active destination realm — pulls users from the legacy realm on boot.
#   customer-portal:
#     display_name: "Customer Portal"
#     migrate_from: legacy           # move users from "legacy" realm
#     migrate:
#       users: true
#       orgs: true
#       applications: false
#       on_conflict: skip
#     rotate_signing_key: true       # rotate JWT signing key this boot
#
#   # Source realm — will be archived automatically after migration succeeds.
#   # archive_drop: true would permanently destroy it instead of archiving.
#   legacy:
#     display_name: "Legacy (migrating out)"
#     archive_drop: false            # keep data after archiving (default)

onboarding:
  # enabled: true  # set to false to permanently disable the /ui/setup flow
  # base_url: "https://auth.example.com"  # used in the setup URL logged at startup
  # notification_email: ops@example.com   # receives the setup URL on first boot (requires SMTP)

# ── Cluster (multi-node Raft) ─────────────────────────────────────────────────
#
# Omit this section entirely for single-node deployments. When absent, Hearth
# runs in single-node mode with no clustering overhead.
#
# Prerequisites before enabling cluster mode:
#   1. Generate a CA and per-node leaf certificates (see docs/guides/clustering.md).
#   2. Ensure NTP is running on every node — clock skew causes incorrect write
#      ordering. Hearth logs a warning if skew exceeds 1 second on startup.
#   3. Open port 8421 (or your chosen peer_address port) between nodes.
#
# cluster:
#   node_id: 1                           # unique integer per node (1, 2, 3, …)
#   peer_address: "10.0.0.1:8421"        # this node's inbound Raft RPC address
#                                        # default: "127.0.0.1:8421"
#   peers:                               # all other nodes in the cluster
#     - id: 2
#       address: "10.0.0.2:8421"
#     - id: 3
#       address: "10.0.0.3:8421"
#   tls_cert_path: "/etc/hearth/certs/node1.crt"   # required — node leaf cert
#   tls_key_path:  "/etc/hearth/certs/node1.key"   # required — node private key
#   tls_ca_cert_path: "/etc/hearth/certs/ca.crt"   # required — CA shared by all nodes
#   read_lag_threshold_ms: 500           # optional — redirect reads when follower
#                                        # is lagging more than this (default: 500)


# =============================================================================
# Agent Authentication (AGENT_AUTH.md)
# =============================================================================
#
# Staged capability flags for the agent identity feature set.
# Each flag activates one phase independently. All default to false.
#
# Phase A (M1) — agent CRUD, API-key credentials, Agent Card, REST endpoints:
#
# agent_auth:
#   capabilities:
#     identity: true   # enables /v1/agents, /.well-known/agent.json, gRPC stubs
#
# Future phases (not yet implemented — setting these is a startup error):
#   delegation: false  # Phase C: act-as delegation + AATs
#   mcp: false         # Phase B: MCP authorization server + protected resources
