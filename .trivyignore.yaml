# Trivy ignore file for .github/workflows/security.yml's filesystem scan
# (passed via the action's `trivyignores` input).
#
# Policy: every entry is scoped to an exact rule ID AND path, with a statement
# a reviewer can check. Never ignore a vulnerability ID here to make the scan
# pass — upgrade the dependency instead (see osv-scanner.toml for the same
# policy on advisories).

secrets:
  # A deliberately public Ed25519 test key: the `openssl_style_unversioned_pkcs8_is_accepted`
  # unit test (inside `#[cfg(test)] mod tests`) parses the PEM `openssl genpkey
  # -algorithm ed25519` produces and checks the derived public key. It signs
  # nothing and is never loaded outside the test. Scoped to this one file so a
  # real key committed anywhere else still fails the scan.
  - id: private-key
    paths:
      - "src/backup/signature.rs"
    statement: "Public test-fixture Ed25519 key in a #[cfg(test)] unit test; not a credential."

vulnerabilities:
  # GO-2026-5932: golang.org/x/crypto/openpgp is unmaintained and unsafe by
  # design. The advisory covers every x/crypto version and has NO fixed
  # release, so the "upgrade instead" rule above cannot apply. It affects only
  # code that imports the openpgp packages, and the Go SDK imports none:
  # `go list -deps -test ./...` in sdks/go lists x/crypto only as acme,
  # acme/autocert (via labstack/echo), chacha20, chacha20poly1305, hkdf, sha3
  # and internals. Same assessment as the osv-scanner.toml entry. Scoped to the
  # Go SDK's go.mod; revisit if any dependency starts importing openpgp.
  - id: GO-2026-5932
    paths:
      - "sdks/go/go.mod"
    statement: "No openpgp import anywhere in the Go SDK build graph; the advisory has no fixed version."
  # ip-address 10.5.0 and undici 6.28.0 BUNDLED inside the npm CLI
  # (node_modules/npm/node_modules/...) in the release-tooling lockfile only.
  # npm ships bundleDependencies inside its tarball, so no lockfile update or
  # override can change them; npm 11.20.0 (newest 11.x, required by
  # @semantic-release/npm ^11.6.2) still bundles these versions. The top-level
  # copies are patched. Same assessment as the osv-scanner.toml entries; listed
  # under both GHSA and CVE ids because the two databases key them differently.
  # Revisit when an npm 11.x release bundles ip-address >= 10.5.1 and
  # undici >= 6.28.1.
  - id: GHSA-2vr4-cq9g-pvrc
    paths:
      - "package-lock.json"
    statement: "ip-address bundled in the npm CLI (release tooling); no npm 11.x bundles the fix yet."
  - id: CVE-2026-101913
    paths:
      - "package-lock.json"
    statement: "ip-address bundled in the npm CLI (release tooling); no npm 11.x bundles the fix yet."
  - id: GHSA-rpw4-54j3-4h4q
    paths:
      - "package-lock.json"
    statement: "ip-address bundled in the npm CLI (release tooling); no npm 11.x bundles the fix yet."
  - id: CVE-2026-101910
    paths:
      - "package-lock.json"
    statement: "ip-address bundled in the npm CLI (release tooling); no npm 11.x bundles the fix yet."
  - id: GHSA-3wwx-pv8p-q78v
    paths:
      - "package-lock.json"
    statement: "undici bundled in the npm CLI for node-gyp (release tooling); WebSocket DoS unused; no npm 11.x bundles the fix yet."
  - id: CVE-2026-85024
    paths:
      - "package-lock.json"
    statement: "undici bundled in the npm CLI for node-gyp (release tooling); WebSocket DoS unused; no npm 11.x bundles the fix yet."
  # braces 3.0.3 and http-cache-semantics 4.2.0: newest releases, no patched
  # version for either advisory (checked 2026-10-03). Docusaurus build tooling
  # only; never in the server binary or an SDK. Same assessment as the
  # osv-scanner.toml entries. Revisit when a patched release exists.
  - id: CVE-2026-93687
    paths:
      - "docs-site/package-lock.json"
    statement: "braces via Docusaurus build tooling; expands only repo-authored globs; no patched release."
  - id: CVE-2026-93748
    paths:
      - "docs-site/package-lock.json"
    statement: "http-cache-semantics via Docusaurus update-notifier; no shared HTTP cache in CI; no patched release."
  # sprintf-js 1.0.3, only via argparse 1.0.10 (gray-matter's front-matter
  # parsing at docs build time). Every release through 1.1.3 is affected and
  # none is fixed. argparse formats only its own help and error templates,
  # never a format string from outside the repo. Same assessment as the
  # osv-scanner.toml entry (GHSA-hp3w-g68c-fv3c), which Trivy keys by CVE id.
  # Revisit when a fixed sprintf-js is published or argparse moves off it.
  - id: CVE-2026-97058
    paths:
      - "docs-site/package-lock.json"
    statement: "sprintf-js via argparse in Docusaurus build tooling; formats only its own templates; no patched release."
