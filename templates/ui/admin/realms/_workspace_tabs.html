{# Shared realm-workspace breadcrumb.
   Renders `Realms › {realm_name} › {current_page}` inside a nav landmark.
   Required struct fields: realm_name: String, current_page: String
#}
<nav class="flex items-center gap-2 text-sm" aria-label="Breadcrumb">
  <a href="/ui/admin/realms" class="text-ht-content-muted hover:text-ht-content-primary">Realms</a>
  <span class="text-ht-content-muted">›</span>
  <a href="/ui/admin/realms/{{ realm_name }}" class="text-ht-content-secondary hover:text-ht-content-primary">{{ realm_name }}</a>
  <span class="text-ht-content-muted">›</span>
  <span class="font-medium text-ht-content-secondary" aria-current="page">{{ current_page }}</span>
</nav>
