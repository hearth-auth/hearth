{% extends "ui/_layout.html" %}
{% block title %}{{ product_name }} · Verification link expired{% endblock %}
{% block body %}
<div class="mx-auto max-w-lg">
  <div class="rounded-lg bg-ht-surface-elevated p-8 ring-1 ring-divider-subtle">
    <div class="mb-6 flex flex-col items-center text-center">
      <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-danger/[0.12]">
        <svg class="h-6 w-6 text-danger-fg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
        </svg>
      </div>
      <p class="font-mono text-[11px] uppercase tracking-[0.14em] text-ht-content-muted">Verification failed</p>
      <h1 class="font-display text-xl font-medium text-ht-content-primary">Link expired or invalid</h1>
      <p class="mt-2 text-sm text-ht-content-muted">
        This verification link has expired or has already been used.
      </p>
    </div>

    <a href="/required-action/VERIFY_EMAIL"
       class="btn-ember flex w-full items-center justify-center rounded-md px-4 py-2.5 text-sm font-medium">
      Resend verification email
    </a>
  </div>
</div>
{% endblock %}
