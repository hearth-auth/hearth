# Hearth Helm chart — default values.
# Override with: helm install hearth ./deploy/helm/hearth -f my-values.yaml
# or:            helm install hearth ./deploy/helm/hearth --set image.tag=v1.0.0
#
# The chart always runs `hearth serve` in PRODUCTION mode (there is no --dev
# in a cluster). Production start-up refuses to run until ALL of these hold:
#
#   1. HEARTH_MASTER_KEY and HEARTH_KEK are available. The chart reads both
#      from the Secret named by `encryptionKeys` below; create it first. Until
#      it exists the pod sits in CreateContainerConfigError.
#   2. An HTTPS posture is chosen: direct TLS (`tls` below) OR
#      config.server.trust_forwarded_proto: true with a non-empty
#      config.server.trusted_proxies (individual IPs, no CIDR). The defaults
#      here choose neither, so the server refuses to start until you pick one.
#      values-prod.yaml shows a complete ingress-terminated setup.
#   3. config.oidc.issuer is set to the public HTTPS URL (commented out below).
#   4. Every ${VAR} referenced in `config` resolves to a non-empty value.
#
# `hearth config validate <file>` checks a config the same way start-up does.

# -- Image ----------------------------------------------------------------------
image:
  repository: ghcr.io/hearth-auth/hearth
  pullPolicy: IfNotPresent
  # Defaults to v<appVersion> from Chart.yaml — the form the registry holds.
  tag: ""

imagePullSecrets: []

# -- Replicas -------------------------------------------------------------------
replicaCount: 1

# -- Service account ------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- Pod annotations/labels -----------------------------------------------------
podAnnotations: {}
podLabels: {}

# -- Security context -----------------------------------------------------------
podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true

containerSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -- Resources ------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# -- Service --------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8420
  # Set to a fixed NodePort value when type: NodePort
  nodePort: ""

# -- Ingress --------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: auth.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: hearth-tls
  #   hosts:
  #     - auth.example.com

# -- Persistent storage ---------------------------------------------------------
persistence:
  enabled: true
  # storageClassName: "" # uses cluster default when empty
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # Bind to an existing PVC instead of creating one
  existingClaim: ""
  # Mount path inside the container — must match storage.data_dir in config
  mountPath: /var/lib/hearth

# -- Hearth configuration -------------------------------------------------------
# Values here are rendered into a ConfigMap and mounted at /etc/hearth/hearth.yaml.
# Secret values (TLS keys, SMTP passwords, signing keys) go in `secret` below.
config:
  server:
    bind_address: "0.0.0.0"
    port: 8420
    # HTTPS posture — production requires exactly one of:
    #
    #  (a) Direct TLS inside the pod: set `tls.enabled: true` below. The chart
    #      mounts the certificate and fills in tls_cert_path / tls_key_path
    #      (/etc/hearth/tls/tls.crt, /etc/hearth/tls/tls.key) for you. Note:
    #      Hearth also opens a plaintext HTTP→HTTPS redirect listener on
    #      `port - 1` (8419 here), which the Service does not expose.
    #
    #  (b) TLS terminated by a reverse proxy / Ingress in front of the pod:
    # trust_forwarded_proto: true
    # trusted_proxies:
    #   - "REPLACE_WITH_PROXY_IP"   # individual IPs only; CIDR is refused
    #
    # See values-prod.yaml for (b) spelled out with its caveats.

  storage:
    data_dir: "/var/lib/hearth"
    wal_max_size_bytes: 268435456   # 256 MiB
    memtable_flush_bytes: 67108864  # 64 MiB
    hot_tier_capacity: 10000
    fsync: true

  observability:
    log_level: "info"
    log_format: "json"

  operational:
    request_timeout_secs: 30
    shutdown_timeout_secs: 10
    max_connections: 1024
    queue_depth: 4096

  email:
    # EVALUATION ONLY. `log` delivers nothing: password-reset, verification
    # and magic-link emails are written to the log and dropped. Production
    # refuses `transport: log` unless allow_log_transport_in_production is
    # true, and this default opts in so the chart's out-of-the-box config
    # states that choice instead of hiding it. For real use, switch to a real
    # transport and set allow_log_transport_in_production back to false —
    # values-prod.yaml does both.
    transport: log
    allow_log_transport_in_production: true
    # transport: smtp
    # from: "Hearth <hearth@example.com>"
    # smtp:
    #   host: "smtp.example.com"
    #   port: 587
    #   encryption: starttls
    #   username: "hearth@example.com"
    #   password: "${SMTP_PASSWORD}"   # from a Secret via extraEnv below

  # oidc:
  #   issuer: "https://auth.example.com"

# -- Encryption keys (required in production) -----------------------------------
# HEARTH_MASTER_KEY encrypts the storage host key; HEARTH_KEK encrypts realm
# signing keys. Both are 64 hex chars (32 random bytes). The chart injects
# them from an existing Secret and NEVER generates them: a new master key
# makes every byte already on the PVC unreadable. Back both up outside the
# cluster. Create the Secret before installing:
#
#   kubectl -n hearth create secret generic hearth-keys \
#     --from-literal=HEARTH_MASTER_KEY="$(openssl rand -hex 32)" \
#     --from-literal=HEARTH_KEK="$(openssl rand -hex 32)"
#
# (or source it from Vault / a cloud secret manager via External Secrets.)
# A HEARTH_MASTER_KEY or HEARTH_KEK already set through `env`, `secret.env`
# or `extraEnv` takes precedence and is not injected twice.
encryptionKeys:
  enabled: true
  # Secret name. Empty → "<release fullname>-keys" (e.g. "hearth-keys").
  existingSecret: ""
  # Keys inside that Secret.
  masterKeySecretKey: HEARTH_MASTER_KEY
  kekSecretKey: HEARTH_KEK

# -- Direct TLS inside the pod ---------------------------------------------------
# When enabled, the chart mounts the certificate at /etc/hearth/tls/, sets
# config.server.tls_cert_path / tls_key_path, and switches the liveness and
# readiness probes to HTTPS. If an Ingress sits in front, tell it the backend
# speaks HTTPS (ingress-nginx: nginx.ingress.kubernetes.io/backend-protocol:
# "HTTPS").
tls:
  enabled: false
  # A kubernetes.io/tls Secret (keys tls.crt / tls.key), e.g. one cert-manager
  # maintains. Empty → use secret.tlsCert / secret.tlsKey below.
  existingSecret: ""

# -- Secret values --------------------------------------------------------------
# These are stored in a Kubernetes Secret, not the ConfigMap.
# Leave all values empty ("") to skip creating the Secret.
secret:
  # Inline TLS certificate and key (PEM). If both are set, the chart mounts
  # them at /etc/hearth/tls/ and sets config.server.tls_cert_path /
  # tls_key_path, even with tls.enabled false (kept for compatibility).
  # Prefer tls.existingSecret: PEM in a values file ends up in Helm's release
  # history.
  tlsCert: ""
  tlsKey: ""

  # Environment variables injected into the Hearth pod (e.g. ${SMTP_PASSWORD}).
  # Each entry becomes a key/value pair in the Secret. Reference these from
  # `config:` above using ${VAR_NAME} substitution.
  #
  # Naming convention for per-realm adaptive-MFA fingerprint HMAC secrets
  # (one secret per realm — see docs/guides/security-hardening.md
  # §"Device fingerprint HMAC secret" for generation and rotation):
  #     HEARTH_REALM_<SCREAMING_SNAKE_REALM_NAME>_FINGERPRINT_HMAC_SECRET
  #
  # Production values should be sourced from an external secret store
  # (HashiCorp Vault, AWS Secrets Manager, GCP Secret Manager) via the
  # External Secrets Operator or sealed-secrets — do NOT commit literal
  # values to this file. Local plaintext examples are illustrative only.
  env: {}
    # SMTP_PASSWORD: "s3cr3t"
    # SENDGRID_API_KEY: "SG.xxx"
    # HEARTH_REALM_CUSTOMER_PORTAL_FINGERPRINT_HMAC_SECRET: ""

# -- Extra environment variables (non-secret) -----------------------------------
# RUST_LOG takes priority over config.observability.log_level for ordinary
# targets. Keep production at "info"; debug logging is for troubleshooting.
env:
  RUST_LOG: "info"

# -- Extra environment variables (full EnvVar objects) --------------------------
# Use this to pull values from Secrets you manage yourself, then reference
# them from `config` with ${VAR} substitution. Example:
#   extraEnv:
#     - name: SMTP_PASSWORD
#       valueFrom:
#         secretKeyRef:
#           name: hearth-smtp
#           key: password
extraEnv: []

# -- Liveness / readiness probes ------------------------------------------------
# Deliberate split:
#   liveness  → /health  (always-200 process heartbeat; a storage failure that
#                          triggers liveness causes an immediate pod kill, which
#                          is worse than leaving the pod alive while storage
#                          recovers.  Kill only when the process itself is hung.)
#   readiness → /readyz  (genuine storage probe; fails until WAL + memtable are
#                          ready.  Kubernetes removes the pod from the endpoints
#                          list so traffic is not routed to an unready pod.)
# httpGet.scheme is filled in by the chart: HTTPS when the pod terminates TLS
# (see `tls`), HTTP otherwise. Set it here only to override that.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# -- Graceful termination -------------------------------------------------------
# Must exceed config.operational.shutdown_timeout_secs to avoid a race where
# kubelet SIGKILLs the pod before Hearth finishes draining in-flight requests.
# Default here (60 s) covers the production shutdown_timeout_secs of 30 s with
# a 30 s buffer for tini signal forwarding and kernel scheduling jitter.
terminationGracePeriodSeconds: 60

# -- Node scheduling ------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# -- Pod disruption budget ------------------------------------------------------
# Hearth runs one replica, so no PDB can keep it available through a node
# drain — the pod is evicted and restarted elsewhere (brief downtime) either
# way. `maxUnavailable: 1` lets drains proceed; it exists for clusters whose
# policy requires every workload to carry a PDB. `minAvailable` is still
# accepted, but the chart refuses to render a value >= replicaCount, because
# that blocks `kubectl drain` forever.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  # minAvailable: 0

# Autoscaling (HPA) is intentionally removed.
# Hearth uses an embedded storage engine with an exclusive data_dir lock:
# only one replica may be running at a time.
#
# IMPORTANT — Multi-node clustering is EXPERIMENTAL and NOT production-supported
# in Hearth 1.x. Known defects include: follower RBAC cache staleness (C-5),
# immutable cluster membership (C-6, no online node add/remove), and HTTP 500
# on writes to follower nodes (H-3). The supported production topology is
# replicaCount=1 with a ReadWriteOnce PVC.
#
# Rollouts use strategy.type=Recreate (set in deployment.yaml): the old pod
# stops before the new one starts, so every upgrade or config change has a
# short outage. A PodDisruptionBudget does not change that.
