# Source: hearth/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hearth
  labels:
    helm.sh/chart: hearth-1.6.8
    app.kubernetes.io/name: hearth
    app.kubernetes.io/instance: hearth
    app.kubernetes.io/version: "1.6.8"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # Hearth uses an embedded storage engine with exclusive data_dir locking.
  # Rolling updates would start a new pod before the old one terminates,
  # causing the new pod to fail with a locked data directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hearth
      app.kubernetes.io/instance: hearth
  template:
    metadata:
      annotations:
        # Force pod restart when config changes
        checksum/config: 5e71ed84fc99394f3cd9e6e76bfc17bdfcf77325f651fde2164578bd151f6492
        checksum/secret: c152e5ebd8a93b1b229762ddc9c3f6243db5a4bdca7664159fea4019a0f2fab7
      labels:
        app.kubernetes.io/name: hearth
        app.kubernetes.io/instance: hearth
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: hearth
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: hearth
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          image: "ghcr.io/hearth-auth/hearth:1.6.8"
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/hearth", "serve", "-c", "/etc/hearth/hearth.yaml"]
          ports:
            - name: http
              containerPort: 8420
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,hearth=info"
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hearth
                  key: SMTP_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/hearth
              readOnly: true
            - name: data
              mountPath: /var/lib/hearth
            # readOnlyRootFilesystem requires a writable /tmp
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 2000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: hearth
        - name: data
          persistentVolumeClaim:
            claimName: hearth
        - name: tmp
          emptyDir: {}
---
# Source: hearth/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hearth
  labels:
    helm.sh/chart: hearth-1.6.8
    app.kubernetes.io/name: hearth
    app.kubernetes.io/instance: hearth
    app.kubernetes.io/version: "1.6.8"
    app.kubernetes.io/managed-by: Helm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - auth.example.com
      secretName: hearth-tls
  rules:
    - host: "auth.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hearth
                port:
                  number: 8420
