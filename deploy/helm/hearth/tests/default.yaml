apiVersion: v1
kind: ConfigMap
metadata:
  name: hearth
  labels:
    helm.sh/chart: hearth-1.6.8
    app.kubernetes.io/name: hearth
    app.kubernetes.io/instance: hearth
    app.kubernetes.io/version: "1.6.8"
    app.kubernetes.io/managed-by: Helm
data:
  hearth.yaml: |
    email:
      transport: log
    observability:
      log_format: json
      log_level: info
    operational:
      max_connections: 1024
      queue_depth: 4096
      request_timeout_secs: 30
      shutdown_timeout_secs: 10
    server:
      bind_address: 0.0.0.0
      port: 8420
    storage:
      data_dir: /var/lib/hearth
      fsync: true
      hot_tier_capacity: 10000
      memtable_flush_bytes: 67108864
      wal_max_size_bytes: 268435456
