---
# Source: hearth/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hearth
  labels:
    helm.sh/chart: hearth-1.6.8
    app.kubernetes.io/name: hearth
    app.kubernetes.io/instance: hearth
    app.kubernetes.io/version: "1.6.8"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # Hearth uses an embedded storage engine with exclusive data_dir locking.
  # Rolling updates would start a new pod before the old one terminates,
  # causing the new pod to fail with a locked data directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hearth
      app.kubernetes.io/instance: hearth
  template:
    metadata:
      annotations:
        # Force pod restart when config changes
        checksum/config: 25ea6296d05706370c4fe9436d66e7cc90d906e0193d2a22f83494afee0d7944
      labels:
        app.kubernetes.io/name: hearth
        app.kubernetes.io/instance: hearth
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: hearth
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: hearth
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          image: "ghcr.io/hearth-auth/hearth:1.6.8"
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/hearth", "serve", "-c", "/etc/hearth/hearth.yaml"]
          ports:
            - name: http
              containerPort: 8420
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,hearth=debug"
          volumeMounts:
            - name: config
              mountPath: /etc/hearth
              readOnly: true
            - name: data
              mountPath: /var/lib/hearth
            # readOnlyRootFilesystem requires a writable /tmp
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: hearth
        - name: data
          persistentVolumeClaim:
            claimName: hearth
        - name: tmp
          emptyDir: {}
