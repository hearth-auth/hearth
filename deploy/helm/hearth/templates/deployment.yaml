{{- /*
  Hearth is a single-writer embedded database: the storage engine takes an
  exclusive advisory lock on storage.data_dir (HEA-2107).  A second replica
  sharing the ReadWriteOnce PVC cannot start — it fails with AlreadyLocked.
  Fail rendering rather than shipping a Deployment that crash-loops.

  For high availability use Raft cluster mode with one PVC per node
  (see docs/guides/), not additional Deployment replicas.
*/ -}}
{{- if gt (int .Values.replicaCount) 1 }}
{{- fail (printf "hearth: replicaCount=%v is not a supported configuration. Hearth is single-writer and takes an exclusive lock on storage.data_dir; a second replica sharing the ReadWriteOnce PVC will fail to start with AlreadyLocked. Use Raft cluster mode (one PVC per node) for high availability, not extra Deployment replicas." .Values.replicaCount) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hearth.fullname" . }}
  labels:
    {{- include "hearth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Hearth uses an embedded storage engine with exclusive data_dir locking.
  # Rolling updates would start a new pod before the old one terminates,
  # causing the new pod to fail with a locked data directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hearth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Force pod restart when config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if include "hearth.hasSecret" . }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hearth.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hearth.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hearth
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ include "hearth.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/hearth", "serve", "-c", "/etc/hearth/hearth.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.config.server.port | default 8420 }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- if include "hearth.hasSecret" . }}
            {{- range $key, $val := .Values.secret.env }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "hearth.fullname" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/hearth
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if and .Values.secret.tlsCert .Values.secret.tlsKey }}
            - name: tls
              mountPath: /etc/hearth/tls
              readOnly: true
            {{- end }}
            # readOnlyRootFilesystem requires a writable /tmp
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "hearth.fullname" . }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "hearth.fullname" .) }}
        {{- end }}
        {{- if and .Values.secret.tlsCert .Values.secret.tlsKey }}
        - name: tls
          secret:
            secretName: {{ include "hearth.fullname" . }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
