name: Benchmark Regression Gate

# Runs criterion benchmarks and reports relative mean changes vs the cached
# main baseline. The relative % check is INFORMATIONAL — it emits GitHub
# Actions warning annotations but never blocks a PR.
#
# The AUTHORITATIVE regression blocker is the absolute latency gate built
# into each bench binary's custom main() (p50/p99 μs limits from
# ARCHITECTURE.md). Those gates panic on the runner if any target is
# breached, failing the job before criterion sampling begins.
#
# Shared GitHub Actions runners have ±10–15% variance for in-process
# microbenchmarks across Azure regions and time-of-day load. A hard relative
# threshold on top of absolute gates adds false positives without meaningful
# additional signal.
#
# On push to main: runs benchmarks, saves criterion baselines to cache.
# On PR into main: restores main baseline, runs benchmarks, emits warnings
#   if any benchmark's mean increases by more than BENCH_REGRESSION_THRESHOLD%.
#
# The stored baseline is keyed on the commit SHA so each main commit produces
# a fresh anchor. PRs use restore-keys prefix matching to pick up the
# nearest available baseline when the exact SHA key is missing.
#
# ADVISORY STATUS (HEA-2176, 2026-08-12)
# ───────────────────────────────────────
# `bench-required-summary` is an INTERNAL gate — it ensures the workflow
# itself is coherent, but it is NOT listed in the branch ruleset's required
# status checks. This workflow intentionally stays advisory for three reasons:
#
#  1. Absolute latency violations (bench binary panic) produce a visible FAIL
#     check on the PR. Engineers must act on these before merging. The failure
#     is not auto-blocking because the ±10–15% runner variance triggers
#     spurious panics under cross-region load, and sustained regression
#     requires multiple data points (a single CI run is insufficient evidence).
#
#  2. Compilation failures are already gated. If the codebase fails to
#     compile, the `quality` job in ci.yml catches it and fails required-summary
#     before bench even runs. A bench failure for the same reason is redundant.
#
#  3. Paths-filter trap. Making this workflow a standalone required status
#     check in the branch ruleset would block doc-only PRs forever because the
#     workflow never runs on them and GitHub never sees the check.
#
# Review cadence: PlatformEngineer checks bench job status at least monthly
# (first Monday of each month). If bench has been red for more than 7 days
# for reasons other than a known compilation failure, it must be triaged
# before the next release.
#
# Next review due: 2026-09-01.

on:
  pull_request:
    branches: [main]
    # HEA-680: tighten triggers — benchmarks only matter when storage hot-path
    # code, benchmark sources, or the dependency graph change. Doc-only,
    # template-only, or SDK-only PRs no longer burn ~60min of runner time.
    # HEA-739: added src/identity/** so validate_token hot-path changes trigger.
    paths:
      - "src/storage/**"
      - "src/identity/**"
      - "benches/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/check-bench-regression.sh"
      - ".github/workflows/bench-regression.yml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/_setup-rust.yml"
  push:
    branches: [main]
    # Push to main keeps the same path filter so baseline refreshes only run
    # when there's actually a benchmark-relevant change.
    paths:
      - "src/storage/**"
      - "src/identity/**"
      - "benches/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/check-bench-regression.sh"
      - ".github/workflows/bench-regression.yml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/_setup-rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BENCH_REGRESSION_THRESHOLD: "10"
  PROTOC: protoc

jobs:
  bench-regression:
    name: Benchmark regression (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain + protoc (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          # Benchmark job does not run clippy/fmt — skip the components.
          components: ""

      # ── PR: restore main baseline before running benchmarks ─────────────────

      - name: Restore criterion baseline (PR only)
        if: github.event_name == 'pull_request'
        id: restore-baseline
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/criterion
          # Prefer exact match; fall back to most-recent main baseline.
          key: criterion-baseline-main-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            criterion-baseline-main-

      - name: Warn if no baseline found (PR only)
        if: >
          github.event_name == 'pull_request' &&
          steps.restore-baseline.outputs.cache-hit != 'true'
        run: |
          echo "::warning::No criterion baseline found for main. Regression check will be skipped." \
               "Push to main first to establish a baseline."

      # ── PR: run benchmarks WITHOUT --save-baseline so the restored cache is ──
      # preserved; criterion writes results to 'new/' for comparison below.

      - name: Run storage_gate benchmark (PR)
        if: github.event_name == 'pull_request'
        run: |
          PROTOC=${{ env.PROTOC }} cargo bench --bench storage_gate -- \
            --noplot 2>&1

      - name: Run tiered_storage benchmark (PR)
        if: github.event_name == 'pull_request'
        run: |
          PROTOC=${{ env.PROTOC }} cargo bench --bench tiered_storage -- \
            --noplot 2>&1

      - name: Run demotion_latency benchmark (PR)
        if: github.event_name == 'pull_request'
        run: |
          PROTOC=${{ env.PROTOC }} cargo bench --bench demotion_latency -- \
            --noplot 2>&1

      - name: Run validate_token benchmark (PR)
        if: github.event_name == 'pull_request'
        run: |
          PROTOC=${{ env.PROTOC }} cargo bench --bench validate_token -- \
            --noplot 2>&1

      # ── main push: save fresh baselines to cache for future PRs ─────────────
      # --save-baseline main writes to target/criterion/.../main/estimates.json.

      - name: Run storage_gate benchmark (main)
        if: github.ref == 'refs/heads/main'
        run: |
          PROTOC=${{ env.PROTOC }} cargo bench --bench storage_gate -- \
            --save-baseline main --noplot 2>&1

      - name: Run tiered_storage benchmark (main)
        if: github.ref == 'refs/heads/main'
        run: |
          PROTOC=${{ env.PROTOC }} cargo bench --bench tiered_storage -- \
            --save-baseline main --noplot 2>&1

      - name: Run demotion_latency benchmark (main)
        if: github.ref == 'refs/heads/main'
        run: |
          PROTOC=${{ env.PROTOC }} cargo bench --bench demotion_latency -- \
            --save-baseline main --noplot 2>&1

      - name: Run validate_token benchmark (main)
        if: github.ref == 'refs/heads/main'
        run: |
          PROTOC=${{ env.PROTOC }} cargo bench --bench validate_token -- \
            --save-baseline main --noplot 2>&1

      # ── main push: persist freshly-run baselines for future PRs ─────────────

      - name: Save criterion baseline to cache (main push only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}

      # ── PR: compare current 'new' results against restored 'main' baseline ──

      - name: Report relative regression vs baseline (informational, non-fatal)
        if: github.event_name == 'pull_request'
        run: bash scripts/check-bench-regression.sh "${{ env.BENCH_REGRESSION_THRESHOLD }}"

  bench-required-summary:
    name: bench-required-summary
    if: always()
    needs: [bench-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check bench job passed or was skipped
        env:
          BENCH: ${{ needs.bench-regression.result }}
        run: |
          echo "bench-regression=$BENCH"
          if [ "$BENCH" = "failure" ] || [ "$BENCH" = "cancelled" ]; then
            echo "Bench regression job failed or was cancelled."
            exit 1
          fi
          echo "Bench job passed or was legitimately skipped."
