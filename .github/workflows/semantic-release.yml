name: Semantic Release

# Runs on every push to a release branch (main, 1.x, 2.x) and releases live.
# Each SDK is released independently with plain semantic-release (one matrix job
# per package). Plain semantic-release honours each package's .releaserc
# `tagFormat`, so the tags match the downstream publish triggers — unlike
# multi-semantic-release, which hardcodes `${name}@${version}` tags that match
# neither the sdk-<lang>-v* triggers nor Go's module-version scheme.
# The tags trigger the downstream publish workflows:
#   v*             → release.yml (binaries), helm.yml (Helm OCI)
#   sdk-node-v*    → sdk-publish-node.yml
#   sdk-ts-v*      → sdk-publish-typescript.yml
#   sdks/go/v*     → sdk-publish-go.yml
#   sdk-rust-v*    → sdk-publish-rust.yml
#   sdk-python-v*  → sdk-publish-python.yml
#   sdk-php-v*     → sdk-publish-php.yml
#   sdk-kotlin-v*  → sdk-publish-kotlin.yml
#
# Prerequisites (repository secrets that must be configured before enabling):
#   SEMANTIC_RELEASE_PAT — a Personal Access Token or GitHub App token with
#                          repo + workflow scopes.  GITHUB_TOKEN cannot be used
#                          because tags pushed by it do NOT trigger other
#                          workflows (GitHub security model).
#
# Bootstrap (run once before the first live release):
#   See docs/release-runbook.md § "Bootstrapping — anchor tags"

on:
  push:
    branches:
      - main
      - "1.x"
      - "2.x"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-run

jobs:
  release:
    name: release ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pkg: [node, typescript, go, rust, python, php, kotlin]
    steps:
      # Fetch full history so semantic-release can walk all commits.
      # Use the PAT so tags pushed back trigger the downstream publish workflows.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.SEMANTIC_RELEASE_PAT }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Install release tooling (semantic-release + plugins) declared in the
      # root package.json.  --ignore-scripts prevents the reflex-search
      # postinstall from running, which would otherwise cause a redundant
      # reinstall loop.
      - name: Install release tooling
        run: npm install --ignore-scripts

      # @semantic-release/git is intentionally absent from every .releaserc, so
      # semantic-release never pushes to main (the Protect main ruleset blocks
      # direct pushes) — core pushes only the version tag. semantic-release does
      # NOT publish (npmPublish:false / exec prepareCmd only); each sdk-<lang>-v*
      # tag triggers its sdk-publish-*.yml workflow for the registry publish.
      - name: Release ${{ matrix.pkg }}
        working-directory: sdks/${{ matrix.pkg }}
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
          GIT_AUTHOR_NAME: "hearth-release-bot"
          GIT_AUTHOR_EMAIL: "releases@hearth.example"
          GIT_COMMITTER_NAME: "hearth-release-bot"
          GIT_COMMITTER_EMAIL: "releases@hearth.example"

  release-server:
    name: release server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fetch full history so semantic-release can walk all commits.
      # Use the PAT so the pushed v* tag triggers docker.yml, helm.yml, release.yml.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.SEMANTIC_RELEASE_PAT }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install release tooling
        run: npm install --ignore-scripts

      # Runs from the repo root, picking up the root .releaserc.json.
      # tagFormat "v${version}" fires docker.yml + helm.yml + release.yml.
      - name: Release server
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
          GIT_AUTHOR_NAME: "hearth-release-bot"
          GIT_AUTHOR_EMAIL: "releases@hearth.example"
          GIT_COMMITTER_NAME: "hearth-release-bot"
          GIT_COMMITTER_EMAIL: "releases@hearth.example"
