name: Semantic Release

# Runs on every push to a release branch (main, 1.x, 2.x), currently in
# DRY-RUN (see the run step). When live, multi-semantic-release computes the
# next version for each package (server + all SDKs), updates CHANGELOG files,
# bumps version files, commits, and pushes git tags.  The tags trigger the
# downstream publish workflows:
#   v*             → release.yml (binaries), helm.yml (Helm OCI)
#   sdk-node-v*    → sdk-publish-node.yml
#   sdk-ts-v*      → sdk-publish-typescript.yml
#   sdks/go/v*     → sdk-publish-go.yml
#   sdk-rust-v*    → sdk-publish-rust.yml
#   sdk-python-v*  → sdk-publish-python.yml
#   sdk-php-v*     → sdk-publish-php.yml
#   sdk-kotlin-v*  → sdk-publish-kotlin.yml
#
# Prerequisites (repository secrets that must be configured before enabling):
#   SEMANTIC_RELEASE_PAT — a Personal Access Token or GitHub App token with
#                          repo + workflow scopes.  GITHUB_TOKEN cannot be used
#                          because tags pushed by it do NOT trigger other
#                          workflows (GitHub security model).
#
# Bootstrap (run once before the first live release):
#   See docs/release-runbook.md § "Bootstrapping — anchor tags"

on:
  push:
    branches:
      - main
      - "1.x"
      - "2.x"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-run

jobs:
  release:
    name: multi-semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fetch full history so semantic-release can walk all commits.
      # Use the PAT so commits + tags pushed back trigger downstream workflows.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.SEMANTIC_RELEASE_PAT }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Install release tooling (semantic-release + plugins) declared in the
      # root package.json.  --ignore-scripts prevents the reflex-search
      # postinstall from running, which would otherwise cause a redundant
      # reinstall loop.
      - name: Install release tooling
        run: npm install --ignore-scripts

      # Package discovery is via pnpm-workspace.yaml, read by
      # multi-semantic-release's @manypkg/get-packages. (npm ignores that file,
      # so the root `npm install` above is unaffected.) Packages with no new
      # releasable commits since their last tag are silently skipped.
      #
      # DRY-RUN until the anchor-tag bootstrap is complete
      # (docs/release-runbook.md § "Bootstrapping — anchor tags"): this
      # validates config and computes the next version per package WITHOUT
      # tagging or publishing, so a push to main cannot trigger an uncontrolled
      # first release. To enable live continuous deployment after bootstrapping,
      # remove `--dry-run` from the run line below.
      - name: Run multi-semantic-release (dry-run)
        run: npx multi-semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
          GIT_AUTHOR_NAME: "hearth-release-bot"
          GIT_AUTHOR_EMAIL: "releases@hearth.example"
          GIT_COMMITTER_NAME: "hearth-release-bot"
          GIT_COMMITTER_EMAIL: "releases@hearth.example"
