name: SDK publish — go

# CI verify on PRs and pushes to main; Go module publishing is handled
# automatically by proxy.golang.org fetching from the VCS on tag push.
# Module path: github.com/hearth-auth/hearth/sdks/go
# Version tags must follow the Go sub-module convention: sdks/go/vX.Y.Z

on:
  push:
    branches: [main]
    tags:
      - "sdks/go/v*"
    paths:
      - "sdks/go/**"
      - ".github/workflows/sdk-publish-go.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/go/**"
      - ".github/workflows/sdk-publish-go.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: go build + go vet github.com/hearth-auth/hearth/sdks/go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum

      - name: Build
        working-directory: sdks/go
        run: go build ./...

      - name: Vet
        working-directory: sdks/go
        run: go vet ./...

      # On tag push, the Go module proxy indexes the new version automatically.
      # No upload step needed — proxy.golang.org fetches directly from GitHub.
      - name: Confirm module proxy sync (informational)
        if: startsWith(github.ref, 'refs/tags/sdks/go/v')
        run: |
          VERSION="${GITHUB_REF_NAME#sdks/go/v}"
          echo "Tag sdks/go/v${VERSION} pushed."
          echo "proxy.golang.org will index github.com/hearth-auth/hearth/sdks/go@v${VERSION} automatically."
          echo "Verify at: https://pkg.go.dev/github.com/hearth-auth/hearth/sdks/go@v${VERSION}"
