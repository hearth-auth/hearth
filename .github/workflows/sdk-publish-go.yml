name: SDK publish — go

# CI verify on PRs and pushes to main; Go module publishing is handled
# automatically by proxy.golang.org fetching from the VCS on tag push.
# Module path: github.com/hearth-auth/hearth/sdks/go
# Version tags must follow the Go sub-module convention: sdks/go/vX.Y.Z

on:
  push:
    branches: [main]
    tags:
      - "sdks/go/v*"
    paths:
      - "sdks/go/**"
      - ".github/workflows/sdk-publish-go.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/go/**"
      - ".github/workflows/sdk-publish-go.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Gate: alarm when the tagged commit's CI is not green ───────────────────
  # Audit blocker B2 (§4.8#1): seven SDK releases shipped from a commit whose
  # own suite failed four tests, because only the binary channel was gated.
  #
  # This gate cannot BLOCK the Go channel, and that limit is deliberate rather
  # than hidden: proxy.golang.org indexes the module from the git tag, so the
  # publish already happened when this workflow starts. The gate turns an
  # ungreen tag into a red run an operator can see and retract. Blocking the Go
  # channel needs the check to move to tag creation, which is outside a workflow.
  gate:
    name: Await CI on this commit
    runs-on: ubuntu-latest
    # Must exceed the 120-minute wait in await-green-commit.
    timeout-minutes: 130

    permissions:
      contents: read
      checks: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Await a green verdict on this commit
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/await-green-commit
        with:
          check-name: required-summary
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Not a release tag — nothing to gate
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: echo "::notice::Not a release tag — nothing to gate."

  verify:
    name: go build + go vet github.com/hearth-auth/hearth/sdks/go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum

      - name: Build
        working-directory: sdks/go
        run: go build ./...

      - name: Vet
        working-directory: sdks/go
        run: go vet ./...

      # On tag push, the Go module proxy indexes the new version automatically.
      # No upload step needed — proxy.golang.org fetches directly from GitHub.
      - name: Confirm module proxy sync (informational)
        if: startsWith(github.ref, 'refs/tags/sdks/go/v')
        run: |
          VERSION="${GITHUB_REF_NAME#sdks/go/v}"
          echo "Tag sdks/go/v${VERSION} pushed."
          echo "proxy.golang.org will index github.com/hearth-auth/hearth/sdks/go@v${VERSION} automatically."
          echo "Verify at: https://pkg.go.dev/github.com/hearth-auth/hearth/sdks/go@v${VERSION}"
