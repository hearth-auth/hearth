name: SDK publish — python

# CI dry-run on PRs and pushes to main; live publish on sdk-python-v* tags.
# PyPI trusted publisher (OIDC, no long-lived token):
#   repo=hearth-auth/hearth, workflow=sdk-publish-python.yml, env=pypi

on:
  push:
    branches: [main]
    tags:
      - "sdk-python-v*"
    paths:
      - "sdks/python/**"
      - ".github/workflows/sdk-publish-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/python/**"
      - ".github/workflows/sdk-publish-python.yml"
  workflow_dispatch:

# id-token:write is required for PyPI trusted publisher OIDC attestation.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on PRs and branch pushes — builds and validates without touching PyPI.
  # No `environment:` here; GitHub only creates a deployment record when the job
  # is associated with a named environment, so omitting it prevents the spurious
  # "deployed to pypi" badge that appeared on open PRs (HEA-1543).
  validate:
    name: hatchling build + validate hearth-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling hatch twine

      - name: Build sdist + wheel
        working-directory: sdks/python
        run: python -m hatch build

      - name: Validate distributions
        run: twine check sdks/python/dist/*

  # Runs only on sdk-python-v* tags. The `environment: pypi` association here is
  # intentional — this is the job that actually publishes, so the deployment
  # record is correct and expected.
  publish:
    name: publish hearth-sdk to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/sdk-python-v')
    environment:
      name: pypi
      url: https://pypi.org/p/hearth-sdk
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling hatch twine

      # Stamp pyproject version from the tag so the wheel/sdist carry the
      # released version (no commit-back to main needed).
      - name: Stamp version from tag
        working-directory: sdks/python
        run: sed -i "s/^version = \"[^\"]*\"/version = \"${GITHUB_REF_NAME#sdk-python-v}\"/" pyproject.toml

      - name: Build sdist + wheel
        working-directory: sdks/python
        run: python -m hatch build

      - name: Validate distributions
        run: twine check sdks/python/dist/*

      - name: Publish (live — PyPI trusted publisher)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: sdks/python/dist/
