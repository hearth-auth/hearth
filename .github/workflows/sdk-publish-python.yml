name: SDK publish — python

# CI dry-run on PRs and pushes to main; live publish on sdk-python-v* tags.
# PyPI trusted publisher (OIDC, no long-lived token):
#   repo=hearth-auth/hearth, workflow=sdk-publish-python.yml, env=pypi

on:
  push:
    branches: [main]
    tags:
      - "sdk-python-v*"
    paths:
      - "sdks/python/**"
      - ".github/workflows/sdk-publish-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/python/**"
      - ".github/workflows/sdk-publish-python.yml"
  workflow_dispatch:

# id-token:write is required for PyPI trusted publisher OIDC attestation.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Gate: no package publishes from a commit whose CI is not green ─────────
  # Audit blocker B2 (§4.8#1): seven SDK releases and two registry packages
  # shipped from a commit whose own suite failed four tests, because only the
  # binary channel in release.yml was gated.
  #
  # An SDK tag points at a commit on main, so the verdict to wait for is
  # `required-summary` — the repository's single required context. The job
  # always runs so PR and main dry-runs keep working; only the wait is
  # tag-scoped, because only a tag publishes.
  gate:
    name: Await CI on this commit
    runs-on: ubuntu-latest
    # Must exceed the 120-minute wait in await-green-commit.
    timeout-minutes: 130

    permissions:
      contents: read
      checks: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Await a green verdict on this commit
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/await-green-commit
        with:
          check-name: required-summary
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Not a release tag — nothing to gate
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: echo "::notice::Not a release tag — dry-run only, no publish to gate."

  # Runs on PRs and branch pushes — builds and validates without touching PyPI.
  # No `environment:` here; GitHub only creates a deployment record when the job
  # is associated with a named environment, so omitting it prevents the spurious
  # "deployed to pypi" badge that appeared on open PRs (HEA-1543).
  validate:
    name: hatchling build + validate hearth-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling hatch twine

      - name: Build sdist + wheel
        working-directory: sdks/python
        run: python -m hatch build

      - name: Validate distributions
        run: twine check sdks/python/dist/*

  # Runs only on sdk-python-v* tags. The `environment: pypi` association here is
  # intentional — this is the job that actually publishes, so the deployment
  # record is correct and expected.
  publish:
    name: publish hearth-sdk to PyPI
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/sdk-python-v')
    environment:
      name: pypi
      url: https://pypi.org/p/hearth-sdk
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling hatch twine

      # Stamp pyproject version from the tag so the wheel/sdist carry the
      # released version (no commit-back to main needed).
      - name: Stamp version from tag
        working-directory: sdks/python
        run: sed -i "s/^version = \"[^\"]*\"/version = \"${GITHUB_REF_NAME#sdk-python-v}\"/" pyproject.toml

      - name: Build sdist + wheel
        working-directory: sdks/python
        run: python -m hatch build

      - name: Validate distributions
        run: twine check sdks/python/dist/*

      - name: Publish (live — PyPI trusted publisher)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: sdks/python/dist/
