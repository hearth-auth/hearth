name: SDK publish — python

# CI dry-run on PRs and pushes to main; live publish on sdk-python-v* tags.
# PyPI trusted publisher (OIDC, no long-lived token):
#   repo=hearth-auth/hearth, workflow=sdk-publish-python.yml, env=pypi

on:
  push:
    branches: [main]
    tags:
      - "sdk-python-v*"
    paths:
      - "sdks/python/**"
      - ".github/workflows/sdk-publish-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/python/**"
      - ".github/workflows/sdk-publish-python.yml"
  workflow_dispatch:

# id-token:write is required for PyPI trusted publisher OIDC attestation.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: hatchling build + publish hearth-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/hearth-sdk
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@v5 # TODO(HEA-1487): pin to SHA
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling hatch twine

      # Tag-only releases (no commit-back to main): stamp pyproject version from
      # the tag BEFORE building so the wheel/sdist carry the released version.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/sdk-python-v')
        working-directory: sdks/python
        run: sed -i "s/^version = \"[^\"]*\"/version = \"${GITHUB_REF_NAME#sdk-python-v}\"/" pyproject.toml

      - name: Build sdist + wheel
        working-directory: sdks/python
        run: python -m hatch build

      - name: Validate distributions
        # twine check validates metadata and long_description without uploading.
        run: twine check sdks/python/dist/*

      # Dry-run on PRs and branch pushes; live upload only on sdk-python-v* tags.
      - name: Publish (live — PyPI trusted publisher)
        if: startsWith(github.ref, 'refs/tags/sdk-python-v')
        # Scorecard-exception: SHA pin intentionally omitted — PyPI OIDC trusted
        # publishing verifies the workflow ref; a digest pin breaks the OIDC match.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
