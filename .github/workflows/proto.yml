# Proto governance gates (HEA-973).
#
# Called by ci.yml on every PR or push that touches proto sources; ci.yml's
# `proto` filter output decides. Three checks:
#   1. buf lint       — STANDARD lint rules (exceptions tracked in buf.yaml)
#   2. buf format     — canonical style, fails if any file is unformatted
#   3. buf breaking   — backwards-compatibility check against main
#
# This workflow is intentionally lightweight (no Rust compilation) so
# proto-only PRs get fast feedback without burning the full CI matrix.

# Audit 2026-08-28 §4.12#12: the PR run reached no required check, so a proto
# lint, format or breaking-change failure could not block a merge. The PR entry
# point is now ci.yml, which calls this as a reusable workflow and lists it in
# `required-summary`'s `needs:`. ci.yml runs on both pull_request and push to
# main, so the push trigger that used to live here is not duplicated.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Literal prefix, not ${{ github.workflow }}: when ci.yml calls this workflow,
  # github.workflow is "CI", and a shared group would cancel ci.yml's own run.
  group: proto-governance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proto:
    name: proto (lint + format + breaking)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Breaking check compares against .git#branch=main — full history
          # required so the comparison works on PR branches.
          fetch-depth: 0
          persist-credentials: false

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0

      - name: buf lint
        run: make proto-lint

      - name: buf format (fail if unformatted)
        run: make proto-format-check

      - name: buf breaking (vs main)
        # Skip on direct pushes to main — the breaking check compares against
        # main, which is the current commit on push events. Only meaningful
        # for PR branches.
        if: github.event_name == 'pull_request'
        run: make proto-breaking
