name: SDK publish — kotlin (dry-run)

# Dry-run gate for the io.hearth:hearth-core Maven artifact.
# Publishes to the local Maven repository (no credentials) to validate the
# Gradle build, POM generation, and signing plugin wiring. Flip to
# publishToSonatypeRepository in HEA-1487 once GPG key + OSSRH credentials
# are provisioned (pass signingKey + signingPassword as project properties).

on:
  push:
    branches: [main]
    paths:
      - "sdks/kotlin/**"
      - ".github/workflows/sdk-publish-kotlin.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/kotlin/**"
      - ".github/workflows/sdk-publish-kotlin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish-dry-run:
    name: publishToMavenLocal (signing dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Publish to local Maven repository
        # signingKey is intentionally absent — signing.required evaluates to
        # false and the step succeeds without credentials.
        working-directory: sdks/kotlin
        run: gradle publishToMavenLocal

      - name: Verify artifact was written
        run: |
          ARTIFACT=$(find ~/.m2/repository/io/hearth -name "*.jar" 2>/dev/null | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "ERROR: no artifact found in local Maven repo"
            exit 1
          fi
          echo "OK: artifact published → $ARTIFACT"
