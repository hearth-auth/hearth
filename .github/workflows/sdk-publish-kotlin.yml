name: SDK publish — kotlin

# CI dry-run on PRs and pushes to main; live publish to Maven Central on
# sdk-kotlin-v* tags via Sonatype OSSRH.
# Required repository secrets: MAVEN_SIGNING_KEY (ASCII-armored PGP private key),
# MAVEN_SIGNING_PASSWORD, OSSRH_USERNAME, OSSRH_PASSWORD.

on:
  push:
    branches: [main]
    tags:
      - "sdk-kotlin-v*"
    paths:
      - "sdks/kotlin/**"
      - ".github/workflows/sdk-publish-kotlin.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/kotlin/**"
      - ".github/workflows/sdk-publish-kotlin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Gate: no package publishes from a commit whose CI is not green ─────────
  # Audit blocker B2 (§4.8#1): seven SDK releases and two registry packages
  # shipped from a commit whose own suite failed four tests, because only the
  # binary channel in release.yml was gated.
  #
  # An SDK tag points at a commit on main, so the verdict to wait for is
  # `required-summary` — the repository's single required context. The job
  # always runs so PR and main dry-runs keep working; only the wait is
  # tag-scoped, because only a tag publishes.
  gate:
    name: Await CI on this commit
    runs-on: ubuntu-latest
    # Must exceed the 120-minute wait in await-green-commit.
    timeout-minutes: 130

    permissions:
      contents: read
      checks: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Await a green verdict on this commit
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/await-green-commit
        with:
          check-name: required-summary
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Not a release tag — nothing to gate
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: echo "::notice::Not a release tag — dry-run only, no publish to gate."

  publish:
    needs: [gate]
    name: gradle publish io.hearth:hearth-{core,ktor,spring}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.10"

      # Dry-run on PRs and branch pushes: publish to local Maven repo (no credentials).
      # signing.required evaluates to false when signingKey is absent.
      - name: Publish (dry-run — local Maven)
        if: "!startsWith(github.ref, 'refs/tags/sdk-kotlin-v')"
        working-directory: sdks/kotlin
        run: gradle publishToMavenLocal

      - name: Verify local artifact
        if: "!startsWith(github.ref, 'refs/tags/sdk-kotlin-v')"
        run: |
          ARTIFACT=$(find ~/.m2/repository/io/hearth -name "*.jar" 2>/dev/null | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "ERROR: no artifact found in local Maven repo"
            exit 1
          fi
          echo "OK: artifact published → $ARTIFACT"

      # Tag-only releases (no commit-back to main): stamp build.gradle.kts
      # version from the tag name before publishing.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/sdk-kotlin-v')
        working-directory: sdks/kotlin
        run: sed -i "s/^version = \"[^\"]*\"/version = \"${GITHUB_REF_NAME#sdk-kotlin-v}\"/" build.gradle.kts

      # Task 26.53: refuse to publish without the credentials.
      #
      # `publishing.repositories` only declares the OSSRH target when
      # `ossrhUsername`/`ossrhPassword` are present. Absent them, `gradle
      # publish` has zero repositories, does nothing and exits 0 — which is
      # exactly how 43 tags produced 43 green runs and no artifact. Fail here
      # instead, where the message can say which secret is missing.
      - name: Require publishing credentials
        if: startsWith(github.ref, 'refs/tags/sdk-kotlin-v')
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${OSSRH_USERNAME:-}" ]   || missing="$missing OSSRH_USERNAME"
          [ -n "${OSSRH_PASSWORD:-}" ]   || missing="$missing OSSRH_PASSWORD"
          [ -n "${MAVEN_SIGNING_KEY:-}" ]|| missing="$missing MAVEN_SIGNING_KEY"
          if [ -n "$missing" ]; then
            echo "::error::cannot publish to Maven Central — missing secret(s):$missing"
            echo "A tag build without these would publish NOTHING and still exit 0."
            exit 1
          fi
          echo "OK: publishing credentials present."

      # Task 26.53: prove the publish WILL reach a repository, before it runs.
      #
      # `gradle publish` with no configured repository is a no-op that exits 0.
      # The task graph is the evidence: every module whose
      # `publishMavenPublicationToOssrhRepository` is missing would ship nothing,
      # whatever the exit code says. GA audit: this used to accept ANY module's
      # task, so hearth-ktor and hearth-spring (which had no repository block)
      # stayed silent no-ops; and `gradle … | tee | grep -q` under pipefail can
      # fail on tee's SIGPIPE even when the task is present. The graph is now
      # captured to a file, and all three modules are required.
      - name: Verify every module targets the OSSRH repository
        if: startsWith(github.ref, 'refs/tags/sdk-kotlin-v')
        working-directory: sdks/kotlin
        run: |
          set -euo pipefail
          gradle publish --dry-run > /tmp/publish-tasks.txt 2>&1
          missing=""
          for module in hearth-core hearth-ktor hearth-spring; do
            grep -q ":${module}:publishMavenPublicationToOssrhRepository" /tmp/publish-tasks.txt \
              || missing="$missing $module"
          done
          if [ -n "$missing" ]; then
            echo "::error::gradle publish has NO OSSRH repository target for:$missing — \
          those modules would publish nothing. See publishing.repositories in each build.gradle.kts."
            cat /tmp/publish-tasks.txt
            exit 1
          fi
          echo "OK: all three modules target the OSSRH repository."
        env:
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}

      # Live publish on sdk-kotlin-v* tags: sign and upload to the Central
      # Publisher Portal's OSSRH Staging API.
      - name: Publish (live — Maven Central via OSSRH Staging API)
        if: startsWith(github.ref, 'refs/tags/sdk-kotlin-v')
        working-directory: sdks/kotlin
        run: gradle publish
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}

      # GA audit: an upload through the OSSRH Staging API with plain
      # `maven-publish` stops in staging — it never reaches the Central
      # Publisher Portal, so nothing is ever released. Sonatype's documented
      # fix is one POST to /manual/upload/defaultRepository/<namespace>, with a
      # Bearer token of base64("<token user>:<token password>")
      # (https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/).
      # `automatic` releases the deployment once Central validation passes;
      # the tag already waited for a green required-summary (gate job).
      # The namespace (`io.hearth`, the Gradle group) must be verified for the
      # token's account in the Central Portal — an owner action.
      - name: Transfer the staged deployment to the Central Publisher Portal
        if: startsWith(github.ref, 'refs/tags/sdk-kotlin-v')
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_PASSWORD" | base64 -w0)"
          status="$(curl -sS -o /tmp/portal-upload.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${token}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.hearth?publishing_type=automatic")"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Central Portal transfer failed (HTTP ${status}); the deployment is still in staging."
            cat /tmp/portal-upload.txt
            exit 1
          fi
          echo "OK: staged deployment transferred to the Central Publisher Portal (HTTP ${status})."
