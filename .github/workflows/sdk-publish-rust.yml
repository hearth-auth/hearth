name: SDK publish — rust

# CI dry-run on PRs and pushes to main; live publish on sdk-rust-v* tags.
# CARGO_REGISTRY_TOKEN must be set as a repository secret (crates.io API token).

on:
  push:
    branches: [main]
    tags:
      - "sdk-rust-v*"
    paths:
      - "sdks/rust/**"
      - ".github/workflows/sdk-publish-rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/rust/**"
      - ".github/workflows/sdk-publish-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish hearth-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: sdks/rust

      # Dry-run on PRs and branch pushes; live publish only on sdk-rust-v* tags.
      - name: Publish (dry-run)
        if: "!startsWith(github.ref, 'refs/tags/sdk-rust-v')"
        working-directory: sdks/rust
        run: cargo publish --dry-run

      - name: Publish (live)
        if: startsWith(github.ref, 'refs/tags/sdk-rust-v')
        working-directory: sdks/rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
