name: SDK publish — rust

# CI dry-run on PRs and pushes to main; live publish on sdk-rust-v* tags.
# Tokenless publish via crates.io OIDC trusted publishing — no CARGO_REGISTRY_TOKEN
# stored; a short-lived token is minted at publish time by crates-io-auth-action.

on:
  push:
    branches: [main]
    tags:
      - "sdk-rust-v*"
    paths:
      - "sdks/rust/**"
      - ".github/workflows/sdk-publish-rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/rust/**"
      - ".github/workflows/sdk-publish-rust.yml"
  workflow_dispatch:

# id-token:write is required for crates.io OIDC trusted publishing.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: no package publishes from a commit whose CI is not green ─────────
  # Audit blocker B2 (§4.8#1): seven SDK releases and two registry packages
  # shipped from a commit whose own suite failed four tests, because only the
  # binary channel in release.yml was gated.
  #
  # An SDK tag points at a commit on main, so the verdict to wait for is
  # `required-summary` — the repository's single required context. The job
  # always runs so PR and main dry-runs keep working; only the wait is
  # tag-scoped, because only a tag publishes.
  gate:
    name: Await CI on this commit
    runs-on: ubuntu-latest
    # Must exceed the 120-minute wait in await-green-commit.
    timeout-minutes: 130

    permissions:
      contents: read
      checks: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Await a green verdict on this commit
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/await-green-commit
        with:
          check-name: required-summary
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Not a release tag — nothing to gate
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: echo "::notice::Not a release tag — dry-run only, no publish to gate."

  publish:
    needs: [gate]
    name: cargo publish hearth-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: sdks/rust

      # Dry-run on PRs and branch pushes; live publish only on sdk-rust-v* tags.
      - name: Publish (dry-run)
        if: "!startsWith(github.ref, 'refs/tags/sdk-rust-v')"
        working-directory: sdks/rust
        run: cargo publish --dry-run

      # Tag-only releases (no commit-back to main): stamp Cargo.toml version
      # from the tag name before publishing.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/sdk-rust-v')
        working-directory: sdks/rust
        run: sed -i "s/^version = \"[^\"]*\"/version = \"${GITHUB_REF_NAME#sdk-rust-v}\"/" Cargo.toml

      # Exchange the GitHub OIDC token for a short-lived crates.io token.
      - name: Authenticate to crates.io (OIDC trusted publishing)
        id: crates-auth
        if: startsWith(github.ref, 'refs/tags/sdk-rust-v')
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish (live — OIDC trusted publishing, no token)
        if: startsWith(github.ref, 'refs/tags/sdk-rust-v')
        working-directory: sdks/rust
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
