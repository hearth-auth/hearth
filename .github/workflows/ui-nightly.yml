name: UI Nightly

# Consolidated nightly UI workflow (HEA-680).
#
# Replaces ui-tests-cross-browser.yml + ui-tests-tls-smoke.yml.
#
# Structure: one `build` job compiles the `hearth` debug binary once and
# uploads it as a workflow artifact. Four parallel `test` matrix legs
# (chromium, firefox, webkit, https-tls-chromium) download that artifact
# and run their suite against it. This is the immutable-artifact pattern
# applied to CI: build once, promote through environments.
#
# All test legs are informational (continue-on-error: true). Failures
# surface in the GitHub Actions summary and uploaded Playwright reports;
# they do not block merges. Branch protection for these checks is owned
# by HEA-684 (the post-merge required-checks rename), not by this PR.

on:
  schedule:
    # 02:00 UTC daily — after typical EU/US working-day pushes settle
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build hearth binary (shared artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Force HTTP/1.1 to eliminate crates.io HTTP/2 framing-layer resets (HEA-1530).
      CARGO_HTTP_MULTIPLEXING: "false"
      # Retry transient registry downloads; default is 3 (HEA-1530).
      CARGO_NET_RETRY: "10"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain + tailwind (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: ""
          install-tailwind: "true"

      - name: Build Hearth binary (debug)
        run: |
          for i in 1 2 3; do
            PROTOC=protoc make build && exit 0
            echo "build attempt $i failed; retrying in $((i*15))s"; sleep $((i*15))
          done
          exit 1

      - name: Upload hearth binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hearth-binary
          # Include the css asset so the served UI matches what was built.
          path: |
            target/debug/hearth
            src/protocol/web/assets/app.css
          retention-days: 1

  test:
    name: UI tests — ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, https-tls-chromium]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download hearth binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hearth-binary
          # Preserves target/debug/hearth and src/protocol/web/assets/app.css.
          path: .

      - name: Restore binary execute permission
        run: chmod +x target/debug/hearth

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install UI test dependencies
        run: cd tests/ui && npm ci

      - name: Resolve Playwright browser name
        id: pw-browser
        run: |
          # https-tls-chromium reuses chromium under the hood; the suffix only
          # tags the leg for reporting. Strip it for the Playwright install.
          BROWSER="${{ matrix.browser }}"
          case "$BROWSER" in
            https-tls-chromium) echo "name=chromium" >> "$GITHUB_OUTPUT" ;;
            *)                  echo "name=$BROWSER" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install Playwright browser — ${{ steps.pw-browser.outputs.name }}
        run: cd tests/ui && npx playwright install ${{ steps.pw-browser.outputs.name }} --with-deps

      - name: Wipe dev data (clean slate)
        run: make dev-reset

      # ── Plain HTTP path (chromium / firefox / webkit) ───────────────────────

      - name: Start Hearth dev server (HTTP)
        if: matrix.browser != 'https-tls-chromium'
        run: HEARTH_DEV_DATA_DIR=./data/dev ./target/debug/hearth serve --dev &

      - name: Wait for HTTP server to be ready
        if: matrix.browser != 'https-tls-chromium'
        run: cd tests/ui && npx wait-on http://127.0.0.1:8420/health --timeout 60000

      - name: Run smoke + flows + regression (${{ matrix.browser }})
        if: matrix.browser != 'https-tls-chromium'
        run: |
          bash tests/ui/pw-run.sh test \
            --project=smoke \
            --project=flows \
            --project=regression

      # ── HTTPS / TLS path ────────────────────────────────────────────────────

      - name: Generate self-signed TLS certificate
        if: matrix.browser == 'https-tls-chromium'
        run: |
          mkdir -p tls-certs
          openssl req -x509 -newkey rsa:2048 -keyout tls-certs/key.pem \
            -out tls-certs/cert.pem -days 1 -nodes \
            -subj "/CN=localhost" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"

      - name: Write TLS hearth config
        if: matrix.browser == 'https-tls-chromium'
        run: |
          cat > hearth.yaml << 'EOF'
          server:
            bind: "127.0.0.1:8443"
            tls:
              cert_file: "tls-certs/cert.pem"
              key_file: "tls-certs/key.pem"
          EOF

      - name: Start Hearth dev server (HTTPS)
        if: matrix.browser == 'https-tls-chromium'
        run: |
          HEARTH_DEV_DATA_DIR=./data/dev ./target/debug/hearth serve --dev \
            --config hearth.yaml &

      - name: Wait for HTTPS server to be ready
        if: matrix.browser == 'https-tls-chromium'
        run: |
          cd tests/ui && npx wait-on \
            --timeout 60000 \
            --insecure \
            https://127.0.0.1:8443/health

      - name: Run smoke suite against HTTPS endpoint
        if: matrix.browser == 'https-tls-chromium'
        run: bash tests/ui/pw-run.sh test --project=smoke
        env:
          HEARTH_URL: https://127.0.0.1:8443
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

      # ── Reporting (all legs) ────────────────────────────────────────────────

      - name: Upload Playwright report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-nightly-report-${{ matrix.browser }}
          path: tests/ui/reports/html/
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "## UI Nightly — ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "All tests passed on ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "One or more tests failed on ${{ matrix.browser }} — see Playwright report artifact" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Reference integration — full-stack-demo (HEA-2058) ─────────────────────
  #
  # Boots the full demo stack (Hearth + Go backend :8421 + Vite :5173) and runs
  # the reference-integration Playwright suite from tests/ui/integration/.
  #
  # continue-on-error: true — a flaky browser test MUST NOT block a PR.
  # This job is informational only; failures surface via the Playwright HTML
  # report uploaded as an artifact for the nightly run.
  reference-integration:
    name: Reference integration — full-stack-demo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download hearth binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hearth-binary
          path: .

      - name: Restore binary execute permission
        run: chmod +x target/debug/hearth

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: examples/full-stack-demo/backend/go.mod
          cache-dependency-path: examples/full-stack-demo/backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            tests/ui/package-lock.json
            examples/full-stack-demo/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: examples/full-stack-demo/frontend
        run: npm ci

      - name: Install integration test dependencies (reuse tests/ui)
        working-directory: tests/ui
        run: npm ci

      - name: Install Playwright browser (chromium)
        working-directory: tests/ui
        run: npx playwright install chromium --with-deps

      - name: Start Hearth dev server (demo config)
        run: |
          # HEARTH_MAILCATCHER_PASSWORD must be set before Hearth starts so the
          # mailcatcher endpoint accepts it; flow 2 (self-registration) needs it.
          HEARTH_MAILCATCHER_PASSWORD=integration-mailcatcher-pw \
          ./target/debug/hearth serve --dev \
            --config examples/full-stack-demo/hearth.yaml &
          echo "HEARTH_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Hearth to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8420/health > /dev/null 2>&1; then
              echo "Hearth ready after ${i}×0.5s"
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8420/health || { echo "Hearth failed to start"; exit 1; }

      - name: Bootstrap and resolve demo realm
        run: |
          # Bootstrap (first call on a fresh server): returns the dev-realm token
          # plus a cross-realm SYSTEM-realm admin token (HEA-2087).
          BOOT=$(curl -sf -X POST http://127.0.0.1:8420/admin/bootstrap)
          ADMIN_TOKEN=$(echo "$BOOT" | jq -r '.access_token')
          SYS_REALM_ID=$(echo "$BOOT" | jq -r '.realm_id')

          # The nil-UUID system-realm token — the ONLY credential that passes the
          # scoped_realm BOLA guard for cross-realm ops (e.g. flow 5 signing-key
          # rotation). Export it so the suite's bootstrapAdmin() consumes it and
          # never re-bootstraps (which would 401 on an already-bootstrapped box).
          SYSTEM_ADMIN_TOKEN=$(echo "$BOOT" | jq -r '.system_access_token // empty')
          SYSTEM_REALM_ID=$(echo "$BOOT" | jq -r '.system_realm_id // empty')
          echo "HEARTH_ADMIN_TOKEN=${SYSTEM_ADMIN_TOKEN:-$ADMIN_TOKEN}" >> "$GITHUB_ENV"
          echo "HEARTH_SYSTEM_REALM_ID=${SYSTEM_REALM_ID:-$SYS_REALM_ID}" >> "$GITHUB_ENV"

          # Resolve demo realm UUID (created from config on startup)
          DEMO_REALM_ID=$(
            curl -sf \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              -H "X-Realm-ID: $SYS_REALM_ID" \
              http://127.0.0.1:8420/admin/realms \
            | jq -r '.items[] | select(.name == "demo") | .id'
          )
          echo "DEMO_REALM_ID=$DEMO_REALM_ID" >> "$GITHUB_ENV"

      - name: Write frontend .env
        run: |
          # VITE_HEARTH_URL points to the Vite dev server, which proxies
          # /realms, /admin, /health to Hearth on :8420 (see vite.config.ts).
          # VITE_CLIENT_ID is the deterministic UUID seeded from hearth.yaml.
          cat > examples/full-stack-demo/frontend/.env << EOF
          VITE_HEARTH_URL=http://localhost:5173
          VITE_REALM_SLUG=demo
          VITE_REALM_ID=$DEMO_REALM_ID
          VITE_CLIENT_ID=f7057d27-61fd-555e-b2af-ba8edd112237
          VITE_API_URL=http://localhost:8421
          EOF

      - name: Build Go backend
        working-directory: examples/full-stack-demo/backend
        # Build ONLY the main package. `./...` matches handlers/, middleware/,
        # store/ and integration/ too, and `go build -o <file>` refuses to write
        # multiple packages to a single non-directory path — which failed this
        # job on every run since it was added.
        run: go build -o /tmp/demo-backend .

      - name: Start Go backend
        run: |
          HEARTH_URL=http://127.0.0.1:8420 \
          REALM_ID="$DEMO_REALM_ID" \
          REALM_SLUG=demo \
          PORT=8421 \
          /tmp/demo-backend &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Start Vite dev server
        working-directory: examples/full-stack-demo/frontend
        run: |
          npm run dev -- --port 5173 --strictPort --host 127.0.0.1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend and frontend to be ready
        run: |
          for svc in "backend:8421/health" "frontend:5173"; do
            name="${svc%%:*}"
            addr="${svc#*:}"
            for i in $(seq 1 60); do
              if curl -sf "http://127.0.0.1:${addr}" > /dev/null 2>&1; then
                echo "$name ready after ${i}×0.5s"
                break
              fi
              sleep 0.5
            done
            curl -sf "http://127.0.0.1:${addr}" || { echo "$name failed to start"; exit 1; }
          done

      - name: Run reference-integration suite
        working-directory: tests/ui
        env:
          # Coords — names match integration/config.ts (uses localhost, not 127.0.0.1,
          # so the browser origin matches the registered redirect_uri).
          HEARTH_URL: http://localhost:8420
          DEMO_BACKEND_URL: http://localhost:8421
          DEMO_FRONTEND_URL: http://localhost:5173
          DEMO_REALM_SLUG: demo
          DEMO_CLIENT_ID: f7057d27-61fd-555e-b2af-ba8edd112237
          # Required for flow 2 (self-registration): authenticates the mailcatcher
          # session so the test can read the verification email. Must match the
          # password Hearth was started with above.
          HEARTH_MAILCATCHER_PASSWORD: integration-mailcatcher-pw
          # Cross-realm system-realm admin credential resolved above (HEA-2087).
          # Consumed by bootstrapAdmin(); required for flow 5 signing-key rotation
          # and avoids a 401 re-bootstrap against the already-bootstrapped server.
          HEARTH_ADMIN_TOKEN: ${{ env.HEARTH_ADMIN_TOKEN }}
          HEARTH_SYSTEM_REALM_ID: ${{ env.HEARTH_SYSTEM_REALM_ID }}
        run: >
          npx playwright test
          --config=playwright.integration.config.ts
          --project=integration

      - name: Stop demo services
        if: always()
        run: |
          kill "$FRONTEND_PID" 2>/dev/null || true
          kill "$BACKEND_PID"  2>/dev/null || true
          kill "$HEARTH_PID"   2>/dev/null || true

      - name: Upload Playwright report + traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-integration-report
          path: |
            tests/ui/reports/integration-html/
            tests/ui/reports/integration-output/
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "## Reference Integration — full-stack-demo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "All integration tests passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "One or more tests failed — see **reference-integration-report** artifact for the Playwright HTML report." >> "$GITHUB_STEP_SUMMARY"
          fi
