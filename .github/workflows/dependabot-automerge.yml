name: Dependabot auto-merge
on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # contents:write + pull-requests:write are the minimum GitHub API permissions
    # required for `gh pr merge --auto --squash`. No lower-privilege alternative
    # exists on the GitHub API. The top-level `permissions: {}` already denies all
    # other scopes. This job is additionally gated on `github.actor ==
    # 'dependabot[bot]'` and patch/minor update types only (see the `if:` below).
    permissions:
      contents: write
      pull-requests: write
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for patch and minor updates
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
