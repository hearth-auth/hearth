name: SDK publish — php

# CI validate on PRs and pushes to main; Packagist sync is webhook-triggered
# automatically on sdk-php-v* tag push (no CI publish step required).
# Webhook configuration: https://packagist.org/packages/hearth-auth/php-sdk
# Connect via: https://packagist.org/profile/ → Setup GitHub Hook

on:
  push:
    branches: [main]
    tags:
      - "sdk-php-v*"
    paths:
      - "sdks/php/**"
      - ".github/workflows/sdk-publish-php.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/php/**"
      - ".github/workflows/sdk-publish-php.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Gate: alarm when the tagged commit's CI is not green ───────────────────
  # Audit blocker B2 (§4.8#1): seven SDK releases shipped from a commit whose
  # own suite failed four tests, because only the binary channel was gated.
  #
  # This gate cannot BLOCK the PHP channel, and that limit is deliberate rather
  # than hidden: Packagist publishes from the git tag on its own webhook, so the
  # publish already happened when this workflow starts. The gate turns an
  # ungreen tag into a red run an operator can see and retract. Blocking the PHP
  # channel needs the check to move to tag creation, which is outside a workflow.
  gate:
    name: Await CI on this commit
    runs-on: ubuntu-latest
    # Must exceed the 120-minute wait in await-green-commit.
    timeout-minutes: 130

    permissions:
      contents: read
      checks: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Await a green verdict on this commit
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/await-green-commit
        with:
          check-name: required-summary
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Not a release tag — nothing to gate
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: echo "::notice::Not a release tag — nothing to gate."

  validate:
    name: composer validate hearth-auth/php-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: json, sodium
          tools: composer:v2

      - name: Validate composer.json schema
        working-directory: sdks/php
        run: composer validate --strict --no-check-publish

      - name: Install production dependencies
        working-directory: sdks/php
        run: composer install --no-dev --prefer-dist --no-interaction --no-scripts

      - name: Verify autoloader
        working-directory: sdks/php
        run: composer dump-autoload --no-dev --optimize

      # Packagist syncs automatically via GitHub webhook on tag push.
      - name: Confirm Packagist sync (informational)
        if: startsWith(github.ref, 'refs/tags/sdk-php-v')
        run: |
          VERSION="${GITHUB_REF_NAME#sdk-php-v}"
          echo "Tag sdk-php-v${VERSION} pushed."
          echo "Packagist will sync hearth-auth/php-sdk automatically via GitHub webhook."
          echo "Verify at: https://packagist.org/packages/hearth-auth/php-sdk"
