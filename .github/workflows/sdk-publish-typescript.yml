name: SDK publish — typescript

# CI dry-run on PRs and pushes to main; live publish on sdk-ts-v* tags.
# Tokenless publish via npm OIDC trusted publishing — no NPM_TOKEN stored.
# npm trusted-publisher binding: repo=hearth-auth/hearth, workflow=sdk-publish-typescript.yml
# Requires npm >= 11.5.1 (Node 20 ships npm 10) — upgraded in the job below.

on:
  push:
    branches: [main]
    tags:
      - "sdk-ts-v*"
    paths:
      - "sdks/typescript/**"
      - ".github/workflows/sdk-publish-typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/typescript/**"
      - ".github/workflows/sdk-publish-typescript.yml"
  workflow_dispatch:

# id-token:write is required for npm OIDC trusted publishing + provenance.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: npm publish @hearth-auth/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      # Node 20 bundles npm 10, which predates OIDC trusted publishing.
      - name: Upgrade npm for OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm ci

      - name: Build
        working-directory: sdks/typescript
        run: npm run build

      # Dry-run on PRs and branch pushes; live publish only on sdk-ts-v* tags.
      - name: Publish (dry-run)
        if: "!startsWith(github.ref, 'refs/tags/sdk-ts-v')"
        working-directory: sdks/typescript
        run: npm publish --dry-run --provenance

      - name: Publish (live — OIDC trusted publishing, no token)
        if: startsWith(github.ref, 'refs/tags/sdk-ts-v')
        working-directory: sdks/typescript
        run: npm publish --provenance --access public
