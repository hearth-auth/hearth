name: Helm

# Lint and snapshot-test the Hearth Helm chart on changes to deploy/helm/.

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/**"
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Helm lint + template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814  # v4.2.0
        with:
          version: "v3.16.4"

      - name: helm lint
        run: make helm-lint

      - name: helm template snapshot diff
        run: make helm-template
