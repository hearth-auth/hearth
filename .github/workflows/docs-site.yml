name: Docs Site

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/guides/**'
  # Allow manual trigger from the Actions tab.
  workflow_dispatch:

# Required for GitHub Pages OIDC deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; cancel any in-flight build/deploy pair.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build
        working-directory: docs-site
        run: npm run build
        env:
          # Pass the Pages base URL so Docusaurus generates correct asset paths
          # when deployed to a subpath (e.g. org.github.io/hearth/).
          # configure-pages sets ACTIONS_STEP_SUMMARY; we read it via the action output.
          NODE_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
