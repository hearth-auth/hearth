name: loadtest-smoke

# PR gate that proves the load-test harness is alive (HEA-1991).
#
# A typecheck-only `loadtest-check` cannot catch runtime failures like
# "no live tokens" (the root cause of HEA-1989 S3). This job runs a real
# end-to-end smoke — build, seed, 15 s of Goose — on every PR that touches
# the loadtest crate or the server source it exercises.
#
# Scale is kept deliberately small (corpus=500 users, USERS=20, 15 s) so the
# job completes in under 5 minutes on a standard GitHub runner.

# FOLDED INTO ci.yml (production-readiness task 26.29, audit
# reports/subsystem-audit-fuzz-loadtest-2026-09-21.md L-1).
#
# `required-summary` in ci.yml is the ONLY required context on main
# (scripts/check-branch-protection.sh asserts exactly that), and GitHub cannot
# express `needs:` across workflows. While this workflow ran on its own
# `pull_request:` trigger it reported a check no ruleset required — so however
# red it went, it could not fail a merge. That mattered little while `run_load`
# ended in a bare `Ok(())` and the job could not go red at all; now that the
# harness returns a real exit code, the gate has to be able to block.
#
# The pull_request entry point is therefore ci.yml's `loadtest-smoke` job, which
# calls this file via `workflow_call` and is listed in `required-summary`'s
# `needs:` AND in its results loop. `scripts/check-required-summary-coverage.sh`
# holds all of that shut. The push trigger stays: ci.yml has no equivalent for
# the post-merge run on main.
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'loadtest/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  # Literal prefix, not ${{ github.workflow }}: when ci.yml calls this workflow,
  # github.workflow is "CI", and a shared group would cancel ci.yml's own run.
  group: loadtest-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  loadtest-smoke:
    name: loadtest-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          # `make loadtest-check` runs clippy as of task 26.32.
          components: clippy

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-loadtest-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-loadtest-smoke-

      - name: Install protoc
        run: |
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: nextest

      # Clippy is part of this target as of task 26.32: the crate is excluded
      # from the workspace, so nothing else in the repository lints it.
      - name: loadtest-check (typecheck + clippy + unit tests)
        run: make loadtest-check
        env:
          PROTOC: protoc

      - name: loadtest-smoke (end-to-end, small corpus)
        run: make loadtest-smoke
        env:
          PROTOC: protoc
