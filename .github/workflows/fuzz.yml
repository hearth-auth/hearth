name: Fuzz

# Smoke-runs all fuzz targets against their seed corpora on every PR and
# push to main. Each target runs for 1 000 iterations — enough to confirm
# the target compiles, the seed corpus parses cleanly, and no immediate
# panic is lurking. Extended / sustained fuzzing runs are out of scope here
# and should be driven by a separate scheduled workflow or OSS-Fuzz.

on:
  pull_request:
    branches: [main]
    # HEA-680: tighten triggers — fuzz smoke only matters when fuzz targets,
    # source code under fuzz, or the dependency graph change. Doc-only,
    # template-only, or SDK-only PRs no longer pay for 10 parallel fuzz legs.
    paths:
      - "fuzz/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/_setup-rust.yml"
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/_setup-rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    # 30 min headroom: a cold leg is a full ASAN release rebuild of the hearth
    # crate plus `cargo install cargo-fuzz`. On a warm Swatinem cache the build
    # is ~13 min; on a cold cache (every leg until one succeeds and saves it) it
    # is longer, and the swap-backed ASAN codegen peak (see the swap step) is
    # slower still. Once a leg succeeds the cache warms and legs finish quickly.
    timeout-minutes: 30

    # HEA-1867: the ASAN release build OOMs the runner. Swap alone did not fix it
    # — a 14 GB swapfile only converted the fast OOM-kill into a slow thrash that
    # starved the runner agent's heartbeat, so GitHub reclaimed the VM (exit 143,
    # "runner received a shutdown signal") ~5 min into a frozen codegen unit. The
    # durable fix is to keep the peak *inside* the 16 GB RAM instead of leaning on
    # swap: cap concurrent rustc/LLVM jobs and drop the release opt-level. A fuzz
    # smoke only needs the target to compile, parse its seeds, and not panic in
    # 1 000 runs — it does not need -O3 codegen. opt-level=1 slashes the LLVM peak
    # and build time; ASAN instrumentation is unaffected. Once a leg finally
    # succeeds the Swatinem cache saves and later legs warm up (previously the
    # cache never saved because every build died first).
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"

    strategy:
      fail-fast: false
      matrix:
        target:
          - config_parse
          - jwt_parse
          - wal_entry_deserialize
          - credential_verify
          - oidc_request_parse
          - webauthn_cbor_parse
          - federation_claims
          - saml_xml_parse
          - token_exchange_parse
          - redirect_uri_parse
          - aat_parse

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # HEA-1867: secondary backstop only. The primary OOM fix is the job-level
      # env above (capped build jobs + opt-level=1) which keeps the ASAN codegen
      # peak inside RAM. This swapfile absorbs any residual spike from a single
      # heavy codegen unit (e.g. opentelemetry-semantic-conventions) without
      # thrashing hard enough to starve the runner agent. Do NOT rely on it as the
      # fix — a large swapfile alone thrashes the runner to death (exit 143).
      - name: Add swap headroom for the ASAN release build
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 14G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Setup Rust nightly + protoc (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          # cargo-fuzz only needs the compiler — skip clippy/rustfmt to save time.
          components: ""
          cache-workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz smoke — ${{ matrix.target }} (1 000 runs)
        # fuzz/seeds/<target>/ holds hand-crafted seed inputs committed to the
        # repo. fuzz/corpus/ (gitignored) is where libFuzzer accumulates
        # discovered inputs during extended runs. CI uses seeds only.
        run: |
          SEEDS="fuzz/seeds/${{ matrix.target }}"
          if [ -d "$SEEDS" ]; then
            cargo fuzz run ${{ matrix.target }} "$SEEDS" -- -runs=1000
          else
            cargo fuzz run ${{ matrix.target }} -- -runs=1000
          fi
