name: Fuzz

# Smoke-runs all fuzz targets against their seed corpora on every PR and
# push to main. Each target runs for 1 000 iterations — enough to confirm
# the target compiles, the seed corpus parses cleanly, and no immediate
# panic is lurking. Extended / sustained fuzzing runs are out of scope here
# and should be driven by a separate scheduled workflow or OSS-Fuzz.

on:
  pull_request:
    branches: [main]
    # HEA-680: tighten triggers — fuzz smoke only matters when fuzz targets,
    # source code under fuzz, or the dependency graph change. Doc-only,
    # template-only, or SDK-only PRs no longer pay for 10 parallel fuzz legs.
    paths:
      - "fuzz/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/_setup-rust.yml"
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/_setup-rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # HEA-2019 CONTROL EXPERIMENT — temporary branch, do not merge.
    # Re-runs main's *unchanged* tree (43190f5e, last green on 2026-07-30) on
    # today's runners to determine whether the Fuzz smoke breakage on PR #270 is
    # a regression from that PR or environment drift. Matrix cut to one target.
    strategy:
      fail-fast: false
      matrix:
        target:
          - aat_parse

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust nightly + protoc (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly-2026-07-29
          # cargo-fuzz only needs the compiler — skip clippy/rustfmt to save time.
          components: ""
          cache-workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz smoke — ${{ matrix.target }} (1 000 runs)
        # fuzz/seeds/<target>/ holds hand-crafted seed inputs committed to the
        # repo. fuzz/corpus/ (gitignored) is where libFuzzer accumulates
        # discovered inputs during extended runs. CI uses seeds only.
        run: |
          # HEA-2019 telemetry: sample memory/disk alongside the build so an
          # exit-143 runner kill can be attributed to RAM vs disk vs neither.
          echo "=== baseline ==="; free -m; df -h /; nproc
          ( while true; do
              echo "[watchdog $(date -u +%H:%M:%S)]" \
                   "mem_avail_mb=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)" \
                   "swap_free_mb=$(awk '/SwapFree/{print int($2/1024)}' /proc/meminfo)" \
                   "root_avail=$(df -BM --output=avail / | tail -1 | tr -d ' ')" \
                   "peak_rss_mb=$(ps -eo rss --sort=-rss --no-headers | head -1 | awk '{print int($1/1024)}')"
              sleep 10
            done ) &
          WATCHDOG=$!
          trap 'kill "$WATCHDOG" 2>/dev/null || true' EXIT

          SEEDS="fuzz/seeds/${{ matrix.target }}"
          if [ -d "$SEEDS" ]; then
            cargo fuzz run ${{ matrix.target }} "$SEEDS" -- -runs=1000
          else
            cargo fuzz run ${{ matrix.target }} -- -runs=1000
          fi
