name: Fuzz

# Smoke-runs all fuzz targets against their seed corpora on every PR and
# push to main. Each target runs for 1 000 iterations — enough to confirm
# the target compiles, the seed corpus parses cleanly, and no immediate
# panic is lurking. Extended / sustained fuzzing runs are out of scope here
# and should be driven by a separate scheduled workflow or OSS-Fuzz.

on:
  pull_request:
    branches: [main]
    # HEA-680: tighten triggers — fuzz smoke only matters when fuzz targets,
    # source code under fuzz, or the dependency graph change. Doc-only,
    # template-only, or SDK-only PRs no longer pay for 10 parallel fuzz legs.
    paths:
      - "fuzz/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/_setup-rust.yml"
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/_setup-rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        target:
          - config_parse
          - jwt_parse
          - wal_entry_deserialize
          - credential_verify
          - oidc_request_parse
          - webauthn_cbor_parse
          - federation_claims
          - saml_xml_parse
          - token_exchange_parse
          - redirect_uri_parse
          - aat_parse

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust nightly + protoc (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          # HEA-2019: pinned, not floating `nightly`. This is the only workflow
          # in the repo on the nightly channel (cargo-fuzz requires it), so it is
          # the only one exposed to nightly drift. A nightly published between
          # 2026-07-29 and 2026-08-02 regressed rustc's memory use under
          # ASAN + sancov: one rustc reached 15.1 GB on a 15,989 MB runner and
          # every leg died with exit 143 ("runner has received a shutdown
          # signal"). Proven by control experiment (PR #271): main's *unchanged*
          # last-green tree failed on floating nightly and passed on this pin,
          # with no other change.
          #
          # Bump deliberately (verify a candidate on a control branch first);
          # do not restore floating `nightly` without one.
          toolchain: nightly-2026-07-29
          # cargo-fuzz only needs the compiler — skip clippy/rustfmt to save time.
          components: ""
          cache-workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz smoke — ${{ matrix.target }} (1 000 runs)
        # fuzz/seeds/<target>/ holds hand-crafted seed inputs committed to the
        # repo. fuzz/corpus/ (gitignored) is where libFuzzer accumulates
        # discovered inputs during extended runs. CI uses seeds only.
        run: |
          SEEDS="fuzz/seeds/${{ matrix.target }}"
          if [ -d "$SEEDS" ]; then
            cargo fuzz run ${{ matrix.target }} "$SEEDS" -- -runs=1000
          else
            cargo fuzz run ${{ matrix.target }} -- -runs=1000
          fi
