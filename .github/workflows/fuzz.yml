name: Fuzz

# Smoke-runs all fuzz targets against their seed corpora on every PR and
# push to main. Each target runs for 1 000 iterations — enough to confirm
# the target compiles, the seed corpus parses cleanly, and no immediate
# panic is lurking. Extended / sustained fuzzing runs are out of scope here
# and should be driven by a separate scheduled workflow or OSS-Fuzz.

on:
  pull_request:
    branches: [main]
    # HEA-680: tighten triggers — fuzz smoke only matters when fuzz targets,
    # source code under fuzz, or the dependency graph change. Doc-only,
    # template-only, or SDK-only PRs no longer pay for 10 parallel fuzz legs.
    paths:
      - "fuzz/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/_setup-rust.yml"
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/_setup-rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    # 20 min headroom: a cold leg is a `--dev` (opt-level 0, no LTO) build of the
    # fuzz target plus `cargo install cargo-fuzz`. The dev build is fast and its
    # LLVM link peak is small; once a leg succeeds the Swatinem cache warms and
    # later legs finish quickly.
    timeout-minutes: 20

    # HEA-2020: the ASAN *release* + thin-LTO build of the fuzz targets drove the
    # LLVM link memory peak over the 16 GB runner and OOM/VM-reclaimed mid-codegen
    # (exit 143). The prior HEA-1867 mitigations (14 GB swapfile + opt-level caps)
    # made it worse. The durable fix is to build the smoke `--dev` (opt-level 0,
    # high codegen-units, no LTO) which collapses the link peak; ASAN is still
    # applied via cargo-fuzz's injected RUSTFLAGS, so coverage is unchanged. A fuzz
    # smoke only needs the target to compile, parse its seeds, and not panic in
    # 1 000 runs — it does not need -O3 codegen. CARGO_BUILD_JOBS: "2" is kept as a
    # cheap safety margin against a residual spike.
    env:
      CARGO_BUILD_JOBS: "2"

    strategy:
      fail-fast: false
      matrix:
        target:
          - config_parse
          - jwt_parse
          - wal_entry_deserialize
          - credential_verify
          - oidc_request_parse
          - webauthn_cbor_parse
          - federation_claims
          - saml_xml_parse
          - token_exchange_parse
          - redirect_uri_parse
          - aat_parse

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust nightly + protoc (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          # cargo-fuzz only needs the compiler — skip clippy/rustfmt to save time.
          components: ""
          cache-workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz smoke — ${{ matrix.target }} (1 000 runs)
        # fuzz/seeds/<target>/ holds hand-crafted seed inputs committed to the
        # repo. fuzz/corpus/ (gitignored) is where libFuzzer accumulates
        # discovered inputs during extended runs. CI uses seeds only.
        run: |
          # HEA-2020: --dev builds the target in the dev profile (opt-level 0,
          # high codegen-units, no LTO) which collapses the LLVM link memory
          # peak that OOM-killed the release+thin-LTO build. ASAN is still
          # injected by cargo-fuzz's RUSTFLAGS, so smoke coverage is unchanged.
          SEEDS="fuzz/seeds/${{ matrix.target }}"
          if [ -d "$SEEDS" ]; then
            cargo fuzz run --dev ${{ matrix.target }} "$SEEDS" -- -runs=1000
          else
            cargo fuzz run --dev ${{ matrix.target }} -- -runs=1000
          fi
