name: OSV-Scanner Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=sdks/rust/Cargo.lock
            --lockfile=sdks/go/go.sum
            --lockfile=sdks/node/package-lock.json
            --lockfile=sdks/typescript/package-lock.json
            --lockfile=sdks/python/pyproject.toml
            --lockfile=sdks/kotlin/build.gradle.kts
            --format=sarif
            --output=osv.sarif

      - name: Upload OSV SARIF to GitHub Code Scanning
        if: always() && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@28deaeda66b76a05916b6923827895f2b14ab387 # v3.28.16
        with:
          sarif_file: osv.sarif
