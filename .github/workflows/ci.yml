name: CI

# Quality gate for every PR into main and every push to main (HEA-680).
#
# Architecture (post-HEA-680 mega-consolidation):
#
#   filter ─┬─> quality       (Rust changes)
#           ├─> ui            (UI changes — replaces ui-tests + ui-tests-exploratory)
#           ├─> sdk-node      (sdks/node changes — folded from node-sdk-ci.yml)
#           └─> sdk-conformance (any SDK / spec / script change — folded from sdk-conformance.yml)
#
# Downstream jobs gate on the `filter` job's outputs so doc-only PRs run
# only the filter job, while broad changes still run the full matrix.
# On pushes to main and scheduled runs we bypass the filter and always run.
#
# This workflow is the prerequisite gate for Dependabot auto-merge
# (see HEA-275 / .github/workflows/dependabot-automerge.yml).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs to save minutes, but always finish runs
  # on main so we never leave a "last-known-good" gap on the trunk.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Path-based change detection (HEA-680 paths-filter foundation) ────────────
  #
  # All downstream jobs are gated on this job's outputs. The filter job itself
  # runs on every event (including doc-only PRs) so we always have explicit
  # routing information in the workflow summary.

  filter:
    name: filter (paths-filter)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      sdks-node: ${{ steps.filter.outputs.sdks-node }}
      sdks-any: ${{ steps.filter.outputs.sdks-any }}
      proto: ${{ steps.filter.outputs.proto }}
      fuzz-targets: ${{ steps.filter.outputs.fuzz-targets }}
      bench-targets: ${{ steps.filter.outputs.bench-targets }}
      docs-only: ${{ steps.filter.outputs.docs-only }}
      abuse-coverage: ${{ steps.filter.outputs.abuse-coverage }}
      ldap: ${{ steps.filter.outputs.ldap }}
      deny: ${{ steps.filter.outputs.deny }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # paths-filter on push events needs full history to diff against
          # the previous SHA. On PRs it diffs the merge base, which only
          # needs a shallow clone, but full history is harmless and keeps
          # behaviour symmetric.
          fetch-depth: 0
          persist-credentials: false

      - name: Compute changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          # `predicate-quantifier: every` is the default — a filter matches
          # if any one of its patterns matches a changed file.
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'simulation/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'about.toml'
              - 'NOTICE'
              - 'THIRD_PARTY_LICENSES'
              - 'THIRD_PARTY_LICENSES.sha256'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'proto/**'
              - 'docs/api/**'
              - 'scripts/merge_openapi.py'
              - 'templates/**'
              - 'ui/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust/**'
              - '.github/workflows/_setup-rust.yml'
            ui:
              - 'templates/**'
              - 'ui/**'
              - 'src/protocol/web/**'
              - 'tests/ui/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            sdks-node:
              - 'sdks/node/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            sdks-any:
              - 'sdks/**'
              - 'scripts/check-sdk-conformance.sh'
              - 'docs/specs/SDK.md'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
            fuzz-targets:
              - 'fuzz/**'
              - 'src/**'
              - 'Cargo.lock'
            bench-targets:
              - 'src/storage/**'
              - 'benches/**'
              - 'Cargo.lock'
            docs-only:
              - 'docs/**'
              - '**.md'
              - 'CHANGELOG.md'
            abuse-coverage:
              - 'docs/plans/HEA-1114-abuse-prevention.md'
              - 'tests/abuse_*.rs'
              - 'scripts/check-abuse-coverage.sh'
              - '.github/workflows/ci.yml'
            ldap:
              - 'src/identity/ldap/**'
              - 'tests/ldap_*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            deny:
              - 'deny.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

      - name: Summarize filter results
        run: |
          {
            echo "## CI filter results"
            echo ""
            echo "| filter | matched |"
            echo "| --- | --- |"
            echo "| rust | ${{ steps.filter.outputs.rust }} |"
            echo "| ui | ${{ steps.filter.outputs.ui }} |"
            echo "| sdks-node | ${{ steps.filter.outputs.sdks-node }} |"
            echo "| sdks-any | ${{ steps.filter.outputs.sdks-any }} |"
            echo "| proto | ${{ steps.filter.outputs.proto }} |"
            echo "| fuzz-targets | ${{ steps.filter.outputs.fuzz-targets }} |"
            echo "| bench-targets | ${{ steps.filter.outputs.bench-targets }} |"
            echo "| docs-only | ${{ steps.filter.outputs.docs-only }} |"
            echo "| abuse-coverage | ${{ steps.filter.outputs.abuse-coverage }} |"
            echo "| ldap | ${{ steps.filter.outputs.ldap }} |"
            echo "| deny | ${{ steps.filter.outputs.deny }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # HEA-858: static guard against committing real secret material.
      # Runs on every PR (including doc-only) because a secret can leak via any
      # tracked file type, and the scan completes in well under a second.
      - name: Secret hygiene (fingerprint_hmac_secret literals)
        run: bash scripts/check-secret-hygiene.sh

      # HEA-1657: prevent recurrence of the cross-realm BOLA class (HEA-1629).
      # Fails on `let _auth`, `let _ = extract_admin_auth(...)`, or any unbound
      # auth call in src/protocol/http/admin.rs and src/protocol/grpc/*.rs.
      # Runs on every PR — pure grep, no Rust build required.
      - name: Auth-discard lint (check-auth-discard.sh)
        run: bash scripts/check-auth-discard.sh

  # ── Rust quality gate ────────────────────────────────────────────────────────

  quality:
    name: quality (clippy + fmt + nextest + css/proto check)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` so a filter-job
    # failure causes downstream jobs to FAIL (not silently SKIP). Without the
    # guard, `needs.filter.outputs.rust` evaluates to '' on filter failure,
    # `'' == 'true'` is false, and branch protection treats `skipped` as
    # passing — allowing a PR to merge with zero quality checks run.
    if: (needs.filter.result == 'success' && needs.filter.outputs.rust == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # proto-check / proto-breaking compare against main via the local
          # .git refs; need full history (not the default shallow checkout)
          # so the comparison works for PR branches.
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space (Rust debug builds need ~12 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup Rust toolchain + buf + tailwind (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy,rustfmt
          install-buf: "true"
          install-tailwind: "true"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-deny

      - name: Install cargo-audit
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-audit

      # HEA-779: enforce deny.toml policy (advisories + licenses + bans + sources).
      # Runs before the longer make targets so a policy violation fails fast
      # without burning a full clippy + nextest cycle.
      - name: Dependency policy (cargo deny check)
        run: cargo deny check

      # HEA-1370: cargo-audit complements cargo-deny with the RustSec advisory
      # database. --deny warnings promotes unmaintained/unsound advisories to
      # hard failures; .cargo/audit.toml carries the sim-only bincode exception.
      - name: Security audit (cargo audit --deny warnings)
        run: cargo audit --deny warnings

      - name: make test-quality (block false-confidence test patterns — HEA-571)
        run: make test-quality

      - name: make check (clippy -D warnings + fmt --check + nextest --workspace)
        run: make check

      - name: make css-check (rebuild Tailwind and fail if app.css drifts)
        run: make css-check

      - name: make proto-check (regenerate SDKs and fail if generated code drifts)
        run: make proto-check

      - name: Install PyYAML (needed by make openapi-check)
        # Use the distro package manager instead of an unpinned pip install —
        # `apt-get install` is not flagged by Scorecard pinned-dependencies check.
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y --no-install-recommends python3-yaml

      - name: make openapi-check (regenerate and fail if openapi.json drifts — HEA-972)
        run: make openapi-check

      # HEA-1268: THIRD_PARTY_LICENSES staleness gate.
      # Checks that THIRD_PARTY_LICENSES.sha256 still matches Cargo.lock — does
      # not regenerate the file, just compares the stored hash. Re-run
      # `make notice` whenever Cargo.lock changes and commit the updated file.
      - name: make notice-check (fail if THIRD_PARTY_LICENSES is stale — HEA-1268)
        run: make notice-check

  # ── UI tests — merged smoke/regression/accessibility + exploratory ──────────
  #
  # Previously two separate jobs (ci.ui-tests + ci.ui-tests-exploratory), each
  # paying for its own checkout + build + dev-server startup. Now: one setup,
  # two sequential pw-run.sh invocations sharing the running dev server. Only
  # the exploratory step is non-blocking (continue-on-error: true).

  ui:
    name: ui (Playwright — smoke + regression + accessibility + exploratory)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` — see `quality` above.
    if: (needs.filter.result == 'success' && needs.filter.outputs.ui == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain + tailwind (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          install-tailwind: "true"

      - name: Build Hearth binary (debug)
        run: PROTOC=protoc make build

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install UI test dependencies
        run: cd tests/ui && npm ci

      - name: Install Playwright browsers
        run: cd tests/ui && npx playwright install chromium --with-deps

      - name: Wipe dev data (clean slate)
        run: make dev-reset

      - name: Start Hearth dev server
        run: HEARTH_DEV_DATA_DIR=./data/dev ./target/debug/hearth serve --dev &

      - name: Wait for server to be ready
        run: cd tests/ui && npx wait-on http://127.0.0.1:8420/health --timeout 60000

      - name: Run smoke + regression + components + accessibility (blocking)
        run: bash tests/ui/pw-run.sh test --project=smoke --project=regression --project=components --project=destructive --project=accessibility

      - name: Run exploratory deep crawl (non-blocking)
        continue-on-error: true
        run: bash tests/ui/pw-run.sh test --project=exploratory || true

      - name: Generate coverage gaps report
        if: always()
        run: make ui-coverage-check

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            tests/ui/reports/html/
            tests/ui/reports/playwright-output/
            tests/ui/reports/axe-*.json
          retention-days: 7

      - name: Upload coverage gaps + exploratory crawl artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-extras
          path: |
            tests/ui/reports/coverage-gaps.txt
            tests/ui/reports/deep-crawl-manifest.json
            tests/ui/reports/deep-crawl-gaps.txt
            tests/ui/reports/screenshots-deep/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summarize coverage + exploratory gaps in CI log
        if: always()
        run: |
          GAP_FILE=tests/ui/reports/coverage-gaps.txt
          DEEP_GAP_FILE=tests/ui/reports/deep-crawl-gaps.txt
          if [ -f "$GAP_FILE" ]; then
            {
              echo "## UI Coverage Gaps"
              echo '```'
              cat "$GAP_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "coverage-gaps.txt not found — run make ui-coverage-check" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$DEEP_GAP_FILE" ]; then
            {
              echo "## Deep Crawl Gaps"
              echo '```'
              cat "$DEEP_GAP_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Node SDK matrix (folded from node-sdk-ci.yml) ────────────────────────────

  sdk-node:
    name: sdk-node (${{ matrix.node-version }}.x)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` — see `quality` above.
    if: (needs.filter.result == 'success' && needs.filter.outputs.sdks-node == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/node

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: sdks/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage (>=80% line gate)
        run: npm test

      - name: Upload coverage report
        if: matrix.node-version == '20'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-sdk-coverage
          path: sdks/node/coverage/
          retention-days: 7

  # ── SDK spec conformance (folded from sdk-conformance.yml) ───────────────────

  sdk-conformance:
    name: sdk-conformance (docs/specs/SDK.md)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` — see `quality` above.
    if: (needs.filter.result == 'success' && needs.filter.outputs.sdks-any == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check SDK conformance (spec sections 2,4,5,8,10)
        run: bash scripts/check-sdk-conformance.sh

  # ── §3.41 adversarial test-quality gate (HEA-1214) ─────────────────────────
  #
  # Verifies every A-N row in docs/plans/HEA-1114-abuse-prevention.md has at
  # least one adversarial test in tests/abuse_*.rs. Grep-only — no Rust build.
  # Runs on every PR that touches the plan doc, abuse tests, the gate script,
  # or this workflow file. Always runs on main and scheduled events.
  #
  # Rollback: add SKIP_ABUSE_COVERAGE_CHECK: '1' to the job env below and
  # document the reason in the PR. Remove it once coverage is restored.

  abuse-coverage:
    name: abuse-coverage (§3.41 adversarial test gate)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` — see `quality` above.
    if: (needs.filter.result == 'success' && needs.filter.outputs.abuse-coverage == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: §3.41 gate — every A-N row must have an adversarial test
        # To bypass temporarily: set SKIP_ABUSE_COVERAGE_CHECK: '1' in the env
        # block above. Document the reason and the tracking issue in the PR.
        run: bash scripts/check-abuse-coverage.sh

  # ── LDAP / Active Directory integration tests (HEA-1331) ────────────────────
  #
  # Spins up bitnamilegacy/openldap (Bitnami's legacy namespace, same env-var
  # schema as the retired bitnami/openldap) with LDAPS enabled. LDAP integration
  # tests must be marked #[ignore] in source so the `quality` job skips them
  # when no LDAP server is present. This job runs them via --run-ignored against
  # the real service container.
  #
  # Service credentials are test-only — the OpenLDAP container is ephemeral
  # with no real user data.
  #
  # Image pinned by manifest-list digest (HEA-1331 resolved).

  ldap-integration:
    name: ldap-integration (OpenLDAP — HEA-1331)
    needs: filter
    if: (needs.filter.result == 'success' && needs.filter.outputs.ldap == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No services: block — OpenLDAP is started in a step so we can mount
    # ephemeral TLS certificates. bitnami/openldap 2.6.10+ removed auto-cert
    # generation; explicit certs are required for LDAP_ENABLE_TLS=yes.

    env:
      # Consumed by LDAP integration tests (see tests/ldap_*.rs).
      HEARTH_TEST_LDAP_URL: ldap://localhost:1389
      HEARTH_TEST_LDAPS_URL: ldaps://localhost:1636
      HEARTH_TEST_LDAP_BIND_DN: cn=admin,dc=hearth,dc=test
      HEARTH_TEST_LDAP_BIND_PASSWORD: HearthLdapCI1!
      HEARTH_TEST_LDAP_BASE_DN: dc=hearth,dc=test
      HEARTH_TEST_LDAP_USER: hearthldaptest
      HEARTH_TEST_LDAP_USER_PASSWORD: HearthLdapUser1!

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h

      - name: Generate TLS certs and start OpenLDAP (HEA-1382/HEA-1385)
        run: |
          # bitnami/openldap 2.6.10+ requires explicit TLS certs. Generate a
          # proper 2-tier PKI: CA cert (CA:TRUE) + server end-entity cert
          # (CA:FALSE). Rustls rejects CA-flagged certs as server certs
          # (CaUsedAsEndEntity), so the server cert must NOT have CA:TRUE.
          mkdir -p /tmp/ldap-tls

          # 1. Generate CA key + self-signed CA cert
          openssl genrsa -out /tmp/ldap-tls/ca.key 2048
          openssl req -x509 -new -nodes -key /tmp/ldap-tls/ca.key \
            -sha256 -days 1 -out /tmp/ldap-tls/ca.crt \
            -subj "/CN=hearth-ldap-ci-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"

          # 2. Generate server key + CSR
          openssl genrsa -out /tmp/ldap-tls/server.key 2048
          openssl req -new -key /tmp/ldap-tls/server.key \
            -out /tmp/ldap-tls/server.csr \
            -subj "/CN=localhost"

          # 3. Sign server cert with CA — end-entity (CA:FALSE), SAN required by rustls
          openssl x509 -req \
            -in /tmp/ldap-tls/server.csr \
            -CA /tmp/ldap-tls/ca.crt -CAkey /tmp/ldap-tls/ca.key -CAcreateserial \
            -out /tmp/ldap-tls/server.crt -days 1 -sha256 \
            -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=critical,CA:FALSE\n")

          chmod 644 /tmp/ldap-tls/*.crt /tmp/ldap-tls/*.key

          # Trust the CA so rustls-native-certs (used by ldap3 tls-rustls-ring)
          # accepts the LDAPS connection in ldaps_connection_succeeds test.
          sudo cp /tmp/ldap-tls/ca.crt /usr/local/share/ca-certificates/hearth-ldap-ci.crt
          sudo update-ca-certificates

          # Start OpenLDAP with certs mounted; digest-pinned image (HEA-1382)
          docker run -d --name openldap \
            -p 1389:1389 -p 1636:1636 \
            -e LDAP_ADMIN_USERNAME=admin \
            -e LDAP_ADMIN_PASSWORD=HearthLdapCI1! \
            -e LDAP_ROOT=dc=hearth,dc=test \
            -e LDAP_ENABLE_TLS=yes \
            -e LDAP_TLS_VERIFY_CLIENT=never \
            -e LDAP_USERS=hearthldaptest \
            -e LDAP_PASSWORDS=HearthLdapUser1! \
            -e LDAP_TLS_CERT_FILE=/tls/server.crt \
            -e LDAP_TLS_KEY_FILE=/tls/server.key \
            -e LDAP_TLS_CA_FILE=/tls/ca.crt \
            -v /tmp/ldap-tls:/tls:ro \
            bitnamilegacy/openldap:2.6.10-debian-12-r4@sha256:966fd39ed25813890e9bd57dac56def163bbcfe64967e0bae59ab018d505bd93

      - name: Setup Rust toolchain (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-nextest

      - name: Install ldap-utils (runner-side ldapsearch for readiness probe)
        run: sudo apt-get install -y --no-install-recommends ldap-utils

      - name: Wait for OpenLDAP to be ready
        run: |
          # Wait for LDAP port AND user seeding: bitnami seeds LDAP_USERS
          # asynchronously after the port comes up, so we must verify at least
          # one inetOrgPerson entry exists before running tests.
          for i in $(seq 1 40); do
            USER_COUNT=$(ldapsearch -x -H ldap://localhost:1389 \
              -b dc=hearth,dc=test \
              -D cn=admin,dc=hearth,dc=test \
              -w HearthLdapCI1! \
              "(objectClass=inetOrgPerson)" 2>/dev/null | grep -c "^dn:" || true)
            if [ "${USER_COUNT:-0}" -gt 0 ]; then
              echo "OpenLDAP ready with ${USER_COUNT} user(s) (attempt $i)"
              break
            fi
            echo "Waiting for OpenLDAP users... (attempt $i/40, currently ${USER_COUNT:-0} users)"
            sleep 3
          done

      - name: Run LDAP integration tests (run-ignored against real server)
        run: |
          cargo nextest run --workspace \
            --run-ignored all \
            -E 'test(ldap)' \
            --no-fail-fast
        env:
          PROTOC: protoc

  # ── Raft cluster chaos validation (Gap C-1, HEA-1323) ───────────────────────
  #
  # Runs the full cluster simulation suite (AC-1 through AC-7) in a single
  # thread so election timeouts do not interfere with each other. Gated on the
  # `rust` filter because it only changes when src/**, simulation/**, or
  # Cargo.lock change — the same condition that rebuilds the simulation crate.
  #
  # Why a dedicated job (not just quality/make check):
  #   • Single-threaded execution (--test-threads=1) is required for timing-
  #     sensitive Raft election timeout tests (150–300 ms). Running them with
  #     the default parallelism inside the quality job can cause flaky timeouts.
  #   • Named CI badge: "cluster-chaos" is an explicit readiness gate that is
  #     clearly visible in PR check lists — satisfying Gap C-1 of the 1.0
  #     Readiness Audit.

  cluster-chaos:
    name: cluster-chaos (Raft AC-1 through AC-7)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` — see `quality` above.
    if: (needs.filter.result == 'success' && needs.filter.outputs.rust == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # AC-5–7 each have election windows (up to 10–15 s) and write loops.
    # 10 minutes is generous; typical runtime is ~90 s.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Free disk space (Rust debug builds need ~12 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-nextest

      - name: make cluster-smoke (Raft AC-1..AC-7 — single-threaded, ~90 s)
        run: PROTOC=protoc make cluster-smoke

      - name: Summarize cluster-chaos result
        if: always()
        run: |
          {
            echo "## Cluster Chaos Results (HEA-1323 Gap C-1)"
            echo ""
            echo "| Scenario | Test file |"
            echo "| --- | --- |"
            echo "| AC-1: network partition + convergence | cluster_failover.rs |"
            echo "| AC-2: leader kill + re-election | cluster_failover.rs |"
            echo "| AC-3: rolling restart, zero read errors | cluster_failover.rs |"
            echo "| AC-4: snapshot catch-up (cold follower) | cluster_failover.rs |"
            echo "| AC-5: leader kill mid-write-sequence | cluster_chaos.rs |"
            echo "| AC-6: WAL replay after node crash | cluster_chaos.rs |"
            echo "| AC-7: write contention, 2 leadership changes | cluster_chaos.rs |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Dependency advisory gate (HEA-1652) ─────────────────────────────────────
  #
  # Dedicated cargo-deny job so advisory/license/ban violations appear as their
  # own named CI check rather than being buried in the 30-minute quality job.
  #
  # Gated on the `deny` filter (deny.toml, Cargo.toml, Cargo.lock) so it only
  # runs when dependency state actually changes. Always runs on pushes to main
  # and schedule events (security.yml's weekly cron also fires cargo-deny, but
  # that workflow does not feed required-summary — this one does).
  #
  # No Rust build needed: cargo-deny reads Cargo.lock and deny.toml directly.
  # Runtime is ~30 s vs ~25 min for the full quality job.

  cargo-deny:
    name: cargo-deny (advisories + licenses + bans)
    needs: filter
    if: (needs.filter.result == 'success' && needs.filter.outputs.deny == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-deny

      - name: cargo deny check (advisories + licenses + bans)
        run: cargo deny check

  # ── Required-summary gate (HEA-693) ──────────────────────────────────────────
  #
  # Branch protection requires ONLY this job for the CI workflow. It always runs
  # and succeeds when every upstream job either passed or was legitimately skipped
  # (paths-filter determined no changes in scope). It fails if any upstream job
  # failed or was cancelled.
  #
  # Why: conditional matrix jobs (sdk-node) and conditional jobs (quality, ui,
  # sdk-conformance) only post individual check-run entries when they actually
  # execute. When paths-filter skips them, branch protection sees "Expected —
  # Waiting for status to be reported" for each individual check name forever.
  # A single always-running summary gate eliminates that gap: one required check
  # name, always reported, correctly aggregates pass/skip/fail (HEA-693).

  required-summary:
    name: required-summary
    if: always()
    needs: [filter, quality, ui, sdk-node, sdk-conformance, abuse-coverage, ldap-integration, cluster-chaos, cargo-deny]
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Check all jobs passed or were skipped
        env:
          FILTER: ${{ needs.filter.result }}
          QUALITY: ${{ needs.quality.result }}
          UI: ${{ needs.ui.result }}
          SDK_NODE: ${{ needs.sdk-node.result }}
          SDK_CONFORMANCE: ${{ needs.sdk-conformance.result }}
          ABUSE_COVERAGE: ${{ needs.abuse-coverage.result }}
          LDAP_INTEGRATION: ${{ needs.ldap-integration.result }}
          CLUSTER_CHAOS: ${{ needs.cluster-chaos.result }}
          CARGO_DENY: ${{ needs.cargo-deny.result }}
        run: |
          echo "filter=$FILTER quality=$QUALITY ui=$UI sdk-node=$SDK_NODE sdk-conformance=$SDK_CONFORMANCE abuse-coverage=$ABUSE_COVERAGE ldap-integration=$LDAP_INTEGRATION cluster-chaos=$CLUSTER_CHAOS cargo-deny=$CARGO_DENY"
          for result in "$FILTER" "$QUALITY" "$UI" "$SDK_NODE" "$SDK_CONFORMANCE" "$ABUSE_COVERAGE" "$LDAP_INTEGRATION" "$CLUSTER_CHAOS" "$CARGO_DENY"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job failed or was cancelled."
              exit 1
            fi
          done
          echo "All jobs passed or were legitimately skipped."
