name: CI

# Quality gate for every PR into main and every push to main (HEA-680).
#
# Architecture (post-HEA-680 mega-consolidation):
#
#   filter ─┬─> quality       (Rust changes)
#           ├─> ui            (UI changes — replaces ui-tests + ui-tests-exploratory)
#           ├─> sdk-node      (sdks/node changes — folded from node-sdk-ci.yml)
#           └─> sdk-conformance (any SDK / spec / script change — folded from sdk-conformance.yml)
#
# Downstream jobs gate on the `filter` job's outputs so doc-only PRs run
# only the filter job, while broad changes still run the full matrix.
# On pushes to main and scheduled runs we bypass the filter and always run.
#
# This workflow is the prerequisite gate for Dependabot auto-merge
# (see HEA-275 / .github/workflows/dependabot-automerge.yml).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs to save minutes, but always finish runs
  # on main so we never leave a "last-known-good" gap on the trunk.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Path-based change detection (HEA-680 paths-filter foundation) ────────────
  #
  # All downstream jobs are gated on this job's outputs. The filter job itself
  # runs on every event (including doc-only PRs) so we always have explicit
  # routing information in the workflow summary.

  filter:
    name: filter (paths-filter)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      sdks-node: ${{ steps.filter.outputs.sdks-node }}
      sdks-go: ${{ steps.filter.outputs.sdks-go }}
      sdks-python: ${{ steps.filter.outputs.sdks-python }}
      sdks-rust: ${{ steps.filter.outputs.sdks-rust }}
      sdks-php: ${{ steps.filter.outputs.sdks-php }}
      sdks-kotlin: ${{ steps.filter.outputs.sdks-kotlin }}
      sdks-typescript: ${{ steps.filter.outputs.sdks-typescript }}
      sdks-any: ${{ steps.filter.outputs.sdks-any }}
      proto: ${{ steps.filter.outputs.proto }}
      fuzz-targets: ${{ steps.filter.outputs.fuzz-targets }}
      bench-targets: ${{ steps.filter.outputs.bench-targets }}
      docs-only: ${{ steps.filter.outputs.docs-only }}
      abuse-coverage: ${{ steps.filter.outputs.abuse-coverage }}
      ldap: ${{ steps.filter.outputs.ldap }}
      deny: ${{ steps.filter.outputs.deny }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # paths-filter on push events needs full history to diff against
          # the previous SHA. On PRs it diffs the merge base, which only
          # needs a shallow clone, but full history is harmless and keeps
          # behaviour symmetric.
          fetch-depth: 0
          persist-credentials: false

      - name: Compute changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # `predicate-quantifier: every` is the default — a filter matches
          # if any one of its patterns matches a changed file.
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'simulation/**'
              - 'build.rs'
              # HEA-1862: a PR that only weakens the ROPC gate must still run it.
              - 'scripts/check-ropc-ban.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'about.toml'
              - 'NOTICE'
              - 'THIRD_PARTY_LICENSES'
              - 'THIRD_PARTY_LICENSES.sha256'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'proto/**'
              - 'docs/api/**'
              - 'scripts/merge_openapi.py'
              - 'templates/**'
              - 'ui/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust/**'
              - '.github/workflows/_setup-rust.yml'
            ui:
              - 'templates/**'
              - 'ui/**'
              - 'src/protocol/web/**'
              - 'tests/ui/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            sdks-node:
              - 'sdks/node/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            # HEA-2171: one filter per SDK so every SDK suite is testable in CI.
            # The integration suites (go, typescript) additionally trigger on
            # 'src/protocol/**' — they build the hearth server and exercise its
            # wire surface, so a protocol change that breaks the SDK contract
            # (exactly how the createRealm 405 shipped unnoticed) reruns them.
            sdks-go:
              - 'sdks/go/**'
              - 'proto/**'
              - 'src/protocol/**'
              - '.github/workflows/ci.yml'
            sdks-typescript:
              - 'sdks/typescript/**'
              - 'proto/**'
              - 'src/protocol/**'
              - '.github/workflows/ci.yml'
            sdks-python:
              - 'sdks/python/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            sdks-rust:
              - 'sdks/rust/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            sdks-php:
              - 'sdks/php/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            sdks-kotlin:
              - 'sdks/kotlin/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            sdks-any:
              - 'sdks/**'
              - 'scripts/check-sdk-conformance.sh'
              - 'docs/specs/SDK.md'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
            fuzz-targets:
              - 'fuzz/**'
              - 'src/**'
              - 'Cargo.lock'
            bench-targets:
              - 'src/storage/**'
              - 'benches/**'
              - 'Cargo.lock'
            docs-only:
              - 'docs/**'
              - '**.md'
              - 'CHANGELOG.md'
            abuse-coverage:
              - 'docs/plans/HEA-1114-abuse-prevention.md'
              - 'tests/abuse_*.rs'
              - 'scripts/check-abuse-coverage.sh'
              - '.github/workflows/ci.yml'
            ldap:
              - 'src/identity/ldap/**'
              - 'tests/ldap_*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            deny:
              - 'deny.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

      - name: Summarize filter results
        run: |
          {
            echo "## CI filter results"
            echo ""
            echo "| filter | matched |"
            echo "| --- | --- |"
            echo "| rust | ${{ steps.filter.outputs.rust }} |"
            echo "| ui | ${{ steps.filter.outputs.ui }} |"
            echo "| sdks-node | ${{ steps.filter.outputs.sdks-node }} |"
            echo "| sdks-any | ${{ steps.filter.outputs.sdks-any }} |"
            echo "| proto | ${{ steps.filter.outputs.proto }} |"
            echo "| fuzz-targets | ${{ steps.filter.outputs.fuzz-targets }} |"
            echo "| bench-targets | ${{ steps.filter.outputs.bench-targets }} |"
            echo "| docs-only | ${{ steps.filter.outputs.docs-only }} |"
            echo "| abuse-coverage | ${{ steps.filter.outputs.abuse-coverage }} |"
            echo "| ldap | ${{ steps.filter.outputs.ldap }} |"
            echo "| deny | ${{ steps.filter.outputs.deny }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # HEA-858: static guard against committing real secret material.
      # Runs on every PR (including doc-only) because a secret can leak via any
      # tracked file type, and the scan completes in well under a second.
      - name: Secret hygiene (fingerprint_hmac_secret literals)
        run: bash scripts/check-secret-hygiene.sh

      # HEA-1657: prevent recurrence of the cross-realm BOLA class (HEA-1629).
      # Fails on `let _auth`, `let _ = extract_admin_auth(...)`, or any unbound
      # auth call in src/protocol/http/admin.rs and src/protocol/grpc/*.rs.
      # Runs on every PR — pure grep, no Rust build required.
      - name: Auth-discard lint (check-auth-discard.sh)
        run: bash scripts/check-auth-discard.sh

      # HEA-1781: prevent recurrence of the RBAC decision-cache invalidation
      # bypass (HEA-1770 § febfe092, HEA-1777). Fails if any raw
      # self.storage.put/put_batch/delete/delete_batch appears in
      # src/rbac/engine.rs outside the invalidating write_* helpers.
      # Runs on every PR — pure grep, no Rust build required.
      - name: RBAC storage-write lint (check-rbac-storage-writes.sh)
        run: bash scripts/check-rbac-storage-writes.sh

      # HEA-2116: prevent a release from shipping with stale install-instruction
      # version references in README.md. Compares every pinned release URL / tag
      # against the latest published binary GitHub Release (HEA-2199: guard keys off
      # published artifacts, not git tags — a tag without a binary release must not
      # advance the pin requirement or it would publish 404 install docs).
      # GH_TOKEN is required so `gh release list` can authenticate; without it the
      # call fails and the script exits 1 — no silent skip (HEA-2203).
      - name: README version drift (check-readme-version.sh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-readme-version.sh

      # The guard above is itself the test artifact for HEA-2116, so it needs a
      # test proving it FAILS on a deliberately stale reference — otherwise an
      # `exit 0` stub would pass CI forever. Pure bash, no Rust build.
      - name: README version drift — guard self-test
        run: bash scripts/tests/check-readme-version.test.sh

      # Audit blockers B2 (§4.8#1) and B6 (§4.12#1): the container image, the
      # Helm chart and seven SDK releases published from a commit whose suite was
      # red, because only the binary channel was gated. The v1.6.11 image and
      # chart went out 37 minutes BEFORE the verdict said no. This guard fails
      # the build if any publish job stops waiting for that verdict.
      # Pure bash over .github/workflows — no Rust build required.
      - name: Publish gating (check-publish-gating.sh)
        run: bash scripts/check-publish-gating.sh

      # The guard is the deliverable for B2/B6, so it needs a test proving it
      # FAILS on an ungated publish job — otherwise an `exit 0` stub passes CI
      # forever, which is the same class of defect the audit found.
      - name: Publish gating — guard self-test
        run: bash scripts/tests/check-publish-gating.test.sh

      # The runtime half of the same fix: the wait itself. Its test proves it
      # refuses on a red verdict, an absent verdict, and an unreadable API.
      - name: Await-green-commit gate — self-test
        run: bash scripts/tests/await-green-commit.test.sh

      # Audit finding §4.8#3: the audited commit merged 41 minutes before its
      # one required context reported failure, via an always-on admin bypass on
      # the "Protect main" ruleset. This guard reads the live ruleset and fails
      # if the required-summary context is not required, changes can reach main
      # outside a PR, or ANY bypass actor exists. An unreadable API is a FAIL,
      # not a skip.
      - name: Branch protection (check-branch-protection.sh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-branch-protection.sh

      # The guard is the deliverable for §4.8#3, so it needs a test proving it
      # FAILS on the audited shape — the always-on bypass — otherwise an
      # `exit 0` stub passes CI forever.
      - name: Branch protection — guard self-test
        run: bash scripts/tests/check-branch-protection.test.sh

  # ── Rust quality gate ────────────────────────────────────────────────────────

  quality:
    name: quality (clippy + fmt + nextest + css/proto check)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` so a filter-job
    # failure causes downstream jobs to FAIL (not silently SKIP). Without the
    # guard, `needs.filter.outputs.rust` evaluates to '' on filter failure,
    # `'' == 'true'` is false, and branch protection treats `skipped` as
    # passing — allowing a PR to merge with zero quality checks run.
    if: (needs.filter.result == 'success' && needs.filter.outputs.rust == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # proto-check / proto-breaking compare against main via the local
          # .git refs; need full history (not the default shallow checkout)
          # so the comparison works for PR branches.
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space (Rust debug builds need ~12 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup Rust toolchain + buf + tailwind (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy,rustfmt
          install-buf: "true"
          install-tailwind: "true"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-nextest

      - name: Install cargo-audit
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-audit

      # HEA-1370: cargo-audit complements cargo-deny with the RustSec advisory
      # database. --deny warnings promotes unmaintained/unsound advisories to
      # hard failures; .cargo/audit.toml carries the sim-only bincode exception.
      # HEA-1714: continue-on-error so an advisory never masks nextest failures.
      # cargo-deny advisory/license/ban checks run in the dedicated cargo-deny job.
      - name: Security audit (cargo audit --deny warnings)
        continue-on-error: true
        run: cargo audit --deny warnings

      - name: make test-quality (block false-confidence test patterns — HEA-571)
        run: make test-quality

      # Asserts the ROPC (RFC 6749 §4.3) password grant stays unreachable, in both
      # the config allowlist and the HTTP token dispatch. HEA-1862: the two drifted
      # apart — config was clean while both token endpoints still served ROPC — so
      # this gate checks the dispatch arm, not just the allowlist.
      - name: make security-gate (assert ROPC password grant is unreachable — HEA-1862)
        run: make security-gate

      - name: make check (clippy -D warnings + fmt --check + nextest --workspace)
        run: make check

      - name: make css-check (rebuild Tailwind and fail if app.css drifts)
        run: make css-check

      - name: make proto-check (regenerate SDKs and fail if generated code drifts)
        run: make proto-check

      - name: Install PyYAML (needed by make openapi-check)
        # Use the distro package manager instead of an unpinned pip install —
        # `apt-get install` is not flagged by Scorecard pinned-dependencies check.
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y --no-install-recommends python3-yaml

      - name: make openapi-check (regenerate and fail if openapi.json drifts — HEA-972)
        run: make openapi-check

      # HEA-1268: THIRD_PARTY_LICENSES staleness gate.
      # Checks that THIRD_PARTY_LICENSES.sha256 still matches Cargo.lock — does
      # not regenerate the file, just compares the stored hash. Re-run
      # `make notice` whenever Cargo.lock changes and commit the updated file.
      - name: make notice-check (fail if THIRD_PARTY_LICENSES is stale — HEA-1268)
        run: make notice-check

  # ── UI tests — merged smoke/regression/accessibility + exploratory ──────────
  #
  # Previously two separate jobs (ci.ui-tests + ci.ui-tests-exploratory), each
  # paying for its own checkout + build + dev-server startup. Now: one setup,
  # two sequential pw-run.sh invocations sharing the running dev server. Only
  # the exploratory step is non-blocking (continue-on-error: true).

  ui:
    name: ui (Playwright — smoke + regression + accessibility + exploratory)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` — see `quality` above.
    if: (needs.filter.result == 'success' && needs.filter.outputs.ui == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain + tailwind (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          install-tailwind: "true"

      - name: Build Hearth binary (debug)
        run: PROTOC=protoc make build

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install UI test dependencies
        run: cd tests/ui && npm ci

      - name: Install Playwright browsers
        run: cd tests/ui && npx playwright install chromium --with-deps

      - name: Wipe dev data (clean slate)
        run: make dev-reset

      - name: Start Hearth dev server
        run: HEARTH_DEV_DATA_DIR=./data/dev ./target/debug/hearth serve --dev &

      - name: Wait for server to be ready
        run: cd tests/ui && npx wait-on http://127.0.0.1:8420/health --timeout 60000

      - name: Run smoke + regression + components + accessibility (blocking)
        run: bash tests/ui/pw-run.sh test --project=smoke --project=regression --project=components --project=destructive --project=accessibility

      - name: Run exploratory deep crawl (non-blocking)
        continue-on-error: true
        run: bash tests/ui/pw-run.sh test --project=exploratory || true

      - name: Generate coverage gaps report
        if: always()
        run: make ui-coverage-check

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            tests/ui/reports/html/
            tests/ui/reports/playwright-output/
            tests/ui/reports/axe-*.json
          retention-days: 7

      - name: Upload coverage gaps + exploratory crawl artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-extras
          path: |
            tests/ui/reports/coverage-gaps.txt
            tests/ui/reports/deep-crawl-manifest.json
            tests/ui/reports/deep-crawl-gaps.txt
            tests/ui/reports/screenshots-deep/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summarize coverage + exploratory gaps in CI log
        if: always()
        run: |
          GAP_FILE=tests/ui/reports/coverage-gaps.txt
          DEEP_GAP_FILE=tests/ui/reports/deep-crawl-gaps.txt
          if [ -f "$GAP_FILE" ]; then
            {
              echo "## UI Coverage Gaps"
              echo '```'
              cat "$GAP_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "coverage-gaps.txt not found — run make ui-coverage-check" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$DEEP_GAP_FILE" ]; then
            {
              echo "## Deep Crawl Gaps"
              echo '```'
              cat "$DEEP_GAP_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Node SDK matrix (folded from node-sdk-ci.yml) ────────────────────────────

  sdk-node:
    name: sdk-node (${{ matrix.node-version }}.x)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` — see `quality` above.
    if: (needs.filter.result == 'success' && needs.filter.outputs.sdks-node == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/node

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: sdks/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage (>=80% line gate)
        run: npm test

      - name: Upload coverage report
        if: matrix.node-version == '20'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-sdk-coverage
          path: sdks/node/coverage/
          retention-days: 7

  # ── SDK spec conformance (folded from sdk-conformance.yml) ───────────────────

  sdk-conformance:
    name: sdk-conformance (docs/specs/SDK.md)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` — see `quality` above.
    if: (needs.filter.result == 'success' && needs.filter.outputs.sdks-any == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check SDK conformance (spec sections 2,4,5,8,10)
        run: bash scripts/check-sdk-conformance.sh

  # ── Per-SDK test suites (HEA-2171) ───────────────────────────────────────────
  #
  # Before HEA-2171 only the Node SDK ran its tests in CI, so a `createRealm`
  # method the server 405s shipped in all seven SDKs and two integration suites
  # sat red at HEAD unnoticed. Every SDK now runs its own suite here.
  #
  # Gating: sdk-rust, sdk-python, and sdk-php are green and wired into the
  # required-summary gate. sdk-go and sdk-typescript run but are NOT gated yet —
  # their auth-code/refresh/jwks integration tests are red at HEAD for an
  # unrelated reason (registerClient returns 401 "missing authorization header").
  # sdk-kotlin runs but is not gated pending a first green CI run. Promotion of
  # these three into the required gate is tracked as a follow-up (see the issue).

  # Rust SDK — unit suite (client logic, no server). Gated.
  sdk-rust:
    name: sdk-rust
    needs: filter
    if: (needs.filter.result == 'success' && needs.filter.outputs.sdks-rust == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: cargo test
        working-directory: sdks/rust
        run: cargo test

  # Python SDK — unit suite (respx-mocked). Gated.
  sdk-python:
    name: sdk-python
    needs: filter
    if: (needs.filter.result == 'success' && needs.filter.outputs.sdks-python == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install with dev extras
        working-directory: sdks/python
        run: pip install -e '.[dev]'
      - name: pytest
        working-directory: sdks/python
        run: python -m pytest -q

  # PHP SDK — unit suite. Gated.
  sdk-php:
    name: sdk-php
    needs: filter
