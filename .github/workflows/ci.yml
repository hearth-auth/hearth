  # ── §3.41 adversarial test-quality gate (HEA-1214) ─────────────────────────
  #
  # Verifies every A-N row in docs/plans/HEA-1114-abuse-prevention.md has at
  # least one adversarial test in tests/abuse_*.rs. Grep-only — no Rust build.
  # Runs on every PR that touches the plan doc, abuse tests, the gate script,
  # or this workflow file. Always runs on main and scheduled events.
  #
  # Rollback: add SKIP_ABUSE_COVERAGE_CHECK: '1' to the job env below and
  # document the reason in the PR. Remove it once coverage is restored.

  abuse-coverage:
    name: abuse-coverage (§3.41 adversarial test gate)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` — see `quality` above.
    if: (needs.filter.result == 'success' && needs.filter.outputs.abuse-coverage == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: §3.41 gate — every A-N row must have an adversarial test
        # To bypass temporarily: set SKIP_ABUSE_COVERAGE_CHECK: '1' in the env
        # block above. Document the reason and the tracking issue in the PR.
        run: bash scripts/check-abuse-coverage.sh

  # ── LDAP / Active Directory integration tests (HEA-1331) ────────────────────
  #
  # Spins up bitnamilegacy/openldap (Bitnami's legacy namespace, same env-var
  # schema as the retired bitnami/openldap) with LDAPS enabled. LDAP integration
  # tests must be marked #[ignore] in source so the `quality` job skips them
  # when no LDAP server is present. This job runs them via --run-ignored against
  # the real service container.
  #
  # Service credentials are test-only — the OpenLDAP container is ephemeral
  # with no real user data.
  #
  # Image pinned by manifest-list digest (HEA-1331 resolved).

  ldap-integration:
    name: ldap-integration (OpenLDAP — HEA-1331)
    needs: filter
    if: (needs.filter.result == 'success' && needs.filter.outputs.ldap == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No services: block — OpenLDAP is started in a step so we can mount
    # ephemeral TLS certificates. bitnami/openldap 2.6.10+ removed auto-cert
    # generation; explicit certs are required for LDAP_ENABLE_TLS=yes.

    env:
      # Consumed by LDAP integration tests (see tests/ldap_*.rs).
      HEARTH_TEST_LDAP_URL: ldap://localhost:1389
      HEARTH_TEST_LDAPS_URL: ldaps://localhost:1636
      HEARTH_TEST_LDAP_BIND_DN: cn=admin,dc=hearth,dc=test
      HEARTH_TEST_LDAP_BIND_PASSWORD: HearthLdapCI1!
      HEARTH_TEST_LDAP_BASE_DN: dc=hearth,dc=test
      HEARTH_TEST_LDAP_USER: hearthldaptest
      HEARTH_TEST_LDAP_USER_PASSWORD: HearthLdapUser1!

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h

      - name: Generate TLS certs and start OpenLDAP (HEA-1382/HEA-1385)
        run: |
          # bitnami/openldap 2.6.10+ requires explicit TLS certs. Generate a
          # proper 2-tier PKI: CA cert (CA:TRUE) + server end-entity cert
          # (CA:FALSE). Rustls rejects CA-flagged certs as server certs
          # (CaUsedAsEndEntity), so the server cert must NOT have CA:TRUE.
          mkdir -p /tmp/ldap-tls

          # 1. Generate CA key + self-signed CA cert
          openssl genrsa -out /tmp/ldap-tls/ca.key 2048
          openssl req -x509 -new -nodes -key /tmp/ldap-tls/ca.key \
            -sha256 -days 1 -out /tmp/ldap-tls/ca.crt \
            -subj "/CN=hearth-ldap-ci-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"

          # 2. Generate server key + CSR
          openssl genrsa -out /tmp/ldap-tls/server.key 2048
          openssl req -new -key /tmp/ldap-tls/server.key \
            -out /tmp/ldap-tls/server.csr \
            -subj "/CN=localhost"

          # 3. Sign server cert with CA — end-entity (CA:FALSE), SAN required by rustls
          openssl x509 -req \
            -in /tmp/ldap-tls/server.csr \
            -CA /tmp/ldap-tls/ca.crt -CAkey /tmp/ldap-tls/ca.key -CAcreateserial \
            -out /tmp/ldap-tls/server.crt -days 1 -sha256 \
            -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=critical,CA:FALSE\n")

          chmod 644 /tmp/ldap-tls/*.crt /tmp/ldap-tls/*.key

          # Trust the CA so rustls-native-certs (used by ldap3 tls-rustls-ring)
          # accepts the LDAPS connection in ldaps_connection_succeeds test.
          sudo cp /tmp/ldap-tls/ca.crt /usr/local/share/ca-certificates/hearth-ldap-ci.crt
          sudo update-ca-certificates

          # Start OpenLDAP with certs mounted; digest-pinned image (HEA-1382)
          docker run -d --name openldap \
            -p 1389:1389 -p 1636:1636 \
            -e LDAP_ADMIN_USERNAME=admin \
            -e LDAP_ADMIN_PASSWORD=HearthLdapCI1! \
            -e LDAP_ROOT=dc=hearth,dc=test \
            -e LDAP_ENABLE_TLS=yes \
            -e LDAP_TLS_VERIFY_CLIENT=never \
            -e LDAP_USERS=hearthldaptest \
            -e LDAP_PASSWORDS=HearthLdapUser1! \
            -e LDAP_TLS_CERT_FILE=/tls/server.crt \
            -e LDAP_TLS_KEY_FILE=/tls/server.key \
            -e LDAP_TLS_CA_FILE=/tls/ca.crt \
            -v /tmp/ldap-tls:/tls:ro \
            bitnamilegacy/openldap:2.6.10-debian-12-r4@sha256:966fd39ed25813890e9bd57dac56def163bbcfe64967e0bae59ab018d505bd93

      - name: Setup Rust toolchain (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-nextest

      - name: Install ldap-utils (runner-side ldapsearch for readiness probe)
        run: sudo apt-get install -y --no-install-recommends ldap-utils

      - name: Wait for OpenLDAP to be ready
        run: |
          # Wait for LDAP port AND user seeding: bitnami seeds LDAP_USERS
          # asynchronously after the port comes up, so we must verify at least
          # one inetOrgPerson entry exists before running tests.
          for i in $(seq 1 40); do
            USER_COUNT=$(ldapsearch -x -H ldap://localhost:1389 \
              -b dc=hearth,dc=test \
              -D cn=admin,dc=hearth,dc=test \
              -w HearthLdapCI1! \
              "(objectClass=inetOrgPerson)" 2>/dev/null | grep -c "^dn:" || true)
            if [ "${USER_COUNT:-0}" -gt 0 ]; then
              echo "OpenLDAP ready with ${USER_COUNT} user(s) (attempt $i)"
              break
            fi
            echo "Waiting for OpenLDAP users... (attempt $i/40, currently ${USER_COUNT:-0} users)"
            sleep 3
          done

      - name: Run LDAP integration tests (run-ignored against real server)
        run: |
          cargo nextest run --workspace \
            --run-ignored all \
            -E 'test(ldap)' \
            --no-fail-fast
        env:
          PROTOC: protoc

  # ── Raft cluster chaos validation (Gap C-1, HEA-1323) ───────────────────────
  #
  # Runs the full cluster simulation suite (AC-1 through AC-7) in a single
  # thread so election timeouts do not interfere with each other. Gated on the
  # `rust` filter because it only changes when src/**, simulation/**, or
  # Cargo.lock change — the same condition that rebuilds the simulation crate.
  #
  # Why a dedicated job (not just quality/make check):
  #   • Single-threaded execution (--test-threads=1) is required for timing-
  #     sensitive Raft election timeout tests (150–300 ms). Running them with
  #     the default parallelism inside the quality job can cause flaky timeouts.
  #   • Named CI badge: "cluster-chaos" is an explicit readiness gate that is
  #     clearly visible in PR check lists — satisfying Gap C-1 of the 1.0
  #     Readiness Audit.

  cluster-chaos:
    name: cluster-chaos (Raft AC-1 through AC-7)
    needs: filter
    # HEA-685: guard with `needs.filter.result == 'success'` — see `quality` above.
    if: (needs.filter.result == 'success' && needs.filter.outputs.rust == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # AC-5–7 each have election windows (up to 10–15 s) and write loops.
    # 10 minutes is generous; typical runtime is ~90 s.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Free disk space (Rust debug builds need ~12 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-nextest

      - name: make cluster-smoke (Raft AC-1..AC-7 — single-threaded, ~90 s)
        run: PROTOC=protoc make cluster-smoke

      - name: Summarize cluster-chaos result
        if: always()
        run: |
          {
            echo "## Cluster Chaos Results (HEA-1323 Gap C-1)"
            echo ""
            echo "| Scenario | Test file |"
            echo "| --- | --- |"
            echo "| AC-1: network partition + convergence | cluster_failover.rs |"
            echo "| AC-2: leader kill + re-election | cluster_failover.rs |"
            echo "| AC-3: rolling restart, zero read errors | cluster_failover.rs |"
            echo "| AC-4: snapshot catch-up (cold follower) | cluster_failover.rs |"
            echo "| AC-5: leader kill mid-write-sequence | cluster_chaos.rs |"
            echo "| AC-6: WAL replay after node crash | cluster_chaos.rs |"
            echo "| AC-7: write contention, 2 leadership changes | cluster_chaos.rs |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Dependency advisory gate (HEA-1652) ─────────────────────────────────────
  #
  # Dedicated cargo-deny job so advisory/license/ban violations appear as their
  # own named CI check rather than being buried in the 30-minute quality job.
  #
  # Gated on the `deny` filter (deny.toml, Cargo.toml, Cargo.lock) so it only
  # runs when dependency state actually changes. Always runs on pushes to main
  # and schedule events (security.yml's weekly cron also fires cargo-deny, but
  # that workflow does not feed required-summary — this one does).
  #
  # No Rust build needed: cargo-deny reads Cargo.lock and deny.toml directly.
  # Runtime is ~30 s vs ~25 min for the full quality job.

  cargo-deny:
    name: cargo-deny (advisories + licenses + bans)
    needs: filter
    if: (needs.filter.result == 'success' && needs.filter.outputs.deny == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-deny

      - name: cargo deny check (advisories + licenses + bans)
        run: cargo deny check

  # ── MSRV gate (HEA-2115) ─────────────────────────────────────────────────────
  #
  # Builds the workspace at exactly the rust-version declared in Cargo.toml so
  # that a dependency bump that raises the true floor cannot silently drift past
  # the declared minimum unnoticed. Runs on every Rust-touching change and on
  # every push/schedule so cargo-update PRs are always covered.
  #
  # Uses `toolchain: "1.88.0"` (the value of rust-version in Cargo.toml).
  # Keep these two in sync; the CI job is the enforcement mechanism.

  msrv:
    name: msrv (1.88.0)
    needs: filter
    if: (needs.filter.result == 'success' && needs.filter.outputs.rust == 'true') || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain (MSRV pin)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88.0"
          components: ""

      - name: cargo check (MSRV)
        run: cargo check --workspace --locked

  # ── Required-summary gate (HEA-693) ──────────────────────────────────────────
  #
  # Branch protection requires ONLY this job for the CI workflow. It always runs
  # and succeeds when every upstream job either passed or was legitimately skipped
  # (paths-filter determined no changes in scope). It fails if any upstream job
  # failed or was cancelled.
  #
  # Why: conditional matrix jobs (sdk-node) and conditional jobs (quality, ui,
  # sdk-conformance) only post individual check-run entries when they actually
  # execute. When paths-filter skips them, branch protection sees "Expected —
  # Waiting for status to be reported" for each individual check name forever.
  # A single always-running summary gate eliminates that gap: one required check
  # name, always reported, correctly aggregates pass/skip/fail (HEA-693).

  required-summary:
    name: required-summary
    if: always()
    needs: [filter, quality, ui, sdk-node, sdk-rust, sdk-python, sdk-php, sdk-conformance, abuse-coverage, ldap-integration, cluster-chaos, cargo-deny, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Check all jobs passed or were skipped
        env:
          FILTER: ${{ needs.filter.result }}
          QUALITY: ${{ needs.quality.result }}
          UI: ${{ needs.ui.result }}
          SDK_NODE: ${{ needs.sdk-node.result }}
          SDK_RUST: ${{ needs.sdk-rust.result }}
          SDK_PYTHON: ${{ needs.sdk-python.result }}
          SDK_PHP: ${{ needs.sdk-php.result }}
          SDK_CONFORMANCE: ${{ needs.sdk-conformance.result }}
          ABUSE_COVERAGE: ${{ needs.abuse-coverage.result }}
          LDAP_INTEGRATION: ${{ needs.ldap-integration.result }}
          CLUSTER_CHAOS: ${{ needs.cluster-chaos.result }}
          CARGO_DENY: ${{ needs.cargo-deny.result }}
          MSRV: ${{ needs.msrv.result }}
        run: |
          echo "filter=$FILTER quality=$QUALITY ui=$UI sdk-node=$SDK_NODE sdk-rust=$SDK_RUST sdk-python=$SDK_PYTHON sdk-php=$SDK_PHP sdk-conformance=$SDK_CONFORMANCE abuse-coverage=$ABUSE_COVERAGE ldap-integration=$LDAP_INTEGRATION cluster-chaos=$CLUSTER_CHAOS cargo-deny=$CARGO_DENY msrv=$MSRV"
          for result in "$FILTER" "$QUALITY" "$UI" "$SDK_NODE" "$SDK_RUST" "$SDK_PYTHON" "$SDK_PHP" "$SDK_CONFORMANCE" "$ABUSE_COVERAGE" "$LDAP_INTEGRATION" "$CLUSTER_CHAOS" "$CARGO_DENY" "$MSRV"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job failed or was cancelled."
              exit 1
            fi
          done
          echo "All jobs passed or were legitimately skipped."
