name: Security

# Consolidated security workflow (HEA-680).
#
# Replaces the previous three single-purpose workflows (codeql.yml, trivy.yml,
# osv-scanner.yml). All three scanners share triggers, permissions, the single
# weekly cron schedule, and the pinned SARIF upload action — so consolidating
# them is structural deduplication, not behavioural change.
#
# Posture: each job uploads a separate SARIF category to GitHub Code Scanning,
# so existing alert dedup + branch-protection rules continue to work. Failures
# in one scanner do not cancel the others (no fail-fast); each writes its own
# SARIF and is required to remain green independently.
#
# Doc-only PRs are skipped via paths-ignore — security scanners don't add value
# on documentation diffs and would just burn runner minutes.
#
# ─────────────────────────────────────────────────────────────────────────────
# Stale-analysis hygiene (HEA-716 / HEA-717)
#
# Code Scanning keeps the last analysis per (tool, ref, analysis_key) triple
# forever — even after the source workflow file is deleted or renamed. That
# leaves "Actions workflow … is missing" / "stale tool" warnings on the
# Code Scanning Tools page indefinitely, because the REST API still has rows
# whose `analysis_key` points at a path that no longer exists on main.
#
# Convention when touching this file:
#   1. Prefer renaming jobs / workflow steps IN PLACE so the existing
#      `analysis_key` continues to receive new uploads. This is the cheapest
#      path — no API mutation, no token, no extra PR.
#   2. If a rename is not possible (consolidation, splitting, deletion),
#      RUN the cleanup script after the consolidation PR has merged to main
#      and the next scheduled run has uploaded fresh analyses under the new
#      keys:
#        scripts/cleanup-stale-code-scanning-analyses.sh --dry-run
#        scripts/cleanup-stale-code-scanning-analyses.sh --confirm
#      See the script header for per-tool stale predicates and auth notes.
#
# Hard "no Snyk" policy:
#   Hearth does NOT use Snyk. Dependabot covers automated dependency PRs,
#   and Trivy + osv-scanner below cover vulnerability scanning. Do not add
#   Snyk back to this workflow or to any other CI surface without an
#   explicit CTO + SecurityAuditor sign-off. Stale Snyk Open Source
#   analyses are an unconditional cleanup target in the script above.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "CHANGELOG.md"
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  # Allow manual re-runs to verify alert state after config changes (HEA-1523)
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # HEA-696: SARIF upload requires security-events:write. Scoped per-job so a
    # supply-chain-compromised action in any other job cannot mint findings.
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: manual
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Rust autobuild needs cargo + protoc on PATH before CodeQL invokes it.
      # Other languages use CodeQL's bundled tracers, so we skip the Rust setup
      # for non-rust matrix legs to avoid wasted runner minutes.
      - name: Setup Rust toolchain + protoc (HEA-676 reusable)
        if: matrix.language == 'rust'
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: ""

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          # HEA-690: effective for interpreted legs (JS/TS, Python) only.
          # CodeQL for compiled languages (Rust, Go) traces the compiler
          # invocation rather than individual files, so paths-ignore is a no-op
          # for those legs — Rust test scope is controlled by the build command
          # below (no --all-targets), and Go autobuild inherits the same limit.
          # Keeping this block anyway so interpreted legs remain scoped to
          # production code (fixtures/tests flood false positives for JS/Python).
          paths-ignore: |
            tests/**
            benches/**
            simulation/**
            fuzz/**
            examples/**
            **/tests/**
            **/__tests__/**
            **/*.test.ts
            **/*.test.js
            **/*.test.go
            **/*.test.py
            **/*.test.rs
            **/*.spec.ts
            **/*.spec.js
            sdks/*/tests/**
            sdks/*/test/**
          queries: security-extended

      # Go autobuild calls `go get` to resolve module imports. Without git
      # credentials (persist-credentials: false above), private/internal module
      # fetches fail with "could not read Username". Inject read-only token via
      # URL rewriting — scoped to Go leg only, not stored in .git/config.
      - name: Configure git HTTPS auth for Go module downloads
        if: matrix.language == 'go'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

      - name: Free disk space for Rust CodeQL build
        if: matrix.language == 'rust'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h

      - name: Manual build for CodeQL (Rust)
        if: matrix.language == 'rust'
        shell: bash
        # HEA-1381: omit --all-targets so cfg(test) is never enabled and test
        # code is not compiled into the CodeQL database. Production lib + bins
        # are still fully in scope; --all-targets was the only reason test
        # modules (hardcoded fixtures, fake creds) surfaced as findings.
        run: cargo build --workspace --all-features --locked

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # HEA-696: SARIF upload requires security-events:write. Scoped per-job so a
    # supply-chain-compromised action in any other job cannot mint findings.
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.29.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          # HEA-690: Trivy fs scan focuses on secrets + misconfigs in shipping
          # code. Tests, examples, fuzz, and node_modules are intentionally noisy
          # (fake creds in fixtures, vendored deps) and excluded.
          skip-dirs: .git,target,tests,examples,fuzz,node_modules
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy.sarif
          category: trivy

  cargo-deny:
    name: cargo-deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # No SARIF output — cargo-deny advisory violations fail the job directly,
    # which surfaces in PR checks and the weekly security sweep.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-deny

      - name: cargo deny check (advisories + licenses + bans)
        run: cargo deny check

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # HEA-696: SARIF upload requires security-events:write. Scoped per-job so a
    # supply-chain-compromised action in any other job cannot mint findings.
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          # HEA-1523: Explicit lockfile list instead of --recursive so examples/**
          # and tests/ui/** are never scanned. The [[PackageOverrides]] `group`
          # field is a lockfile-internal group name, NOT a path glob, so the
          # previous `group = "examples/**"` override was silently ignored.
          # Production scope: root Cargo.lock, fuzz harness, all SDK lockfiles,
          # root pnpm-lock.yaml (UI tooling), docs-site/package-lock.json.
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock
            --lockfile=fuzz/Cargo.lock
            --lockfile=pnpm-lock.yaml
            --lockfile=docs-site/package-lock.json
            --lockfile=sdks/go/go.mod
            --lockfile=sdks/node/package-lock.json
            --lockfile=sdks/php/composer.lock
            --lockfile=sdks/rust/Cargo.lock
            --lockfile=sdks/typescript/package-lock.json
            --format=sarif
            --output-file=osv.sarif

      - name: Upload OSV SARIF to GitHub Code Scanning
        if: always() && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: osv.sarif
          category: osv-scanner
