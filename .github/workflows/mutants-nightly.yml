name: Mutants Nightly

# #641, OpenSpec trusted-core-confidence task 4.1 (design decision 5).
#
# cargo-mutants changes the code one small step at a time (a `==` to `!=`, a
# function body to `Ok(())`) and runs the tests. A mutant that no test catches
# is a survivor: the tests pass while the behaviour they name is broken.
#
# Scope (owner decision, 2026-11-09): the core high-risk code only. That is
# token issuance, sessions, the RBAC resolver and the permission check. The
# modules, their files, the integration test binaries that each mutant runs,
# the shard counts and the survivor budgets are all in ci/mutants-budget.toml.
# The full scope of src/identity/, src/rbac/ and src/protocol/http/ has about
# 8,800 mutants, about 150 to 200 runner-hours for each run, which does not
# fit in one night (measurement in #641).
#
# Each mutant runs the lib tests (not the storage and cluster tests, which
# cannot reach these modules) and the integration binaries of its module. Not
# the full suite: tests/ has more than 400 binaries.
#
# The `plan` job reads the shard matrix from the budget file. Each `shard` job
# runs one shard of one module. The `budget` job adds the survivors of each
# module and fails when a module has more survivors than its budget
# (scripts/check-mutants-budget.py). A missing or unfinished shard also fails.
#
# ci/mutations.toml and mutation-spot-check.yml stay: they prove specific
# guards, which a budget does not.
#
# There is deliberately no `pull_request:` trigger (see mutation-spot-check.yml:
# a workflow with its own PR trigger cannot fail a merge). The cheap half runs
# on every PR in ci.yml's filter job: the budget file must be live and the
# budget check's self-test must pass.

on:
  schedule:
    # 05:30 UTC daily = 00:30 EST (01:30 EDT): in the US Eastern night, after
    # ui-nightly (02:00 UTC), sdk-smoke (03:00), jepsen and the mutation
    # spot-check (03:30) have started, and well before the release PR (11:17).
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The cargo-mutants version. A change is a deliberate PR: the outcome format
  # and the set of mutants can change between versions.
  CARGO_MUTANTS_VERSION: "27.1.0"

jobs:
  plan:
    name: plan (shard matrix from ci/mutants-budget.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Budget file is live
        run: python3 -I scripts/check-mutants-budget.py --check-config

      - name: Shard matrix
        id: matrix
        run: echo "matrix=$(python3 -I scripts/check-mutants-budget.py --matrix)" >> "$GITHUB_OUTPUT"

  shard:
    name: mutants ${{ matrix.module }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: plan
    runs-on: ubuntu-latest
    # A shard takes at most about 4 hours (ci/mutants-budget.toml). The limit
    # gives room for a slow runner and stays under the 6-hour job limit of
    # GitHub-hosted runners. A shard that times out has no result, and the
    # budget job then fails.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Force HTTP/1.1 to eliminate crates.io HTTP/2 framing-layer resets (HEA-1530).
      CARGO_HTTP_MULTIPLEXING: "false"
      # Retry transient registry downloads; default is 3 (HEA-1530).
      CARGO_NET_RETRY: "10"
      # Smaller test binaries link faster; line tables are enough for a panic.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Free disk space (Rust debug builds need ~12 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup Rust toolchain (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          cache-key-suffix: mutants

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest

      - name: Install cargo-mutants ${{ env.CARGO_MUTANTS_VERSION }}
        run: |
          if [ "$(cargo mutants --version 2>/dev/null)" != "cargo-mutants ${CARGO_MUTANTS_VERSION}" ]; then
            cargo install cargo-mutants --version "${CARGO_MUTANTS_VERSION}" --locked
          fi
          cargo mutants --version

      # In place: the runner is thrown away, and the build reuses the cached
      # target directory. cargo-mutants restores each file after its mutant.
      # Exit codes: 0 all caught, 2 survivors, 3 timeouts. These are results,
      # and the budget job judges them. Any other code (1 usage, 4 the
      # unmutated tree fails its tests, 70 internal) fails the shard.
      - name: cargo mutants (${{ matrix.module }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
        env:
          MODULE: ${{ matrix.module }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          args=()
          while IFS= read -r line; do args+=("$line"); done \
            < <(python3 -I scripts/check-mutants-budget.py --mutants-args "$MODULE")
          mkdir -p "${RUNNER_TEMP}/mutants/mutants.out"
          set +e
          cargo mutants --in-place --no-shuffle --test-tool nextest \
            --features hearth/dev-endpoints \
            --shard "${SHARD}/${SHARDS}" \
            --output "${RUNNER_TEMP}/mutants" \
            "${args[@]}"
          rc=$?
          set -e
          echo "cargo mutants exit code: ${rc}"
          echo "${MODULE} ${SHARD} ${SHARDS}" > "${RUNNER_TEMP}/mutants/mutants.out/shard.txt"
          case "$rc" in
            0|2|3) ;;
            *) exit "$rc" ;;
          esac

      - name: Working tree is clean (every mutated file was restored)
        if: always()
        run: |
          if ! git diff --quiet; then
            echo "::error::a mutated file was not restored"
            git --no-pager diff --stat
            exit 1
          fi

      - name: Upload the outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-${{ matrix.module }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/mutants/mutants.out/shard.txt
            ${{ runner.temp }}/mutants/mutants.out/outcomes.json
            ${{ runner.temp }}/mutants/mutants.out/*.txt
            ${{ runner.temp }}/mutants/mutants.out/diff/
          if-no-files-found: warn
          retention-days: 30

  budget:
    name: budget (survivors per module, ci/mutants-budget.toml)
    needs: [plan, shard]
    # Also after a failed or cancelled shard: the check then reports which
    # shard is missing, and fails.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the outcomes of every shard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutants-*
          path: ${{ runner.temp }}/results

      - name: Budget check self-test (proves the check can fail)
        run: bash scripts/tests/check-mutants-budget.test.sh

      - name: Survivors against the budget
        run: |
          {
            echo "## Mutants nightly (#641)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -I scripts/check-mutants-budget.py \
            --summary "$GITHUB_STEP_SUMMARY" "${RUNNER_TEMP}/results"
