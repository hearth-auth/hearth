# Cross-browser nightly UI test run (HEA-663).
#
# Runs the smoke + flows + regression Playwright suites against Firefox and
# WebKit (Safari engine) in addition to Chromium. Scheduled nightly at 02:00
# UTC and available for manual dispatch.
#
# Failures are reported per-browser via job summaries. The workflow does NOT
# block merges — it is informational (continue-on-error: true per matrix leg).

name: UI Tests — Cross-Browser Nightly

on:
  schedule:
    # 02:00 UTC daily — after any typical EU/US working-day pushes settle
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Comma-separated browser list (chromium,firefox,webkit)'
        required: false
        default: 'chromium,firefox,webkit'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cross-browser:
    name: UI tests — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-14
        with:
          toolchain: stable

      - name: Cargo build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Tailwind standalone CLI
        run: make tailwind-install

      - name: Build Hearth binary (debug)
        run: PROTOC=protoc make build

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install UI test dependencies
        run: cd tests/ui && npm ci

      - name: Install Playwright browser — ${{ matrix.browser }}
        run: cd tests/ui && npx playwright install ${{ matrix.browser }} --with-deps

      - name: Wipe dev data (clean slate)
        run: make dev-reset

      - name: Start Hearth dev server
        run: HEARTH_DEV_DATA_DIR=./data/dev ./target/debug/hearth serve --dev &

      - name: Wait for server to be ready
        run: cd tests/ui && npx wait-on http://127.0.0.1:8420/health --timeout 60000

      - name: Run smoke + flows + regression (${{ matrix.browser }})
        run: |
          bash tests/ui/pw-run.sh test \
            --project=smoke \
            --project=flows \
            --project=regression \
            --browser=${{ matrix.browser }}

      - name: Upload Playwright report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-browser-report-${{ matrix.browser }}
          path: tests/ui/reports/html/
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "## Cross-Browser Results — ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          RESULT="${{ job.status }}"
          if [ "$RESULT" = "success" ]; then
            echo "✅ All tests passed on ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ One or more tests failed on ${{ matrix.browser }} — see Playwright report artifact" >> "$GITHUB_STEP_SUMMARY"
          fi
