name: Release

# Triggered on every version tag. Produces signed binaries, a CycloneDX SBOM,
# cosign signatures (keyless OIDC), and SLSA L1 provenance, then publishes them
# to a GitHub Release.
#
# Supply-chain trust chain (HEA-747):
#   binary  ──cosign──▶  <binary>.sig + <binary>.pem   (Sigstore Fulcio / Rekor)
#   binary  ──SLSA──▶    <binary>.intoto.jsonl          (slsa-github-generator)
#   codebase ─cyclonedx▶ hearth-sbom.cdx.json           (CycloneDX SBOM)
#   all ────SHA256SUMS──▶ SHA256SUMS + SHA256SUMS.sig    (cosign-signed manifest)
#
# Cosign OIDC identity for verification:
#   Issuer:  https://token.actions.githubusercontent.com
#   Subject: ^https://github\.com/hearth-auth/hearth/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$

on:
  push:
    # Strict semver-only tag trigger (HEA-791 SR-3): prevents arbitrary ref
    # names like `vtest` or `vfoo` from minting Sigstore certs under the
    # project identity and littering the Rekor transparency log.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip signing, SLSA provenance, and publishing — builds and checksums all targets only"
        type: boolean
        default: true
      version_override:
        description: "Version to stamp into the binary (e.g. 1.2.3). Defaults to 0.0.0-dry-run when blank."
        type: string
        default: ""

# Minimal default; each job escalates only what it needs.
permissions:
  contents: read

jobs:
  # ── 1. Build release binaries ─────────────────────────────────────────────
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hearth-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: hearth-linux-arm64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: hearth-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: hearth-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hearth-windows-amd64
            exe_suffix: .exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Strip the leading "v" from the tag (v1.0.0 → 1.0.0) and export it so
      # the build script can forward it to CARGO_PKG_VERSION via
      # cargo:rustc-env, making `hearth --version` match the release tag.
      # For workflow_dispatch dry-runs, use the version_override input or
      # fall back to 0.0.0-dry-run. Passed through env: to avoid injection.
      - name: Derive release version from tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${VERSION_OVERRIDE:-0.0.0-dry-run}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "HEARTH_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install protoc (Linux native)
        if: runner.os == 'Linux' && matrix.use_cross != true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc --yes
          $protoc = (Get-Command protoc -ErrorAction Stop).Path
          echo "PROTOC=$protoc" >> $env:GITHUB_ENV

      - name: Install cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@15413b256f995d819248ea62704771a959284285 # v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.use_cross == true
        # --locked forbids resolving any Cargo.lock changes during the build.
        # Required for SLSA L1 reproducibility (HEA-786).
        run: cross build --locked --release --target ${{ matrix.target }} -p hearth

      - name: Build (cargo)
        if: matrix.use_cross != true
        # --locked forbids resolving any Cargo.lock changes during the build.
        # Required for SLSA L1 reproducibility (HEA-786).
        run: cargo build --locked --release --target ${{ matrix.target }} -p hearth

      - name: Stage binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/hearth${{ matrix.exe_suffix }}" "${{ matrix.artifact }}${{ matrix.exe_suffix }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.exe_suffix }}
          if-no-files-found: error

  # ── 2. CycloneDX SBOM ─────────────────────────────────────────────────────
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-sbom-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate SBOM
        run: cargo cyclonedx --format json --spec-version 1.4

      - name: Stage SBOM
        run: cp hearth.cdx.json hearth-sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hearth-sbom
          path: hearth-sbom.cdx.json
          if-no-files-found: error

  # ── 3. Compute SHA-256 hashes (SLSA subjects) + write SHA256SUMS ──────────
  hash:
    name: Compute artifact hashes
    needs: [build, sbom]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: artifacts

      # Write SHA256SUMS covering all binaries (incl. Windows) and the SBOM.
      # Base64-encode it for the SLSA provenance generator — same byte content
      # as the original sha256sum pipe, now materialised as a signable file.
      - id: hash
        working-directory: artifacts
        run: |
          sha256sum \
            hearth-linux-amd64 \
            hearth-linux-arm64 \
            hearth-darwin-amd64 \
            hearth-darwin-arm64 \
            hearth-windows-amd64.exe \
            hearth-sbom.cdx.json > SHA256SUMS
          echo "hashes=$(base64 -w 0 SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sha256sums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  # ── 4. Cosign keyless signing ──────────────────────────────────────────────
  sign:
    name: Sign with cosign (keyless OIDC)
    needs: [build, sbom, hash]
    # Skip on workflow_dispatch dry-runs: cosign OIDC requires a tag-scoped ref.
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign artifacts
        working-directory: artifacts
        run: |
          for f in hearth-linux-amd64 hearth-linux-arm64 hearth-darwin-amd64 hearth-darwin-arm64 hearth-windows-amd64.exe hearth-sbom.cdx.json SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signatures
          path: |
            artifacts/*.sig
            artifacts/*.pem
          if-no-files-found: error

  # ── 5. SLSA L1 provenance ─────────────────────────────────────────────────
  # Runs in a slsa-github-generator-controlled job to establish the attestation.
  provenance:
    needs: [hash]
    # Skip on workflow_dispatch dry-runs: SLSA generator requires tag context.
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    permissions:
      actions: read
      id-token: write
      contents: write   # SLSA generator's nested upload-assets job statically requires write; upload-assets: false keeps it as a workflow artifact only
    # v2.1.0 validates that the calling ref is a semver tag (refs/tags/vX.Y.Z)
    # so it can look up the corresponding release binary. Using @SHA directly
    # fails this check ("Invalid ref: SHA. Expected refs/tags/vX.Y.Z").
    # GitHub Actions resolves the tag to f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    # at checkout time, providing equivalent security.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.hash.outputs.hashes }}"
      upload-assets: false
      # The SLSA generator checks GITHUB_REPOSITORY_VISIBILITY which is absent
      # in reusable-workflow contexts; setting private-repository: true bypasses
      # the false "Repository is private" detection.
      private-repository: true

  # ── 6. Publish GitHub Release ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [sign, provenance]
    # Skip on workflow_dispatch dry-runs (sign/provenance are also skipped;
    # this explicit guard prevents a confusing "skipped needs" failure message).
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts (binaries + SBOM + signatures + provenance)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: dist

      - name: Create draft release, upload artifacts, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          # Remove any stale release left by a previous failed run (keeps the git tag).
          gh release delete "$TAG" --yes --repo "$REPO" 2>/dev/null || true
          # Create as draft so all uploads complete before the release goes live.
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --repo "$REPO" \
            dist/hearth-linux-amd64 \
            dist/hearth-linux-arm64 \
            dist/hearth-darwin-amd64 \
            dist/hearth-darwin-arm64 \
            'dist/hearth-windows-amd64.exe' \
            dist/hearth-sbom.cdx.json \
            dist/SHA256SUMS \
            dist/*.sig \
            dist/*.pem \
            dist/multiple.intoto.jsonl
          # Publish only after every asset is confirmed uploaded.
          gh release edit "$TAG" --draft=false --repo "$REPO"
