name: Release

# Triggered on every version tag. Produces signed binaries, a CycloneDX SBOM,
# cosign signatures (keyless OIDC), and SLSA L1 provenance, then publishes them
# to a GitHub Release.
#
# Supply-chain trust chain (HEA-747):
#   binary  ──cosign──▶  <binary>.sig + <binary>.pem   (Sigstore Fulcio / Rekor)
#   binary  ──SLSA──▶    <binary>.intoto.jsonl          (slsa-github-generator)
#   codebase ─cyclonedx▶ hearth-sbom.cdx.json           (CycloneDX SBOM)
#   all ────SHA256SUMS──▶ SHA256SUMS + SHA256SUMS.sig    (cosign-signed manifest)
#
# Cosign OIDC identity for verification:
#   Issuer:  https://token.actions.githubusercontent.com
#   Subject: ^https://github\.com/hearth-auth/hearth/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$

on:
  push:
    # Strict semver-only tag trigger (HEA-791 SR-3): prevents arbitrary ref
    # names like `vtest` or `vfoo` from minting Sigstore certs under the
    # project identity and littering the Rekor transparency log.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip signing, SLSA provenance, and publishing — builds and checksums all targets only"
        type: boolean
        default: true
      version_override:
        description: "Version to stamp into the binary (e.g. 1.2.3). Defaults to 0.0.0-dry-run when blank."
        type: string
        default: ""

# Minimal default; each job escalates only what it needs.
permissions:
  contents: read

jobs:
  # ── 1. Build release binaries ─────────────────────────────────────────────
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hearth-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: hearth-linux-arm64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: hearth-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: hearth-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hearth-windows-amd64
            exe_suffix: .exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Strip the leading "v" from the tag (v1.0.0 → 1.0.0) and export it so
      # the build script can forward it to CARGO_PKG_VERSION via
      # cargo:rustc-env, making `hearth --version` match the release tag.
      # For workflow_dispatch dry-runs, use the version_override input or
      # fall back to 0.0.0-dry-run. Passed through env: to avoid injection.
      - name: Derive release version from tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${VERSION_OVERRIDE:-0.0.0-dry-run}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "HEARTH_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install protoc (Linux native)
        if: runner.os == 'Linux' && matrix.use_cross != true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc --yes
          $protoc = (Get-Command protoc -ErrorAction Stop).Path
          echo "PROTOC=$protoc" >> $env:GITHUB_ENV

      - name: Install cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@15413b256f995d819248ea62704771a959284285 # v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.use_cross == true
        # --locked forbids resolving any Cargo.lock changes during the build.
        # Required for SLSA L1 reproducibility (HEA-786).
        run: cross build --locked --release --target ${{ matrix.target }} -p hearth

      - name: Build (cargo)
        if: matrix.use_cross != true
        # --locked forbids resolving any Cargo.lock changes during the build.
        # Required for SLSA L1 reproducibility (HEA-786).
        run: cargo build --locked --release --target ${{ matrix.target }} -p hearth

      - name: Stage binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/hearth${{ matrix.exe_suffix }}" "${{ matrix.artifact }}${{ matrix.exe_suffix }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.exe_suffix }}
          if-no-files-found: error

  # ── 2. Release validation (HEA-1264) ──────────────────────────────────────
  # §13.4 gate: a documented, reproducible validation run attached to the
  # release. Mirrors docs/ops/RELEASE_VALIDATION.md steps 1-3, 7 and 9 on the
  # exact release commit, and emits validation-summary.txt as a release asset.
  #
  # Gate structure: every gate runs (continue-on-error) so the summary reports
  # the FULL picture rather than stopping at the first failure. The final
  # "Enforce hard gates" step re-raises any hard-gate failure, so a red test
  # suite still fails this job — and `release` needs: validation, so it blocks
  # publishing. bench-gate is advisory by design (see runbook step 7): a >20%
  # regression needs human judgement against the recorded baseline, so it is
  # recorded in the summary but never fails the job on its own.
  validation:
    # publish-gate — this job writes the verdict every publish channel waits for.
    # docker.yml, helm.yml and the seven SDK workflows read it by this job's name
    # through .github/actions/await-green-commit. Renaming this job breaks that
    # wait, so scripts/check-publish-gating.sh fails if the marker disappears.
    name: Release validation (test matrix + bench gate)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # proto/breaking comparisons and `git describe` need real history.
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space (Rust debug builds need ~12 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup Rust toolchain + buf + tailwind (HEA-676 reusable)
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy,rustfmt
          install-buf: "true"
          install-tailwind: "true"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-nextest

      # ── Hard gates ────────────────────────────────────────────────────────
      - name: "Step 1 — Full workspace test suite (cargo nextest)"
        id: nextest
        continue-on-error: true
        env:
          PROTOC: protoc
        run: |
          set -o pipefail
          cargo nextest run --workspace --no-fail-fast 2>&1 | tee nextest.log

      - name: "Step 2 — Test quality gate (make test-quality)"
        id: test_quality
        continue-on-error: true
        run: make test-quality

      - name: "Step 3 — Abuse coverage gate (make abuse-check)"
        id: abuse_check
        continue-on-error: true
        run: make abuse-check

      - name: "Step 9 — ROPC ban gate (make security-gate)"
        id: security_gate
        continue-on-error: true
        run: make security-gate

      # ── Advisory gate ─────────────────────────────────────────────────────
      - name: "Step 7 — Benchmark gate (make bench-gate, advisory)"
        id: bench
        continue-on-error: true
        env:
          PROTOC: protoc
        run: |
          set -o pipefail
          make bench-gate 2>&1 | tee bench.log

      # ── Summary ───────────────────────────────────────────────────────────
      # always() so a failed run still publishes a diagnostic summary artifact.
      # This does NOT rescue the job status — "Enforce hard gates" below still
      # fails the job, which is what actually blocks `release`.
      - name: Compose validation-summary.txt
        if: always()
        env:
          NEXTEST: ${{ steps.nextest.outcome }}
          TEST_QUALITY: ${{ steps.test_quality.outcome }}
          ABUSE: ${{ steps.abuse_check.outcome }}
          SECURITY: ${{ steps.security_gate.outcome }}
          BENCH: ${{ steps.bench.outcome }}
        run: |
          verdict() { [ "$1" = "success" ] && echo "PASS" || echo "FAIL"; }
          TESTS_LINE=$(grep -oE '[0-9]+ tests run: .*' nextest.log 2>/dev/null | tail -1)
          [ -n "$TESTS_LINE" ] || TESTS_LINE="test summary unavailable (suite did not complete)"

          # Capture first, then test for emptiness: `grep ... | head || echo` can
          # never reach the fallback, because the pipeline exits with head's 0.
          BENCH_LINES=$(grep -E 'change:|time:' bench.log 2>/dev/null | head -40)
          [ -n "$BENCH_LINES" ] || BENCH_LINES="  (no benchmark output captured)"

          {
            echo "Hearth ${GITHUB_REF_NAME} — Release Validation Summary"
            echo "Runbook:  docs/ops/RELEASE_VALIDATION.md (HEA-1264)"
            echo "Commit:   ${GITHUB_SHA}"
            echo "Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "Hard gates (a FAIL here blocks publishing):"
            echo "  $(verdict "$NEXTEST")  Step 1 — Full workspace test suite — ${TESTS_LINE}"
            echo "  $(verdict "$TEST_QUALITY")  Step 2 — Test quality gate (false-confidence patterns)"
            echo "  $(verdict "$ABUSE")  Step 3 — Abuse coverage gate (§3.41 adversarial matrix)"
            echo "  $(verdict "$SECURITY")  Step 9 — ROPC password-grant ban gate"
            echo ""
            echo "Advisory gates (recorded, reviewed by the release engineer):"
            echo "  $(verdict "$BENCH")  Step 7 — Benchmark gate (rbac_check, session_lookup,"
            echo "        storage_gate, demotion_latency, validate_token)"
            echo ""
            if [ "$BENCH" != "success" ]; then
              echo "NOTE: the benchmark gate did not exit cleanly. Review bench.log in the"
              echo "      workflow artifacts before shipping."
              echo ""
            fi
            echo "Criterion 'change:' lines from this run:"
            echo "$BENCH_LINES"
          } > validation-summary.txt

          cat validation-summary.txt

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-summary
          path: |
            validation-summary.txt
            nextest.log
            bench.log
          if-no-files-found: error

      # Re-raise any hard-gate failure that continue-on-error swallowed above.
      # Without this the job would report success with a red test suite.
      - name: Enforce hard gates
        if: always()
        env:
          NEXTEST: ${{ steps.nextest.outcome }}
          TEST_QUALITY: ${{ steps.test_quality.outcome }}
          ABUSE: ${{ steps.abuse_check.outcome }}
          SECURITY: ${{ steps.security_gate.outcome }}
        run: |
          failed=0
          for gate in NEXTEST TEST_QUALITY ABUSE SECURITY; do
            if [ "${!gate}" != "success" ]; then
              echo "::error::Release validation hard gate failed: ${gate} (${!gate})"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Release is NOT cleared to publish — see validation-summary.txt."
            exit 1
          fi
          echo "All hard gates passed."

  # ── 3. CycloneDX SBOM ─────────────────────────────────────────────────────
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-sbom-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate SBOM
        run: cargo cyclonedx --format json --spec-version 1.4

      - name: Stage SBOM
        run: cp hearth.cdx.json hearth-sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hearth-sbom
          path: hearth-sbom.cdx.json
          if-no-files-found: error

  # ── 4. Compute SHA-256 hashes (SLSA subjects) + write SHA256SUMS ──────────
  hash:
    name: Compute artifact hashes
    needs: [build, sbom]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: artifacts

      # Write SHA256SUMS covering all binaries (incl. Windows) and the SBOM.
      # Base64-encode it for the SLSA provenance generator — same byte content
      # as the original sha256sum pipe, now materialised as a signable file.
      - id: hash
        working-directory: artifacts
        run: |
          sha256sum \
            hearth-linux-amd64 \
            hearth-linux-arm64 \
            hearth-darwin-amd64 \
            hearth-darwin-arm64 \
            hearth-windows-amd64.exe \
            hearth-sbom.cdx.json > SHA256SUMS
          echo "hashes=$(base64 -w 0 SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sha256sums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  # ── 5. Cosign keyless signing ──────────────────────────────────────────────
  sign:
    name: Sign with cosign (keyless OIDC)
    # `validation` is a dependency, not just an ordering hint (audit §4.8#2):
    # cosign was minting signatures for a build that failed validation, and both
    # documented verification commands passed on the result. An attestation that
    # the artefact came from a commit says nothing about whether the commit is
    # good — so the signature must not exist until the verdict is green.
    needs: [validation, build, sbom, hash]
    # Skip on workflow_dispatch dry-runs: cosign OIDC requires a tag-scoped ref.
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign artifacts
        working-directory: artifacts
        run: |
          for f in hearth-linux-amd64 hearth-linux-arm64 hearth-darwin-amd64 hearth-darwin-arm64 hearth-windows-amd64.exe hearth-sbom.cdx.json SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signatures
          path: |
            artifacts/*.sig
            artifacts/*.pem
          if-no-files-found: error

  # ── 6. SLSA L1 provenance ─────────────────────────────────────────────────
  # Runs in a slsa-github-generator-controlled job to establish the attestation.
  provenance:
    # Same reason as `sign` (audit §4.8#2): SLSA provenance for a red build is a
    # true statement about the wrong thing.
    needs: [validation, hash]
    # Skip on workflow_dispatch dry-runs: SLSA generator requires tag context.
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    permissions:
      actions: read
      id-token: write
      contents: write   # SLSA generator's nested upload-assets job statically requires write; upload-assets: false keeps it as a workflow artifact only
    # v2.1.0 validates that the calling ref is a semver tag (refs/tags/vX.Y.Z)
    # so it can look up the corresponding release binary. Using @SHA directly
    # fails this check ("Invalid ref: SHA. Expected refs/tags/vX.Y.Z").
    # GitHub Actions resolves the tag to f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    # at checkout time, providing equivalent security.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.hash.outputs.hashes }}"
      upload-assets: false
      # The SLSA generator checks GITHUB_REPOSITORY_VISIBILITY which is absent
      # in reusable-workflow contexts; setting private-repository: true bypasses
      # the false "Repository is private" detection.
      private-repository: true

  # ── 7. Publish GitHub Release ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    # HEA-1264 §13.4: `validation` gates publishing — a red test suite, test
    # quality gate, abuse-coverage gate, or ROPC ban gate fails that job and
    # the release never goes live.
    needs: [validation, sign, provenance]
    # Skip on workflow_dispatch dry-runs (sign/provenance are also skipped;
    # this explicit guard prevents a confusing "skipped needs" failure message).
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts (binaries + SBOM + signatures + provenance)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: dist

      - name: Create draft release, upload artifacts, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          # Remove any stale release left by a previous failed run (keeps the git tag).
          gh release delete "$TAG" --yes --repo "$REPO" 2>/dev/null || true
          # Create as draft so all uploads complete before the release goes live.
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --repo "$REPO" \
            dist/hearth-linux-amd64 \
            dist/hearth-linux-arm64 \
            dist/hearth-darwin-amd64 \
            dist/hearth-darwin-arm64 \
            'dist/hearth-windows-amd64.exe' \
            dist/hearth-sbom.cdx.json \
            dist/SHA256SUMS \
            dist/*.sig \
            dist/*.pem \
            dist/multiple.intoto.jsonl \
            dist/validation-summary.txt

          # HEA-1264 §13.4: append a Validation section to the generated notes.
          # Read the generated body back and extend it, rather than passing
          # --notes alongside --generate-notes (whose merge order is version
          # dependent), so the result is deterministic.
          gh release view "$TAG" --repo "$REPO" --json body -q .body > release-notes.md
          cat >> release-notes.md <<EOF

          ## Validation

          This release was validated on commit \`${{ github.sha }}\` using the
          [release validation runbook](https://github.com/$REPO/blob/$TAG/docs/ops/RELEASE_VALIDATION.md).

          The full test matrix (\`cargo nextest run --workspace\`), test-quality gate,
          abuse-coverage gate and ROPC ban gate all passed — publishing is blocked
          otherwise. Benchmark results are advisory and recorded for comparison.

          See **[\`validation-summary.txt\`](https://github.com/$REPO/releases/download/$TAG/validation-summary.txt)**
          for the per-gate verdicts, test counts, and Criterion benchmark deltas.
          EOF
          gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.md

          # Publish only after every asset is confirmed uploaded.
          gh release edit "$TAG" --draft=false --repo "$REPO"
