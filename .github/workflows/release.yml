name: Release

# Triggered on every version tag. Produces signed binaries, a CycloneDX SBOM,
# cosign signatures (keyless OIDC), and SLSA L1 provenance, then publishes them
# to a GitHub Release.
#
# Supply-chain trust chain (HEA-747):
#   binary  ──cosign──▶  <binary>.sig + <binary>.pem   (Sigstore Fulcio / Rekor)
#   binary  ──SLSA──▶    <binary>.intoto.jsonl          (slsa-github-generator)
#   codebase ─cyclonedx▶ hearth-sbom.cdx.json           (CycloneDX SBOM)
#
# Cosign OIDC identity for verification:
#   Issuer:  https://token.actions.githubusercontent.com
#   Subject: ^https://github\.com/therecluse26/hearth/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$

on:
  push:
    # Strict semver-only tag trigger (HEA-791 SR-3): prevents arbitrary ref
    # names like `vtest` or `vfoo` from minting Sigstore certs under the
    # project identity and littering the Rekor transparency log.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Minimal default; each job escalates only what it needs.
permissions:
  contents: read

jobs:
  # ── 1. Build release binaries ─────────────────────────────────────────────
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hearth-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: hearth-linux-arm64
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: hearth-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: hearth-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install protoc (Linux native)
        if: runner.os == 'Linux' && matrix.use_cross != true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.use_cross == true
        # --locked forbids resolving any Cargo.lock changes during the build.
        # Required for SLSA L1 reproducibility (HEA-786).
        run: cross build --locked --release --target ${{ matrix.target }} -p hearth

      - name: Build (cargo)
        if: matrix.use_cross != true
        # --locked forbids resolving any Cargo.lock changes during the build.
        # Required for SLSA L1 reproducibility (HEA-786).
        run: cargo build --locked --release --target ${{ matrix.target }} -p hearth

      - name: Stage binary
        run: cp target/${{ matrix.target }}/release/hearth ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ── 2. CycloneDX SBOM ─────────────────────────────────────────────────────
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-sbom-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2.77.7
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate SBOM
        run: cargo cyclonedx --format json --spec-version 1.4

      - name: Stage SBOM
        run: cp hearth.cdx.json hearth-sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-sbom
          path: hearth-sbom.cdx.json
          if-no-files-found: error

  # ── 3. Compute SHA-256 hashes (SLSA subjects) ─────────────────────────────
  hash:
    name: Compute artifact hashes
    needs: [build, sbom]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: artifacts

      - id: hash
        working-directory: artifacts
        run: |
          hashes=$(sha256sum \
            hearth-linux-amd64 \
            hearth-linux-arm64 \
            hearth-darwin-amd64 \
            hearth-darwin-arm64 \
            hearth-sbom.cdx.json | base64 -w 0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

  # ── 4. Cosign keyless signing ──────────────────────────────────────────────
  sign:
    name: Sign with cosign (keyless OIDC)
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign artifacts
        working-directory: artifacts
        run: |
          for f in hearth-linux-amd64 hearth-linux-arm64 hearth-darwin-amd64 hearth-darwin-arm64 hearth-sbom.cdx.json; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: |
            artifacts/*.sig
            artifacts/*.pem
          if-no-files-found: error

  # ── 5. SLSA L1 provenance ─────────────────────────────────────────────────
  # Runs in a slsa-github-generator-controlled job to establish the attestation.
  provenance:
    needs: [hash]
    permissions:
      actions: read
      id-token: write
      contents: write   # needed to upload .intoto.jsonl to the draft release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.hash.outputs.hashes }}"
      upload-assets: true

  # ── 6. Publish GitHub Release ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [sign, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts (binaries + SBOM + signatures + provenance)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/hearth-linux-amd64
            dist/hearth-linux-arm64
            dist/hearth-darwin-amd64
            dist/hearth-darwin-arm64
            dist/hearth-sbom.cdx.json
            dist/*.sig
            dist/*.pem
          generate_release_notes: true
          fail_on_unmatched_files: true
