version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
  - package-ecosystem: "npm"
    directory: "/sdks/node"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "sdk-node"
    commit-message:
      prefix: "chore(deps)"
    groups:
      node-sdk-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # GA audit: Dependabot treats github/codeql-action/{init,autobuild,
      # analyze,upload-sarif} as separate dependencies. PR #333 bumped only
      # `analyze` to 4.37.8 while `init` stayed on 4.36.2, and every CodeQL job
      # then failed with "Loaded a configuration file for version '4.36.2', but
      # running version '4.37.8'". The sub-actions must move together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
