# PostgreSQL settings for every product of the comparison that needs
# PostgreSQL (#913): one version (images.env) and this one file. The product
# and its database share one server (c7i.large: 2 vCPU, 4 GiB).
#
# Everything not set here is PostgreSQL 18's default.

listen_addresses = '*'
# Above Keycloak's pool of 30 and the other products' pools, with room for psql.
max_connections = 200

# Durable writes, as Hearth's fsync per write: a commit is acknowledged only
# after its WAL is flushed to disk. These are the defaults; they are written
# out so that no product's guide can turn them off unnoticed.
fsync = on
synchronous_commit = on
full_page_writes = on

# PostgreSQL's guide starts shared_buffers at 25 % of the memory of a
# dedicated database server. Here the product runs on the same 4 GiB server,
# so one eighth.
shared_buffers = 512MB

# Logs to the container's stderr (docker logs).
log_min_duration_statement = -1
log_checkpoints = on
