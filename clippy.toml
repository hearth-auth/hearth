cognitive-complexity-threshold = 25

# crossbeam-skiplist 0.1.3: the range iterator keeps a reference on each entry
# it passes and never gives it back, so an entry that a later write replaces is
# never freed (#445; fixed upstream in crossbeam-rs/crossbeam#1217, unreleased).
disallowed-methods = [
    { path = "crossbeam_skiplist::map::SkipMap::range", reason = "leaks every entry it passes in crossbeam-skiplist 0.1.3 (#445): walk with `lower_bound` and `Entry::next` (see `memtable::entries_from`)" },
    { path = "crossbeam_skiplist::set::SkipSet::range", reason = "leaks every entry it passes in crossbeam-skiplist 0.1.3 (#445): walk with `lower_bound` and `Entry::next`" },
]
