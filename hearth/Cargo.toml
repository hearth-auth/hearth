[package]
name = "hearth"
version = "0.1.0"
edition = "2021"

[[test]]
name = "cluster_smoke"
path = "tests/cluster_smoke.rs"

[dependencies]
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
