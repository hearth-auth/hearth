[package]
name = "hearth"
version = "0.1.0"
edition = "2021"

[[test]]
name = "cluster_smoke"
path = "tests/cluster_smoke.rs"

[[test]]
name = "snapshot_join"
path = "tests/snapshot_join.rs"

[[test]]
name = "chaos"
path = "tests/chaos.rs"

[[test]]
name = "cluster_admin_endpoints"
path = "tests/cluster_admin_endpoints.rs"

[dependencies]
openraft = { version = "0.9", features = ["serde", "storage-v2", "loosen-follower-log-revert"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
anyhow = "1"
thiserror = "1"
zstd = "0.13"
axum = { version = "0.7", features = ["json"] }
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
