    get:
      summary: List a group's members
      operationId: adminListGroupMembers
      tags: [Admin]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: A page of members
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminGroupMemberPage'}}}
        "404": {description: No such group in the realm}
    post:
      summary: Add a member to a group
      operationId: adminAddGroupMember
      tags: [Admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminAddGroupMemberRequest'}}}
      responses:
        "201":
          description: The new membership
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminGroupMembership'}}}
        "400": {description: Invalid member type or id}
        "404": {description: No such group in the realm}
  /admin/users/{id}/roles:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
