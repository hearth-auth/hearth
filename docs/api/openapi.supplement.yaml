      summary: List a user's role assignments
      operationId: adminListUserAssignments
      tags: [Admin]
      responses:
        "200":
          description: The user's direct role assignments
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminRoleAssignmentList'}}}
        "404": {description: No such user in the realm}
    post:
      summary: Assign a role to a user
      description: Realm-wide, or inside one organization when `org_id` is set.
      operationId: adminAssignUserRole
      tags: [Admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminAssignRoleRequest'}}}
      responses:
        "201":
          description: The new assignment
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminRoleAssignment'}}}
        "403": {description: The role holds permissions the caller lacks}
        "404": {description: No such user or role in the realm}
  /admin/audit:
    get:
      summary: List audit events
      description: Requires `hearth.realm.admin`. Newest first.
      operationId: adminListAuditEvents
      tags: [Admin]
      parameters:
        - {name: actor, in: query, schema: {type: string}}
        - {name: action, in: query, description: "An audit action name, e.g. `UserCreated`.", schema: {type: string}}
        - {name: start_time, in: query, description: Microseconds since the Unix epoch., schema: {type: integer, format: int64}}
        - {name: end_time, in: query, description: Microseconds since the Unix epoch., schema: {type: integer, format: int64}}
        - {name: limit, in: query, description: "Default 50, at most 200.", schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Matching audit events
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminAuditEventList'}}}
        "400": {description: "`start_time` is after `end_time`"}
  /admin/groups/{id}/members/{member_id}:
    delete:
      summary: Remove a member from a group
      operationId: adminRemoveGroupMember
      tags: [Admin]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: member_id, in: path, required: true, schema: {type: string}}
        - name: type
          in: query
          required: false
          description: Member kind; defaults to `user`.
          schema: {type: string, enum: [user, group], default: user}
      responses:
        "204":
          description: Member removed
        "400":
          description: Invalid member type

  /admin/groups/{id}/roles:
    post:
      summary: Assign a role to a group
      description: "Body: `{role_id, org_id?}`. Same ceiling and org-existence rules as `POST /admin/users/{id}/roles`. Unassign with `DELETE /admin/assignments/{id}`."
      operationId: adminAssignGroupRole
      tags: [Admin]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "201": {description: The role assignment}
        "403": {description: The role holds permissions the caller lacks}
        "404": {description: No such group or organization}
  /admin/roles/{id}/members:
    get:
      summary: List the users and groups holding a role
      operationId: adminListRoleMembers
      tags: [Admin]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        "200": {description: "`{items: [{subject_type, subject_id}], next_cursor}`"}
  /admin/users/{id}/permissions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: List a user's direct permission grants
      operationId: adminListUserPermissions
      tags: [Admin]
      responses:
        "200": {description: "`{items: [{permission, scope_type, org_id, granted_by, granted_at}]}`"}
    post:
      summary: Grant a permission directly to a user
      description: "Body: `{permission, org_id?}`. A sub-admin may grant only a permission it holds; `granted_by` is the caller."
      operationId: adminGrantUserPermission
      tags: [Admin]
      responses:
        "201": {description: The grant}
        "403": {description: The caller does not hold the permission}
        "404": {description: No such user or organization}
  /admin/users/{id}/permissions/{permission}:
    delete:
      summary: Revoke a direct permission grant
      description: Add `?org_id=` for an org-scoped grant. Checked against the admin privilege ceiling.
      operationId: adminRevokeUserPermission
      tags: [Admin]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: permission, in: path, required: true, schema: {type: string}}
        - {name: org_id, in: query, schema: {type: string}}
      responses:
        "204": {description: Revoked}
        "403": {description: Admin privilege ceiling}
  /admin/permissions:
    get:
      summary: List the realm's permission registry
      operationId: adminListPermissions
      tags: [Admin]
      responses:
        "200": {description: "`{items: [{name, status}]}`"}
  /admin/audit/verify:
    post:
      summary: Verify the realm's audit hash chain
      operationId: adminVerifyAudit
      tags: [Admin]
      responses:
        "200": {description: "`{ok, event_count}`"}

