  # ── Admin — backup / restore ──────────────────────────────────────────────
  /admin/backup:
    post:
      summary: Create a backup
      operationId: adminBackupCreate
      tags: [Admin]
      responses:
        "200":
          description: Backup archive

  /admin/backup/restore:
    post:
      summary: Restore from a backup
      operationId: adminBackupRestore
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Restore complete

  # ── Admin — cluster ───────────────────────────────────────────────────────
  /admin/cluster/bootstrap:
    post:
      summary: Bootstrap the Raft cluster
      operationId: adminClusterBootstrap
      tags: [Cluster]
      responses:
        "200":
          description: Cluster bootstrapped

  /admin/cluster/status:
    get:
      summary: Raft cluster status
      operationId: adminClusterStatus
      tags: [Cluster]
      responses:
        "200":
          description: Cluster status

  /admin/cluster/transfer-leadership:
    post:
      summary: Step the Raft leader down
      description: >-
        Steps this node down so another voter wins the next election. This is
        not a targeted transfer: the pinned Raft library cannot choose the
        winner, so a body naming target_node_id is refused with 422, and a body
        with any other field is refused with 400.
      operationId: adminClusterTransferLeadership
      tags: [Cluster]
      responses:
        "200":
          description: >-
            Another voter now leads; body is {"new_leader_id":<u64>,"exact_target":false}.
            exact_target is deprecated and always false (a request naming a target
            is refused with 422).
        "400":
          description: Body is not valid JSON or contains an unknown field
        "409":
          description: This node is not the leader
        "422":
          description: target_node_id was supplied; targeted leadership transfer is not supported
        "503":
          description: Not in cluster mode

  # ── Admin — organizations (3.0.0; formerly gRPC-only) ──────────────────
  /admin/organizations:
    get:
      summary: List organizations
      description: Requires `hearth.realm.admin`. `cursor` is a decimal offset; follow `next_cursor` until it is null.
      operationId: adminListOrganizations
      tags: [Admin]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: A page of organizations; `next_cursor` is null on the last page
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrganizationPage'}}}
    post:
      summary: Create an organization
      description: "Requires `hearth.realm.admin`. Body: `{slug, display_name, member_limit?, mfa_required?, attributes?}`. `mfa_required` (default `false`) makes members need MFA even where the realm does not; it can only tighten. Refused in the system realm."
      operationId: adminCreateOrganization
      tags: [Admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminCreateOrganizationRequest'}}}
      responses:
        "201":
          description: The created organization
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrganization'}}}
        "403": {description: "Missing `hearth.realm.admin`, or the system realm"}
  /admin/organizations/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: Get an organization
      operationId: adminGetOrganization
      tags: [Admin]
      responses:
        "200":
          description: The organization
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrganization'}}}
        "404": {description: No such organization in the realm}
    patch:
      summary: Update an organization
      description: "Body: `{display_name?, status? (active|suspended), member_limit?, mfa_required?, attributes?}`. A field left out keeps its value. A `slug` is refused with 400 (it is immutable). Suspending is checked against the admin privilege ceiling, like a delete."
      operationId: adminUpdateOrganization
      tags: [Admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminUpdateOrganizationRequest'}}}
      responses:
        "200":
          description: The updated organization
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrganization'}}}
        "400": {description: A slug change or an unknown status}
        "403": {description: A member holds admin authority the caller lacks}
    delete:
      summary: Delete an organization
      description: Refused when a member holds admin authority in the organization that the caller lacks.
      operationId: adminDeleteOrganization
      tags: [Admin]
      responses:
        "204": {description: Deleted}
        "403": {description: Admin privilege ceiling}
  /admin/organizations/{id}/members/{user_id}/roles:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: user_id, in: path, required: true, schema: {type: string}}
    get:
      summary: List a member's extra org roles
      operationId: adminListAdditionalRoles
      tags: [Admin]
      responses:
        "200":
          description: The member's extra org role names
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminRoleNameList'}}}
    post:
      summary: Give a member an extra org role
      description: "Body: `{role_name}`. The user must be a member (409 otherwise); a sub-admin may only give roles within its own permissions."
      operationId: adminAddAdditionalRole
      tags: [Admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminAddAdditionalRoleRequest'}}}
      responses:
        "204": {description: Added}
        "403": {description: The role holds permissions the caller lacks}
        "404": {description: "No such organization, user or role"}
        "409": {description: The user is not a member of the organization}
  /admin/organizations/{id}/members/{user_id}/roles/{role_name}:
    delete:
      summary: Remove a member's extra org role
      description: Checked against the admin privilege ceiling.
      operationId: adminRemoveAdditionalRole
      tags: [Admin]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: user_id, in: path, required: true, schema: {type: string}}
        - {name: role_name, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Removed}

  # ── Admin — RBAC extras (3.0.0; formerly gRPC-only) ────────────────────
  /admin/roles:
    get:
      summary: List roles
      description: Requires `hearth.realm.admin`. Follow `next_cursor` until it is null.
      operationId: adminListRoles
      tags: [Admin]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: A page of roles
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminRolePage'}}}
    post:
      summary: Create a role
      operationId: adminCreateRole
      tags: [Admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminCreateRoleRequest'}}}
      responses:
        "201":
          description: The created role
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminRole'}}}
        "400": {description: "Invalid name, permission or parent role"}
        "409": {description: A role with this name exists}
  /admin/roles/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: Get a role
      operationId: adminGetRole
      tags: [Admin]
      responses:
        "200":
          description: The role
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminRole'}}}
        "404": {description: No such role in the realm}
    patch:
      summary: Update a role
      description: Absent fields are unchanged; `description` null clears it.
      operationId: adminUpdateRole
      tags: [Admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminUpdateRoleRequest'}}}
      responses:
        "200":
          description: The updated role
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminRole'}}}
        "404": {description: No such role in the realm}
    delete:
      summary: Delete a role
      operationId: adminDeleteRole
      tags: [Admin]
      parameters:
        - name: cascade
          in: query
          description: Also remove the role's assignments, parent links and extra org-role rows. Without it a referenced role answers `409 role_in_use`.
          schema: {type: boolean, default: false}
      responses:
        "204": {description: Deleted}
        "404": {description: No such role in the realm}
        "409": {description: The role is in use and `cascade` is not set}
  /admin/groups:
    get:
      summary: List groups
      description: "`cursor` is a decimal offset; follow `next_cursor` until it is null."
      operationId: adminListGroups
      tags: [Admin]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: A page of groups
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminGroupPage'}}}
    post:
      summary: Create a group
      operationId: adminCreateGroup
      tags: [Admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminCreateGroupRequest'}}}
      responses:
        "201":
          description: The created group
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminGroup'}}}
        "409": {description: A group with this slug exists}
  /admin/groups/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: Get a group
      operationId: adminGetGroup
      tags: [Admin]
      responses:
        "200":
          description: The group
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminGroup'}}}
        "404": {description: No such group in the realm}
    patch:
      summary: Update a group
      description: Absent fields are unchanged; `description` null clears it.
      operationId: adminUpdateGroup
      tags: [Admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminUpdateGroupRequest'}}}
      responses:
        "200":
          description: The updated group
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminGroup'}}}
        "404": {description: No such group in the realm}
    delete:
      summary: Delete a group
      operationId: adminDeleteGroup
      tags: [Admin]
      responses:
        "204": {description: Deleted}
        "404": {description: No such group in the realm}
  /admin/groups/{id}/members:
