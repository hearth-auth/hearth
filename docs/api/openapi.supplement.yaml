        "200":
          description: Merged OpenAPI 3.0 specification
          content:
            text/yaml:
              schema:
                type: string

  /docs:
    get:
      summary: Swagger UI
      operationId: swaggerUi
      tags: [Docs]
      responses:
        "200":
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

components:
  schemas:
    # RBAC admin shapes: the serde form of src/rbac/types.rs (snake_case).
    AdminRole:
      type: object
      required: [id, realm_id, name, description, permissions, parent_roles, scope_kind, status, yaml_managed, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        realm_id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, nullable: true}
        permissions: {type: array, items: {type: string}}
        parent_roles: {type: array, items: {type: string, format: uuid}}
        scope_kind: {type: string, enum: [realm, organization, any]}
        status: {type: string, enum: [active, archived]}
        yaml_managed:
          type: boolean
          description: Declared in hearth.yaml; the admin API cannot change it.
        created_at: {type: integer, format: int64, description: Microseconds since the Unix epoch.}
        updated_at: {type: integer, format: int64, description: Microseconds since the Unix epoch.}
    AdminRolePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminRole'}}
        next_cursor: {type: string, nullable: true}
    AdminCreateRoleRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string, nullable: true}
        permissions: {type: array, items: {type: string}}
        parent_roles: {type: array, items: {type: string, format: uuid}}
    AdminUpdateRoleRequest:
      type: object
      description: Absent fields are unchanged.
      properties:
        name: {type: string}
        description: {type: string, nullable: true, description: null clears the description.}
        permissions: {type: array, items: {type: string}}
        parent_roles: {type: array, items: {type: string, format: uuid}}
    AdminGroup:
      type: object
      required: [id, realm_id, name, slug, description, yaml_managed, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        realm_id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        description: {type: string, nullable: true}
        yaml_managed:
          type: boolean
          description: Declared in hearth.yaml; the admin API cannot change or delete it.
        created_at: {type: integer, format: int64, description: Microseconds since the Unix epoch.}
        updated_at: {type: integer, format: int64, description: Microseconds since the Unix epoch.}
    AdminGroupPage:
      type: object
      required: [items, next_cursor, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminGroup'}}
        next_cursor: {type: string, nullable: true}
        total: {type: integer, format: int64}
    AdminCreateGroupRequest:
      type: object
      required: [name, slug]
      properties:
        name: {type: string}
        slug: {type: string}
        description: {type: string, nullable: true}
    AdminUpdateGroupRequest:
      type: object
      description: Absent fields are unchanged.
      properties:
        name: {type: string}
        slug: {type: string}
        description: {type: string, nullable: true, description: null clears the description.}
    AdminSubject:
      type: object
      description: A user or a group, as a group member or a role-assignment subject.
      required: [type, id]
      properties:
        type: {type: string, enum: [user, group]}
        id: {type: string, format: uuid}
    AdminGroupMembership:
      type: object
      required: [group_id, member, added_at, added_by]
      properties:
        group_id: {type: string, format: uuid}
        member: {$ref: '#/components/schemas/AdminSubject'}
        added_at: {type: integer, format: int64, description: Microseconds since the Unix epoch.}
        added_by: {type: string, format: uuid, nullable: true}
    AdminGroupMemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminSubject'}}
        next_cursor: {type: string, nullable: true}
    AdminAddGroupMemberRequest:
      type: object
      required: [type, id]
      properties:
        type: {type: string, enum: [user, group]}
        id: {type: string, format: uuid}
    AdminAssignmentScope:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [realm, org]}
        org_id: {type: string, format: uuid, description: Present when `type` is `org`.}
    AdminRoleAssignment:
      type: object
      required: [id, realm_id, subject, role_id, scope, assigned_at, assigned_by]
      properties:
        id: {type: string, format: uuid}
        realm_id: {type: string, format: uuid}
        subject: {$ref: '#/components/schemas/AdminSubject'}
        role_id: {type: string, format: uuid}
        scope: {$ref: '#/components/schemas/AdminAssignmentScope'}
        assigned_at: {type: integer, format: int64, description: Microseconds since the Unix epoch.}
        assigned_by: {type: string, format: uuid, nullable: true}
    AdminRoleAssignmentList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminRoleAssignment'}}
    AdminAssignRoleRequest:
      type: object
      required: [role_id]
      properties:
        role_id: {type: string, format: uuid}
        org_id:
          type: string
          format: uuid
          nullable: true
          description: Assign inside this organization only; absent or null assigns realm-wide.
    # The audit log's serde form (src/audit/types.rs `AuditEvent`).
    AdminAuditEvent:
      type: object
      required: [id, realm_id, actor, action, resource_type, resource_id, timestamp, integrity_hash]
      properties:
        id: {type: string}
        realm_id: {type: string, format: uuid}
        actor: {type: string}
        action: {type: string, description: "The audit action name, e.g. `UserCreated`."}
        resource_type: {type: string}
        resource_id: {type: string}
        timestamp: {type: integer, format: int64, description: Microseconds since the Unix epoch.}
        metadata: {type: object, additionalProperties: true, description: Present only when the event carries metadata.}
        integrity_hash: {type: string}
    AdminAuditEventList:
      type: object
      required: [events]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/AdminAuditEvent'}}
    # Hand-written REST shapes (snake_case JSON). The proto `v1Organization`
    # messages do not describe what `src/protocol/http/admin/orgs.rs` serves.
    AdminOrganization:
      type: object
      required: [id, slug, display_name, status, mfa_required, attributes, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        display_name: {type: string}
        status: {type: string, enum: [active, suspended, archived]}
        member_limit: {type: integer, format: int32, minimum: 0, nullable: true}
        mfa_required:
          type: boolean
          description: Members need MFA even where the realm does not require it.
        attributes: {type: object, additionalProperties: {type: string}}
        created_at: {type: integer, format: int64, description: Microseconds since the Unix epoch.}
        updated_at: {type: integer, format: int64, description: Microseconds since the Unix epoch.}
    AdminOrganizationPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminOrganization'}}
        next_cursor: {type: string, nullable: true}
    AdminCreateOrganizationRequest:
      type: object
      required: [slug, display_name]
      properties:
        slug: {type: string}
        display_name: {type: string}
        member_limit: {type: integer, format: int32, minimum: 0, nullable: true}
        mfa_required: {type: boolean, default: false}
        attributes: {type: object, additionalProperties: {type: string}}
    AdminUpdateOrganizationRequest:
      type: object
      description: Absent fields are unchanged. `slug` is immutable and is refused with 400.
      properties:
        display_name: {type: string}
        status: {type: string, enum: [active, suspended]}
        member_limit: {type: integer, format: int32, minimum: 0, nullable: true}
        mfa_required: {type: boolean}
        attributes:
          type: object
          additionalProperties: {type: string}
          description: Replaces the whole attribute map.
    AdminAddAdditionalRoleRequest:
      type: object
      required: [role_name]
      properties:
        role_name: {type: string}
    AdminRoleNameList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: string}}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
