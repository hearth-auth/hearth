# ============================================================================
# Hearth — 100% feature-coverage config for admin-UI exercise/test.
# Single-node, --dev-friendly. Set env vars below before booting.
# ============================================================================
#
# Required env vars (export before `cargo run -- serve -c hearth.yaml`):
#   HEARTH_MASTER_KEY                                  (envelope encryption)
#   HEARTH_KEK                                         (security.key_encryption_key)
#   HEARTH_DPOP_NONCE_SECRET                           (DPoP nonce HMAC)
#   HEARTH_PASSWORD_PEPPER_KEY_HEX                     (active password pepper)
#   HEARTH_PASSWORD_PEPPER_PREVIOUS_KEY_HEX            (previous password pepper)
#   HEARTH_BACKUP_VERIFY_KEY                           (base64url Ed25519 pubkey)
#   TURNSTILE_SECRET_KEY                               (CAPTCHA verification)
#   HEARTH_SMS_OTP_HMAC_KEY                            (SMS OTP HMAC)
#   HEARTH_REALM_CUSTOMER_PORTAL_FINGERPRINT_HMAC_SECRET
#   HEARTH_REALM_INTERNAL_TOOLS_FINGERPRINT_HMAC_SECRET
#   SMTP_USERNAME / SMTP_PASSWORD
#   SENDGRID_API_KEY / POSTMARK_SERVER_TOKEN / MAILGUN_API_KEY / MAILTRAP_API_KEY
#   TWILIO_AUTH_TOKEN / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#   INTERNAL_API_SECRET / DASHBOARD_CLIENT_SECRET / API_GATEWAY_SECRET
#   GOOGLE_CLIENT_SECRET / MICROSOFT_CLIENT_SECRET / GITHUB_CLIENT_SECRET
#   OKTA_CLIENT_SECRET
#   SCIM_BEARER_CUSTOMER / SCIM_BEARER_INTERNAL
# Generate any HMAC/master key with: openssl rand -hex 32
# ============================================================================

server:
  bind_address: "127.0.0.1"
  port: 8420
  # --- TLS (uncomment with real paths to exercise HTTPS + auto HTTP→HTTPS redirect) ---
  # tls_cert_path: "./tls/server.crt"
  # tls_key_path:  "./tls/server.key"
  # tls_client_ca_path: "./tls/clients-ca.crt"
  # tls_require_client_cert: false
  trusted_proxies:
    - "127.0.0.1"
    - "10.0.0.1"
  trust_forwarded_proto: true
  default_realm: "customer-portal"
  grpc_port: 8421
  grpc_bind_address: "127.0.0.1"
  assets_dir: "./src/protocol/web/assets"

storage:
  data_dir: "./data"
  wal_max_size_bytes: 268435456            # 256 MiB
  memtable_flush_bytes: 67108864           # 64 MiB
  hot_tier_capacity: 10000                 # explicit (disables auto-sizing)
  # hot_tier_max_memory: 536870912          # 512 MiB — ignored when hot_tier_capacity is set
  fsync: true
  compaction:
    enabled: true
    interval_secs: 3600
    min_sst_count: 3

observability:
  log_level: "debug"
  log_format: "json"
  otlp:
    protocol: grpc                          # grpc | http
    endpoint: "http://localhost:4317"
    service_name: "hearth"
    headers:
      Authorization: "Bearer ${OTLP_TOKEN:-dev-token}"

operational:
  request_timeout_secs: 30
  shutdown_timeout_secs: 10
  max_connections: 1024
  queue_depth: 4096

metrics:
  enabled: true

branding:
  product_name: "Acme Identity"
  logo_url: "/ui/static/img/hearth-wide-web.svg"
  theme: ember                              # ember | ocean | midnight | forest | cloud | slate
  custom_css: "./ui/brand.css"

# ----------------------------------------------------------------------------
# EMAIL — exercising SMTP (the others are commented to demo their shape).
# Only one transport is active at a time; comment one out to switch.
# ----------------------------------------------------------------------------
email:
  transport: smtp                           # log | mailcatcher | smtp | sendgrid | postmark | mailgun | mailtrap
  from: "Acme Identity <noreply@example.com>"
  smtp:
    host: "localhost"
    port: 1025
    encryption: starttls                    # none | starttls | tls
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
  # sendgrid: { api_key: "${SENDGRID_API_KEY}" }
  # postmark: { server_token: "${POSTMARK_SERVER_TOKEN}" }
  # mailgun:  { api_key: "${MAILGUN_API_KEY}", domain: "mg.example.com", region: eu }
  # mailtrap: { api_key: "${MAILTRAP_API_KEY}", inbox_id: 12345 }
  branding:
    accent_color: "#E85D04"
    support_email: "support@example.com"
    custom_footer_text: "© 2026 Acme Corp. All rights reserved."
  templates_dir: "./templates/email"

# ----------------------------------------------------------------------------
# SMS — Twilio active; AWS SNS commented for shape reference.
# ----------------------------------------------------------------------------
sms:
  transport: twilio                         # log | twilio | awssns
  twilio:
    account_sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    auth_token: "${TWILIO_AUTH_TOKEN}"
    from: "+15550001111"
  # aws_sns:
  #   region: "us-east-1"
  #   access_key_id: "${AWS_ACCESS_KEY_ID}"
  #   secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  #   sender_id: "Acme"

oidc:
  issuer: "https://auth.example.com"
  authorization_code_ttl: "10m"
  enforce_nonces: true
  require_pkce_for_confidential_clients: true

token:
  issuer: "https://auth.example.com"
  audience: "https://api.example.com"
  access_token_ttl: "15m"
  refresh_token_ttl: "7d"
  signing_key_rotation_grace_period: "24h"

# ============================================================================
# SECURITY — every leaf key in the `security.*` liveness registry
# (src/config/security_keys.rs) appears below. A key that is absent here cannot
# be discovered by an operator reading the "maximal" example, so
# tests/config_maximal_coverage.rs fails the build when one goes missing.
# Values are the shipped defaults unless a comment says otherwise.
# ============================================================================
security:
  # --- Host / origin allowlists ---------------------------------------------
  # Empty list = fail-open (any Host accepted). Listed hosts are matched
  # verbatim against the request's Host header, port included.
  allowed_hosts:
    - "auth.example.com"
    - "127.0.0.1:8420"
    - "localhost:8420"
  # Origins a `return_to` / post-logout redirect may point at.
  allowed_return_to_origins:
    - "https://app.example.com"
    - "https://admin.example.com"
  # Extra `form-action` CSP origins accepted ONLY while `--dev` is in force.
  dev_csp_form_action_origins:
    - "http://localhost:5173"
    - "http://localhost:5399"

  # --- Realm-slug abuse controls --------------------------------------------
  # Omitting `reserved_slugs` entirely used to mean "[]" — i.e. the control off.
  # Spell the list out so the intent is on the page.
  reserved_slugs:
    [admin, api, support, www, mail, help, status, blog, app, auth,
     login, logout, signup, register, account, profile, settings,
     dashboard, billing, security, webhook, callback, oauth, oidc,
     saml, scim]
  slug_cooldown_days: 30                    # re-registration cooldown

  # --- Key material (all 64-char lowercase hex; openssl rand -hex 32) --------
  key_encryption_key: "${HEARTH_KEK}"       # envelope-encryption KEK
  dpop_nonce_secret: "${HEARTH_DPOP_NONCE_SECRET}"

  # --- Public-endpoint throttles --------------------------------------------
  jwks_rps_limit: 60                        # /.well-known/jwks.json, per IP
  load_test_unthrottled: false              # NEVER true outside a private rig

  grpc:
    reflection_enabled: false               # keep the schema off the wire
  http2:
    max_concurrent_streams: 100             # CVE-2023-44487 rapid-reset caps
    max_pending_reset_streams: 10
  tls:
    min_version: "1.2"                      # "1.2" | "1.3"
    crl_paths: []                           # e.g. ["/etc/hearth/clients.crl"]
  backup:
    verify_key: "${HEARTH_BACKUP_VERIFY_KEY}"   # base64url Ed25519 public key
    export_rate_limit: 5                    # backup exports per hour per admin

  rate_limiting:
    login_per_ip:
      max_attempts: 10
      window_seconds: 60
    login_per_account:
      max_failures: 5
      lockout_seconds: 300
    admin_per_minute: 100                   # 0 disables — load rigs only
    token_per_minute: 200                   # per (realm, client); 0 disables

  request_shaper:
    ip_rps: 100
    realm_rps: 1000

  password:
    kdf:                                    # Argon2id admission control
      max_in_flight: 8                      # null = host core count
      max_queue_wait_ms: 250                # then 503 + Retry-After
      admin_max_in_flight: 2                # reserved pool for admin login
      admin_max_queue_wait_ms: 2000         # admin prefers queueing to shedding
      retry_after_seconds: 1
    pepper:                                 # keyed hash applied before Argon2id
      version: 2
      key_hex: "${HEARTH_PASSWORD_PEPPER_KEY_HEX}"
      previous_version: 1                   # must differ from `version`
      previous_key_hex: "${HEARTH_PASSWORD_PEPPER_PREVIOUS_KEY_HEX}"

  ip_reputation:
    enabled: true
    action: log                             # block | challenge | log
    maxmind_db_path: "/etc/hearth/GeoLite2-ASN.mmdb"
    spamhaus:
      drop_url: "https://www.spamhaus.org/drop/drop.txt"
      dropv6_url: "https://www.spamhaus.org/drop/dropv6.txt"
      refresh_interval_secs: 86400

  captcha:
    provider: turnstile                     # only adapter shipped today
    challenge_threshold: 25                 # failures in `window_secs` per IP
    window_secs: 60
    challenge_ttl_secs: 1800
    turnstile:
      site_key: "1x00000000000000000000AA"  # Cloudflare's always-passes test key
      secret_key: "${TURNSTILE_SECRET_KEY}"
      verify_url: "https://challenges.cloudflare.com/turnstile/v0/siteverify"

  # --- Abuse guards constructed on the production path (audit §4.17#9) ------
  tarpit:
    threshold: 10                           # null disables the tarpit
    window_secs: 60
    delay_ms: 200                           # injected delay past the threshold
  adaptive_backoff:
    durations: ["1m", "5m", "30m", "24h"]   # nth offence -> nth duration
    offense_cooldown: "7d"                  # clean streak that resets the ladder
  distributed_attack_detector:
    enabled: true
    window: "300s"
    username_per_ip_threshold: 20           # distinct usernames from one IP
    ip_per_username_threshold: 20           # distinct IPs against one username
  outbound_volume_shield:
    enabled: true
    window: "3600s"
    email_soft_cap: 1000                    # soft = alert, hard = refuse
    email_hard_cap: 5000
    sms_soft_cap: 100
    sms_hard_cap: 500
  cross_realm_aggregation_cap:
    enabled: true
    window: "3600s"
    alert_threshold: 3                      # realms breaching before an alert
    email_realm_soft_cap: 5
    email_realm_hard_cap: 10
    sms_realm_soft_cap: 3
    sms_realm_hard_cap: 6
  risk_scorer:
    enabled: true
    step_up_threshold: 0.5                  # score at/above which MFA is forced
    new_device_weight: 0.3
    new_country_weight: 0.4
    password_age_weight: 0.2
    password_age_days_threshold: 365
    breach_corpus_weight: 1.0
    refresh_context_delta_weight: 0.35
  providers:
    bot_signal:
      enabled: true
      extra_ja3_blocklist:
        - "deadbeef00000000deadbeef00000000"
      extra_ja4_blocklist:
        - "t13d1516h2_8daaf6152771_02713d6af862"
    email_reputation:
      enabled: true
      extra_disposable_domains:
        - "mailinator.com"
        - "10minutemail.com"

auth:
  session_ttl: "24h"
  password_memory_cost: 65536               # KiB
  password_time_cost: 3
  mfa_required: false
  mfa_methods: [totp, webauthn]             # restricts BOTH enrolment and presentation
  passkey_requires_mfa: false
  session_max_concurrent: 5
  session_over_limit_policy: "reject_new"   # reject_new | evict_oldest
  # Global WebAuthn defaults; every realm inherits these unless it overrides
  # them under `realms.<name>.auth.webauthn_*`.
  webauthn_required: false                  # true = every user must hold a passkey
  webauthn_resident_key: "preferred"        # required | preferred | discouraged
  webauthn_user_verification: "required"    # "required" is what makes a passkey a
                                            # genuine second factor (audit B10)

onboarding:
  enabled: true
  base_url: "https://auth.example.com"
  notification_email: "ops@example.com"

# ============================================================================
# REALMS — four realms, each exercising a different slice of features.
# ============================================================================
realms:

  # --------------------------------------------------------------------------
  # 1) customer-portal — public B2C/B2B SaaS realm.
  #    Self-registration, MFA, organizations, OAuth code+PKCE, federation,
  #    SCIM provisioning, custom attributes, adaptive MFA, declarative RBAC.
  # --------------------------------------------------------------------------
  customer-portal:
    session_ttl: "12h"
    session_max_concurrent: 3
    session_over_limit_policy: "evict_oldest"
    password_memory_cost: 65536
    password_time_cost: 3
    rotate_signing_key: false               # set true once to rotate, auto-cleared
    email:
      branding:
        accent_color: "#2563EB"
        support_email: "help@customer.example.com"
        custom_footer_text: "Customer Portal — support@customer.example.com"
    web:
      theme: cloud                          # light theme
      custom_css: "/etc/hearth/customer-portal.css"
      product_name: "Customer Portal"
    auth:
      mfa_required: true
      passkey_requires_mfa: false
      mfa_methods: [totp, webauthn]
      allowed_auth_methods: [password, magic_link, passkey]
      # Per-realm WebAuthn policy; overrides the global `auth.webauthn_*`.
      webauthn_required: false              # B2C realm: passkeys offered, not forced
      webauthn_resident_key: "preferred"    # required | preferred | discouraged
      webauthn_user_verification: "required"
      registration:
        mode: domain_restricted             # disabled | open | invite_only | domain_restricted
        allowed_domains: [example.com, partners.example.com]
      dcr:
        mode: open                          # disabled | open
      password_policy:
        min_length: 12
        require_uppercase: true
        require_number: true
        require_special: true
        not_username: true
        not_email: true
        history_depth: 5
        max_age_days: 90
      token:
        access_token_ttl: "30m"
        refresh_token_ttl: "14d"
        password_reset_token_ttl: "1h"
      rate_limit:
        max_failed_logins: 5
        lockout_duration: "15m"
      # `adaptive_mfa` is NOT a hearth.yaml key. The feature exists and is enforced
      # at runtime, but there is no YAML (or admin API) surface for it — a config
      # file containing this block is rejected at startup by deny_unknown_fields.
      # See docs/specs/CONFIGURATION.md § realms.<name>.auth.adaptive_mfa.
      #   adaptive_mfa:
      #     enabled: true
      #     recognition_window_days: 30
      #     fingerprint_hmac_secret: "${HEARTH_REALM_CUSTOMER_PORTAL_FINGERPRINT_HMAC_SECRET}"
    scim:
      bearer_token: "${SCIM_BEARER_CUSTOMER}"
    attribute_definitions:
      users:
        - { key: department, label: Department, type: string, required: false, description: "Business department" }
        - { key: employee_id, label: Employee ID, type: string, required: true }
        - { key: office_count, label: Office Count, type: number, required: false }
        - { key: is_contractor, label: Is Contractor, type: boolean, required: false }
        - key: tier
          label: Subscription Tier
          type: enum
          required: false
          enum_values: [free, pro, enterprise]
      organizations:
        - { key: crm_id, label: CRM ID, type: string }
        - key: contract_tier
          label: Contract Tier
          type: enum
          enum_values: [starter, growth, enterprise]
        - { key: max_seats, label: Licensed Seats, type: number }
    organizations:
      acme-corp:
        name: "Acme Corporation"
        description: "Flagship enterprise customer"
        config: { max_members: 500 }
      beta-testers:
        name: "Beta Testers"
        description: "Early access program"
        config: { max_members: 50 }
    applications:
      web-app:
        name: "Customer Web App"
        slug: web-app
        confidential: false                 # public client (PKCE required)
        redirect_uris:
          - "https://app.customer.example.com/callback"
          - "http://localhost:3000/callback"
        grant_types: [authorization_code, refresh_token]
        require_consent: true
        client_logo_url: "https://cdn.example.com/logo.png"
        trust_level: third_party            # first_party | third_party
        declared_scopes: [openid, profile, email, billing:manage]
        consent_spans_orgs: false
      mobile-app:
        name: "Customer Mobile App"
        slug: mobile-app
        confidential: false
        redirect_uris: ["com.customer.app://callback"]
        grant_types: [authorization_code, refresh_token, urn:ietf:params:oauth:grant-type:device_code]
        trust_level: third_party
        declared_scopes: [openid, profile, email]
    permissions:
      - { name: billing.read,   display_name: "Read billing",   description: "View invoices and plan",   category: billing }
      - { name: billing.write,  display_name: "Manage billing", description: "Update payment methods",   category: billing }
      - { name: reports.export, display_name: "Export reports", description: "Download CSV/PDF reports", category: analytics }
      - { name: tickets.read,   display_name: "Read tickets",   category: support }
      - { name: tickets.write,  display_name: "Write tickets",  category: support }
    roles:
      - name: support.agent
        description: "Read-only support staff"
        scope_kind: realm                   # realm | organization | any
        permissions: [user.read, org.read, tickets.read, tickets.write, reports.export]
      - name: org.billing_admin
        description: "Org-scoped billing manager"
        scope_kind: organization
        permissions: [billing.read, billing.write]
        parents: [org.admin]
    scopes:
      - name: billing:manage
        display_name: "Billing management"
        description: "Read and write billing data"
        permissions: [billing.read, billing.write]
      - name: support:tickets
        display_name: "Support tickets"
        description: "Read and write tickets"
        permissions: [tickets.read, tickets.write]
    protected_resources:
      - resource_uri: "https://api.customer.example.com"
        display_name: "Customer API"
        scopes:
          - name: api:read
            display_name: "Read API"
            description: "Read-only API access"
            permissions: [user.read, org.read]
          - name: api:write
            display_name: "Write API"
            description: "Mutating API access"
            permissions: [user.write, org.write]
    claims:
      mappings:
        - claim: roles
          source: { source: roles_from_assignments }
          include_in_access_token: true
          include_in_id_token: true
          include_in_userinfo: false
        - claim: groups
          source: { source: groups_from_memberships }
          include_in_access_token: true
          include_in_id_token: true
        - claim: permissions
          source: { source: effective_permissions }
          include_in_access_token: true
          include_in_id_token: false
          required_scopes: [openid]
        - claim: department
          source: { source: user_attribute, attribute: department }
          include_in_access_token: false
          include_in_id_token: true
          include_in_userinfo: true
          first_party_only: false
        - claim: tenant
          source: { source: constant, value: "customer" }
          include_in_access_token: true
        - claim: admin_roles
          source: { source: role_subset, prefix: "support." }
          include_in_access_token: true
          allowed_clients: [web-app]
    groups:
      - { name: "All Customers",  slug: customers,  description: "All customer users" }
      - { name: "Beta Program",   slug: beta,       description: "Beta opt-in users" }
    federation:
      # disabled | confirm | auto
      # WARNING: `auto` links an upstream identity to whatever local account already
      # holds that email address, with NO local re-auth. An IdP that does not verify
      # email (GitHub, or any generic OIDC IdP that can assert email_verified: true)
      # can then take over an existing Hearth account and inherit its roles. Use
      # `auto` only for a single high-trust IdP; `confirm` is the safe default.
      link_existing_accounts: confirm
      providers:
        google:
          type: google
          display_name: "Sign in with Google"
          client_id: "1234567890.apps.googleusercontent.com"
          client_secret: "${GOOGLE_CLIENT_SECRET}"
          scopes: [openid, email, profile]
        microsoft:
          type: microsoft
          display_name: "Sign in with Microsoft"
          issuer: "https://login.microsoftonline.com/common/v2.0"
          client_id: "00000000-0000-0000-0000-000000000000"
          client_secret: "${MICROSOFT_CLIENT_SECRET}"
          claim_mappings: { email: upn, name: preferred_username }
        github:
          type: github
          client_id: "Iv1.github_client_id"
          client_secret: "${GITHUB_CLIENT_SECRET}"
        apple:
          # Sign In with Apple authenticates with an ES256 private_key_jwt
          # assertion, not a static client_secret. All three apple_* fields are
          # required for `type: apple`; startup fails naming any that is missing.
          # `client_id` is the Services ID, not the App ID.
          type: apple
          display_name: "Sign in with Apple"
          client_id: "com.acme.webapp.service"
          apple_team_id: "${APPLE_TEAM_ID}"
          apple_key_id: "${APPLE_KEY_ID}"
          apple_private_key_pem: "${APPLE_PRIVATE_KEY_PEM}"
        okta-saml:
          type: saml
          display_name: "Sign in with Okta (SAML)"
          entity_id: "http://www.okta.com/exk1abc"
          sso_url: "https://acme.okta.com/app/abc/sso/saml"
          slo_url: "https://acme.okta.com/app/abc/slo/saml"
          idp_certificate_pem: |
            -----BEGIN CERTIFICATE-----
            MIID...replace-with-real-cert...IDAQAB
            -----END CERTIFICATE-----
          sign_authn_requests: true
          want_assertions_signed: true
          attribute_map:
            email: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"
            name:  "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name"

  # --------------------------------------------------------------------------
  # 2) internal-tools — enterprise SSO realm.
  #    First-party clients (no consent), SAML SP (Hearth as IdP),
  #    strict Argon2, midnight theme, invite-only registration.
  # --------------------------------------------------------------------------
  internal-tools:
    session_ttl: "8h"
    session_max_concurrent: 10
    password_memory_cost: 131072            # stricter Argon2
    password_time_cost: 4
    web:
      theme: midnight
      product_name: "Acme Internal"
    email:
      branding:
        accent_color: "#7C3AED"
        support_email: "it@example.com"
    scim:
      bearer_token: "${SCIM_BEARER_INTERNAL}"
    # A-9 tenant-managed CIDR policy. Evaluation is deny-then-allow: a `deny`
    # match rejects outright, and a NON-EMPTY `allow` rejects everything it does
    # not contain — so `allow` is left empty here to keep the local demo usable.
    security:
      cidr_policy:
        allow: []                           # e.g. ["10.0.0.0/8", "192.0.2.0/24"]
        deny: ["198.51.100.0/24"]           # TEST-NET-2, a harmless worked example
    auth:
      mfa_required: true
      passkey_requires_mfa: true            # regulated: TOTP even after passkey
      mfa_methods: [totp, webauthn]
      allowed_auth_methods: [password, passkey]
      # Regulated realm: a passkey is mandatory and must be discoverable +
      # user-verified.
      webauthn_required: true
      webauthn_resident_key: "required"
      webauthn_user_verification: "required"
      registration:
        mode: invite_only
      dcr:
        mode: disabled
      password_policy:
        min_length: 16
        require_uppercase: true
        require_number: true
        require_special: true
        not_username: true
        not_email: true
        history_depth: 10
        max_age_days: 60
      token:
        access_token_ttl: "10m"
        refresh_token_ttl: "1d"
        password_reset_token_ttl: "30m"
      rate_limit:
        max_failed_logins: 3
        lockout_duration: "30m"
      # `adaptive_mfa` is NOT a hearth.yaml key — see the note on the
      # customer-portal realm above and docs/specs/CONFIGURATION.md.
      #   adaptive_mfa:
      #     enabled: true
      #     recognition_window_days: 14
      #     fingerprint_hmac_secret: "${HEARTH_REALM_INTERNAL_TOOLS_FINGERPRINT_HMAC_SECRET}"
    organizations:
      platform-team:
        name: "Platform Team"
        description: "Infra + SRE"
      product-team:
        name: "Product Team"
    applications:
      dashboard:
        name: "Internal Dashboard"
        slug: dashboard
        confidential: true
        client_secret: "${DASHBOARD_CLIENT_SECRET}"
        redirect_uris: ["https://dashboard.internal.example.com/callback"]
        grant_types: [authorization_code, refresh_token]
        require_consent: false              # first-party — skip consent prompt
        trust_level: first_party
        consent_spans_orgs: true
        declared_scopes: [openid, profile, email, admin]
      api-service:
        name: "Internal API Service"
        slug: api-service
        confidential: true
        client_secret: "${INTERNAL_API_SECRET}"
        grant_types: [client_credentials]
        trust_level: first_party
        declared_scopes: [admin]
    saml_service_providers:
      jira:
        entity_id: "https://acme.atlassian.net"
        acs_url: "https://acme.atlassian.net/plugins/servlet/samlconsumer"
        slo_url: "https://acme.atlassian.net/plugins/servlet/samlslo"
        sp_certificate_pem: |
          -----BEGIN CERTIFICATE-----
          MIID...replace-with-real-cert...IDAQAB
          -----END CERTIFICATE-----
        sign_assertions: true
        sign_responses: true
        want_authn_requests_signed: false
        nameid_format: emailAddress         # emailAddress | persistent | transient | unspecified
        attribute_map:
          email:      "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"
          givenName:  "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname"
          surname:    "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname"
    permissions:
      - { name: incident.declare,  display_name: "Declare incident",  category: ops }
      - { name: incident.resolve,  display_name: "Resolve incident",  category: ops }
      - { name: deploy.production, display_name: "Deploy to prod",    category: ops }
    roles:
      - name: sre.oncall
        scope_kind: realm
        permissions: [incident.declare, incident.resolve, deploy.production]
        parents: [realm.admin]
    groups:
      - { name: Engineering,  slug: engineering, description: "All engineers" }
      - { name: SRE,          slug: sre,         description: "Oncall rotation" }
      - { name: Leadership,   slug: leadership }
    federation:
      # auto-link on verified email — ACCOUNT-TAKEOVER RISK.
      # Safe here ONLY because this realm federates to exactly one corporate IdP that
      # verifies email addresses. Adding a second connector that does not verify email
      # (GitHub, a generic OIDC IdP that can assert email_verified: true) would let an
      # attacker register upstream with a victim's address and take over the victim's
      # existing Hearth account, roles and permissions. Prefer `confirm` otherwise.
      link_existing_accounts: auto
      providers:
        corp-oidc:
          type: oidc
          display_name: "Corporate SSO"
          issuer: "https://idp.corp.example.com"
          authorization_endpoint: "https://idp.corp.example.com/authorize"
          token_endpoint: "https://idp.corp.example.com/token"
          userinfo_endpoint: "https://idp.corp.example.com/userinfo"
          jwks_uri: "https://idp.corp.example.com/.well-known/jwks.json"
          client_id: "hearth-internal"
          client_secret: "${OKTA_CLIENT_SECRET}"
          scopes: [openid, email, profile, groups]
          claim_mappings: { email: mail, name: cn }

  # --------------------------------------------------------------------------
  # 3) api-gateway — pure machine-to-machine. client_credentials only.
  #    Exercise: confidential clients, JTI revocation, no MFA, no UI traffic.
  # --------------------------------------------------------------------------
  api-gateway:
    session_ttl: "1h"
    web:
      theme: slate
      product_name: "Acme API Gateway"
    auth:
      mfa_required: false
      allowed_auth_methods: [password]
      registration: { mode: disabled }
      dcr: { mode: disabled }
      token:
        access_token_ttl: "5m"
        refresh_token_ttl: "1h"
    applications:
      gateway-service:
        name: "API Gateway Service"
        slug: gateway-service
        confidential: true
        client_secret: "${API_GATEWAY_SECRET}"
        grant_types: [client_credentials]
        trust_level: first_party
        declared_scopes: [api:read, api:write]
      partner-integration:
        name: "Partner Integration"
        slug: partner-integration
        confidential: true
        client_secret: "${API_GATEWAY_SECRET}"
        grant_types: [client_credentials]
        trust_level: third_party
        declared_scopes: [api:read]
    permissions:
      - { name: gateway.invoke, display_name: "Invoke gateway", category: api }
    roles:
      - name: service.client
        scope_kind: realm
        permissions: [gateway.invoke]

  # --------------------------------------------------------------------------
  # 4) legacy-tenant — source realm being migrated out.
  #    Pairs with `new-tenant` (below) which copies users out.
  # --------------------------------------------------------------------------
  legacy-tenant:
    session_ttl: "24h"
    web:
      theme: forest
      product_name: "Legacy Tenant"
    auth:
      registration: { mode: disabled }
    # archive_drop: true                    # would DROP all data on archive — leave false
    # To archive this realm permanently: remove this entry; it becomes soft-archived.

  # --------------------------------------------------------------------------
  # 5) new-tenant — destination realm pulling from legacy-tenant via COPY.
  #    Use `migrate_from:` instead of `copy_from:` to MOVE (and auto-archive source).
  # --------------------------------------------------------------------------
  new-tenant:
    session_ttl: "24h"
    web:
      theme: ocean
      product_name: "New Tenant"
    copy_from: legacy-tenant                # `migrate_from: legacy-tenant` would MOVE instead
    migrate:
      users: true
      orgs: true
      applications: false
      on_conflict: skip                     # error | skip
    auth:
      registration: { mode: open }

