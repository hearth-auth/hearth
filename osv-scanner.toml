# OSV-Scanner configuration — Hearth (HEA-690, HEA-1523)
#
# Scope: production-shipping lockfiles only.
# The lockfile list is maintained in .github/workflows/security.yml (scan-args
# --lockfile flags) — NOT via [[PackageOverrides]] group globs. The `group`
# field in PackageOverrides is a lockfile-internal group name, not a path glob;
# using it as a path filter silently fails (HEA-1523).
#
# Kept in scope (see security.yml scan-args):
#   - Cargo.lock              — root crate (single-binary identity server)
#   - fuzz/Cargo.lock         — fuzz harness depends on production crates
#   - sdks/go/go.mod          — Go SDK shipped to integrators
#   - sdks/{node,php,rust,typescript}/* lockfiles
#   - package-lock.json       — root release tooling (semantic-release); real CVEs must be fixed
#   - docs-site/package-lock.json
#
# Excluded (not listed in security.yml scan-args):
#   - examples/**             — reference apps; lockfiles drift, not security-critical
#   - tests/ui/**             — Playwright runner; dev-time only
#   - sdks/php/vendor/**      — vendored third-party, not our dep tree
#
# CVE suppression policy: [[IgnoredVulns]] entries require a documented
# rationale explaining why the advisory does not affect Hearth's runtime surface
# (e.g., test-only dep, attack vector requires server-side role that the dep
# never occupies, Windows-only path in a Linux-only deployment). Each entry must
# include a ticket reference and a revisit trigger (patched version available).
# Real CVEs in production shipping paths that ARE exploitable MUST NOT be
# suppressed — fix or escalate to SecurityAuditor.
#
# Every entry MUST carry a machine-checkable annotation on the line above it:
#
#   # guard: package=<name> lockfile=<path>
#
# scripts/check-scanner-coverage.sh (R4) verifies that <path> is a lockfile
# security.yml actually scans and that <name> appears in it. Audit 2026-08-28
# §4.12#15 found two suppressions naming packages absent from the tree their
# rationale described: RUSTSEC-2023-0071's reason described the *server's* use
# of `rsa`, but `rsa` is not in the root Cargo.lock at all, and
# GHSA-g7r4-m6w7-qqqr suppressed `esbuild`, which is not installed in any
# scanned lockfile. A suppression that matches nothing is coverage on paper.

# guard: package=rsa lockfile=sdks/rust/Cargo.lock
[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "Marvin Attack timing side-channel in the rsa crate. Scope correction (audit 2026-08-28 §4.12#15): the server does not link rsa at all — it is absent from the root Cargo.lock. rsa reaches exactly one scanned tree, sdks/rust/Cargo.lock, as a transitive dependency of jsonwebtoken. The advisory's only affected code path is PKCS#1 v1.5 decryption; the Rust SDK performs no RSA decryption, and Hearth signs Ed25519 only (CLAUDE.md: no HS256, no alg:none). No patched version of rsa is available; revisit when rsa 0.10+ lands in the jsonwebtoken dependency tree. Tracked in HEA-116."

# guard: package=golang.org/x/crypto lockfile=sdks/go/go.mod
[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is unmaintained and unsafe by design. The advisory covers every x/crypto version (introduced 0, no fix) but only code that imports the openpgp packages. The Go SDK never does: `go list -deps -test ./...` in sdks/go shows x/crypto only as acme, acme/autocert (via labstack/echo), chacha20, chacha20poly1305, hkdf, sha3 and internals — no openpgp path (checked 2026-09-28, x/crypto v0.56.0). Revisit if any SDK dependency starts importing golang.org/x/crypto/openpgp; `go list -deps -test ./... | grep openpgp` must stay empty."

# The next three entries cover copies BUNDLED inside the npm CLI package
# (node_modules/npm/node_modules/...), pulled in by @semantic-release/npm 13
# (requires npm ^11.6.2) for the release workflow only (dev scope). npm ships
# bundleDependencies inside its tarball, so a lockfile update or an
# `overrides` entry cannot change them. npm 11.20.0 is the newest 11.x and still
# bundles ip-address 10.5.0 / undici 6.28.0; npm 12 needs Node 22 and is outside
# @semantic-release/npm's range. The top-level copies are already patched
# (ip-address 10.7.2, undici 6.29.0 / 7.30.0). Revisit when an npm 11.x release
# bundles ip-address >= 10.5.1 and undici >= 6.28.1 (checked 2026-09-28).

# guard: package=ip-address lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-2vr4-cq9g-pvrc"
reason = "ip-address 10.5.0 bundled inside the npm CLI (node_modules/npm/node_modules/ip-address, via npm's socks proxy support) in the release-tooling lockfile; no npm 11.x release bundles 10.5.1 yet. Address6 classification flaw; the release workflow's npm publish uses no IPv6 range classification. Revisit when npm 11.x bundles ip-address >= 10.5.1."

# guard: package=ip-address lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-rpw4-54j3-4h4q"
reason = "Same bundled ip-address 10.5.0 inside the npm CLI (release tooling, dev scope); NAT64 local-use range classification flaw, unused by npm publish. Revisit when npm 11.x bundles ip-address >= 10.5.1."

# guard: package=brace-expansion lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-6j4f-fj2g-mc7p"
reason = "brace-expansion 5.0.9 bundled inside the npm CLI (node_modules/npm/node_modules/brace-expansion, release-tooling lockfile, dev scope); the lockfile's own node_modules/brace-expansion is 5.0.12 (fixed). Checked 2026-09-29: npm 11.20.0 and 12.1.0 both still bundle 5.0.9. DoS by deep recursion in parseCommaParts on a crafted pattern. npm expands only the brace patterns in this repo's own package.json `files` and ignore files, never external input. Revisit when npm bundles brace-expansion >= 5.0.12."

# guard: package=brace-expansion lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-qhr7-859c-m2p7"
reason = "brace-expansion 5.0.9 bundled inside the npm CLI (node_modules/npm/node_modules/brace-expansion, release-tooling lockfile, dev scope); the lockfile's own node_modules/brace-expansion is 5.0.12 (fixed). Checked 2026-09-29: npm 11.20.0 and 12.1.0 both still bundle 5.0.9. DoS by deep recursion on nested brace groups in a crafted pattern. npm expands only the brace patterns in this repo's own package.json `files` and ignore files, never external input. Revisit when npm bundles brace-expansion >= 5.0.12."

# guard: package=brace-expansion lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-q2hr-2g5m-vwhr"
reason = "brace-expansion 5.0.9 bundled inside the npm CLI (node_modules/npm/node_modules/brace-expansion, release-tooling lockfile, dev scope); the lockfile's own node_modules/brace-expansion is 5.0.12 (fixed). Checked 2026-09-29: npm 11.20.0 and 12.1.0 both still bundle 5.0.9. Quadratic CPU on a crafted `{a},b}` pattern. npm expands only the brace patterns in this repo's own package.json `files` and ignore files, never external input. Revisit when npm bundles brace-expansion >= 5.0.12."

# guard: package=ip-address lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-h3mg-xc3c-68pw"
reason = "ip-address 10.5.0 bundled inside the npm CLI (node_modules/npm/node_modules/ip-address, via npm's socks proxy support; release tooling, dev scope); the lockfile's own node_modules/ip-address is 10.7.2 (fixed). npm 11.20.0 and 12.1.0 still bundle 10.5.0 (checked 2026-09-29). The flaw needs a very long attacker-supplied IPv6 string. The release job configures no SOCKS proxy. Revisit when npm bundles ip-address >= 10.7.1."

# guard: package=ip-address lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-j6r3-76f7-8jcv"
reason = "ip-address 10.5.0 bundled inside the npm CLI (node_modules/npm/node_modules/ip-address, via npm's socks proxy support; release tooling, dev scope); the lockfile's own node_modules/ip-address is 10.7.2 (fixed). npm 11.20.0 and 12.1.0 still bundle 10.5.0 (checked 2026-09-29). The flaw is in isInSubnet allowlist checks, which npm does not perform. The release job configures no SOCKS proxy. Revisit when npm bundles ip-address >= 10.7.1."

# guard: package=undici lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-3wwx-pv8p-q78v"
reason = "undici 6.28.0 bundled inside the npm CLI (node_modules/npm/node_modules/undici, via node-gyp header downloads) in the release-tooling lockfile; no npm 11.x release bundles 6.28.1 yet. The flaw is a DoS in undici's WebSocket handling; npm/node-gyp make plain HTTPS requests, no WebSocket. docs-site's undici was upgraded to 7.29.1 instead. Revisit when npm 11.x bundles undici >= 6.28.1."

# guard: package=undici lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-rfgv-xxqx-mfg5"
reason = "Same bundled undici 6.28.0 inside the npm CLI (node_modules/npm/node_modules/undici, release-tooling lockfile, dev scope). Checked 2026-09-29: npm 11.20.0 (the lockfile's version) and npm 12.1.0 (latest) both still bundle undici 6.28.0, so no lockfile change can reach it. The flaw is an uncaught TypeError in undici's WebSocket client handshake; npm/node-gyp open no WebSocket. The root lockfile's own node_modules/undici is 6.29.0 (fixed). Revisit when npm bundles undici >= 6.28.1."

# guard: package=undici lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-r53p-7pc4-xj5r"
reason = "Same bundled undici 6.28.0 inside the npm CLI (release tooling, dev scope; no npm release bundles >= 6.28.1 as of 2026-09-29). The flaw needs undici's retry interceptor AND an application that forwards the resumed response downstream (a proxy/gateway); npm publish only downloads and uploads, it forwards nothing. Revisit when npm bundles undici >= 6.28.1."

# CVE-2026-42507, CVE-2026-42504 and CVE-2026-27145 were removed on 2026-09-28
# (GA audit supply-chain fix). Their reasons blamed google.golang.org/protobuf
# and genproto, but osv.dev aliases them to GO-2026-5039 (net/textproto),
# GO-2026-5038 (mime) and GO-2026-5037 (crypto/x509) — Go STANDARD LIBRARY
# advisories matched against sdks/go/go.mod's `go 1.26.3` directive, fixed in
# go1.26.4. The rationale described the wrong package, so it assessed nothing.
# sdks/go/go.mod now pins `toolchain go1.26.6`, the advisories no longer
# match, and osv-scanner reported the three ignores as unused.

# GHSA-g7r4-m6w7-qqqr (esbuild dev-server file read on Windows) was removed on
# 2026-09-08 by audit 2026-08-28 §4.12#15. Its reason called esbuild an
# "sdks/node devDependency"; esbuild is not installed in sdks/node,
# the then-scanned pnpm-lock.yaml or docs-site/package-lock.json. It appears only as an OPTIONAL
# peer dependency of vite, which npm does not install. The suppression could
# never match, so it was dead configuration claiming a decision had been made.
# If a future vite bump does install esbuild, the advisory fires and is
# assessed then — which is the correct behaviour.

# No [[PackageOverrides]] path-exclusion entries — scope is controlled via
# explicit --lockfile flags in security.yml, which is the correct mechanism.
