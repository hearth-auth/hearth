# OSV-Scanner configuration — Hearth (HEA-690, HEA-1523)
#
# Scope: production-shipping lockfiles only.
# The lockfile list is maintained in .github/workflows/security.yml (scan-args
# --lockfile flags) — NOT via [[PackageOverrides]] group globs. The `group`
# field in PackageOverrides is a lockfile-internal group name, not a path glob;
# using it as a path filter silently fails (HEA-1523).
#
# Kept in scope (see security.yml scan-args):
#   - Cargo.lock              — root crate (single-binary identity server)
#   - fuzz/Cargo.lock         — fuzz harness depends on production crates
#   - sdks/go/go.mod          — Go SDK shipped to integrators
#   - sdks/{node,php,rust,typescript}/* lockfiles
#   - package-lock.json       — root release tooling (semantic-release); real CVEs must be fixed
#   - docs-site/package-lock.json
#
# Excluded (not listed in security.yml scan-args):
#   - examples/**             — reference apps; lockfiles drift, not security-critical
#   - tests/ui/**             — Playwright runner; dev-time only
#   - sdks/php/vendor/**      — vendored third-party, not our dep tree
#
# CVE suppression policy: [[IgnoredVulns]] entries require a documented
# rationale explaining why the advisory does not affect Hearth's runtime surface
# (e.g., test-only dep, attack vector requires server-side role that the dep
# never occupies, Windows-only path in a Linux-only deployment). Each entry must
# include a ticket reference and a revisit trigger (patched version available).
# Real CVEs in production shipping paths that ARE exploitable MUST NOT be
# suppressed — fix or escalate to SecurityAuditor.
#
# Every entry MUST carry a machine-checkable annotation on the line above it:
#
#   # guard: package=<name> lockfile=<path>
#
# scripts/check-scanner-coverage.sh (R4) verifies that <path> is a lockfile
# security.yml actually scans and that <name> appears in it. Audit 2026-08-28
# §4.12#15 found two suppressions naming packages absent from the tree their
# rationale described: RUSTSEC-2023-0071's reason described the *server's* use
# of `rsa`, but `rsa` is not in the root Cargo.lock at all, and
# GHSA-g7r4-m6w7-qqqr suppressed `esbuild`, which is not installed in any
# scanned lockfile. A suppression that matches nothing is coverage on paper.

# guard: package=golang.org/x/crypto lockfile=sdks/go/go.mod
[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is unmaintained and unsafe by design. The advisory covers every x/crypto version (introduced 0, no fix) but only code that imports the openpgp packages. The Go SDK never does: `go list -deps -test ./...` in sdks/go shows x/crypto only as acme, acme/autocert (via labstack/echo), chacha20, chacha20poly1305, hkdf, sha3 and internals — no openpgp path (checked 2026-09-28, x/crypto v0.56.0). Revisit if any SDK dependency starts importing golang.org/x/crypto/openpgp; `go list -deps -test ./... | grep openpgp` must stay empty."

# The next three entries cover copies BUNDLED inside the npm CLI package
# (node_modules/npm/node_modules/...), pulled in by @semantic-release/npm 13
# (requires npm ^11.6.2) for the release workflow only (dev scope). npm ships
# bundleDependencies inside its tarball, so a lockfile update or an
# `overrides` entry cannot change them. The lockfile's npm is 11.21.1, the
# newest 11.x; npm 12 needs Node 22 and is outside @semantic-release/npm's
# range. npm 11.21.1 bundles fixed brace-expansion, http-cache-semantics,
# postcss-selector-parser, ip-address >= 10.7.1 and undici >= 6.28.1, so the
# 12 ignores for those copies were removed on 2026-10-23. The release workflow
# installs with `npm install --ignore-scripts` (semantic-release.yml).

# guard: package=ip-address lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-rxp7-6hxx-x8q5"
reason = "ip-address 10.7.2 bundled inside the npm CLI 11.21.1 (node_modules/npm/node_modules/ip-address, via npm's socks proxy support; release tooling, dev scope); the lockfile's own node_modules/ip-address is 10.7.4 (fixed). Checked 2026-10-23: npm 11.21.1 and 12.2.1 bundle 10.7.2, which is affected (< 10.7.4). Address6 strips a zone identifier in quadratic time from a crafted string of many `%` characters and a line terminator. npm reaches Address6 only through a SOCKS proxy, and the release job configures no SOCKS proxy. Revisit when npm bundles ip-address >= 10.7.4."

# guard: package=undici lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-4qv8-2p9j-2685"
reason = "undici 6.29.0 bundled inside the npm CLI 11.21.1 (node_modules/npm/node_modules/undici, used only by node-gyp to download Node headers; release tooling, dev scope); the lockfile's own copies are 6.29.1 and 7.30.1 (fixed). Checked 2026-10-23: 11.21.1 is the newest npm 11.x. Unbounded memory in undici's EventSource parser; node-gyp opens no EventSource, and the release job installs with --ignore-scripts, so node-gyp does not run. Revisit when npm bundles undici >= 6.29.1."

# guard: package=undici lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-xjj6-f33q-929c"
reason = "Same bundled undici 6.29.0 inside the npm CLI 11.21.1 (release tooling, dev scope); the lockfile's own copies are 6.29.1 and 7.30.1 (fixed). An unhandled error on a response with too many content-encodings lets a malicious server crash the client. Only node-gyp uses this copy, to download Node headers, and the release job installs with --ignore-scripts, so node-gyp does not run. Revisit when npm bundles undici >= 6.29.1."

# guard: package=undici lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-qrxm-fqhp-jwvm"
reason = "Same bundled undici 6.29.0 inside the npm CLI 11.21.1 (release tooling, dev scope); the lockfile's own copies are 6.29.1 and 7.30.1 (fixed). Checked 2026-10-27 (#677): 11.21.1 is still the newest npm 11.x, and inside npm's bundle only node-gyp depends on undici. node-gyp uses it only to download Node headers, and every release job installs with --ignore-scripts, so node-gyp does not run. A server that changes its certificate during a TLS 1.2 renegotiation can make the client loop (denial of service). Revisit when npm bundles undici >= 6.29.1."

# guard: package=undici lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-9fm3-97px-rjf6"
reason = "Same bundled undici 6.29.0 inside the npm CLI 11.21.1 (release tooling, dev scope); the lockfile's own copies are 6.29.1 and 7.30.1 (fixed). Checked 2026-10-27 (#677): 11.21.1 is still the newest npm 11.x, and inside npm's bundle only node-gyp depends on undici. node-gyp uses it only to download Node headers, and every release job installs with --ignore-scripts, so node-gyp does not run. The WebSocket client buffers automatic PONG replies without a bound (denial of service); node-gyp opens no WebSocket. Revisit when npm bundles undici >= 6.29.1."

# guard: package=undici lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-2m5v-pch6-74hx"
reason = "Same bundled undici 6.29.0 inside the npm CLI 11.21.1 (release tooling, dev scope); the lockfile's own copies are 6.29.1 and 7.30.1 (fixed). Checked 2026-10-27 (#677): 11.21.1 is still the newest npm 11.x, and inside npm's bundle only node-gyp depends on undici. node-gyp uses it only to download Node headers, and every release job installs with --ignore-scripts, so node-gyp does not run. An Agent drops some tls options, so a certificate check can be skipped. Revisit when npm bundles undici >= 6.29.1."

# guard: package=deepmerge lockfile=docs-site/package-lock.json
[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
reason = "deepmerge 4.3.1 in the docs-site lockfile (low severity; no fixed release exists, checked 2026-10-27, #677). Its only dependent is @svgr/plugin-svgo 8.1.0, a build-time plugin that turns the docs site's own SVG files into components. That version declares deepmerge but never loads it: its dist/index.js requires only svgo and cosmiconfig (read on 2026-10-27). So the flawed mergeObject() never runs, and deepmerge does not ship in the site's pages, the server or an SDK. The flaw lets a crafted input object poison the prototype of the merged result. Revisit when deepmerge publishes a fixed release or the docs site drops @svgr/plugin-svgo."

# zod has no fixed 3.x release, and the root lockfile's only zod 3 dependent is
# a local developer tool. Revisit when context-mode accepts zod 4.

# guard: package=zod lockfile=package-lock.json
[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
reason = "zod 3.25.76 in the root lockfile (dev scope) is required by context-mode (zod ^3.25.0; 1.0.169 is the newest release, checked 2026-10-23) and accepted by @modelcontextprotocol/sdk. Both are local developer tools in the root devDependencies. The fix exists only in zod 4.6.6, outside context-mode's range. The release workflow installs them with --ignore-scripts and never runs them, and neither ships in the server binary or an SDK. The flaw is memory exhaustion when zod validates an oversized constrained collection. Revisit when context-mode accepts zod >= 4.6.6."

# GHSA-vfj7-8cjw-p6xm (braces 3.0.3, stack exhaustion) was ignored until
# 2026-10-23, when GitHub withdrew the advisory and osv-scanner reported the
# ignore as unused.

# CVE-2026-42507, CVE-2026-42504 and CVE-2026-27145 were removed on 2026-09-28
# (GA audit supply-chain fix). Their reasons blamed google.golang.org/protobuf
# and genproto, but osv.dev aliases them to GO-2026-5039 (net/textproto),
# GO-2026-5038 (mime) and GO-2026-5037 (crypto/x509) — Go STANDARD LIBRARY
# advisories matched against sdks/go/go.mod's `go 1.26.3` directive, fixed in
# go1.26.4. The rationale described the wrong package, so it assessed nothing.
# sdks/go/go.mod then pinned `toolchain go1.26.6` (go1.26.10 since
# 2026-10-23), the advisories no longer matched, and osv-scanner reported the
# three ignores as unused.

# GHSA-g7r4-m6w7-qqqr (esbuild dev-server file read on Windows) was removed on
# 2026-09-08 by audit 2026-08-28 §4.12#15. Its reason called esbuild an
# "sdks/node devDependency"; esbuild is not installed in sdks/node,
# the then-scanned pnpm-lock.yaml or docs-site/package-lock.json. It appears only as an OPTIONAL
# peer dependency of vite, which npm does not install. The suppression could
# never match, so it was dead configuration claiming a decision had been made.
# If a future vite bump does install esbuild, the advisory fires and is
# assessed then — which is the correct behaviour.

# No [[PackageOverrides]] path-exclusion entries — scope is controlled via
# explicit --lockfile flags in security.yml, which is the correct mechanism.
