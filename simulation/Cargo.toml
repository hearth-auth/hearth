[package]
name = "hearth-simulation"
version = "0.1.0"
edition = "2021"
description = "Deterministic simulation tests for Hearth storage and identity engines"
license = "Apache-2.0"
publish = false

[dependencies]
hearth = { path = "..", features = ["test-hooks"] }
madsim = "0.2"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
crc32fast = "1"
proptest = "1"
